<script>
"use strict";

/* =========================================================
   BYBIT INSTITUTIONAL ORDERFLOW v13 PRO
   Browser / iPhone / GitHub Pages
   Analytical scanner only — NO order execution
   ========================================================= */

const CONFIG = {
  CATEGORY: "linear",
  REST_BASE: "https://api.bybit.com",
  WS_URL: "wss://stream.bybit.com/v5/public/linear",

  TOP_SYMBOLS: 100,

  ORDERBOOK_DEPTH: 50,
  ORDERBOOK_DISTANCE: 0.008,

  FLOW_WINDOW_MS: 20000,
  FLOW_BASELINE_MS: 120000,
  FLOW_FRESH_MS: 12000,
  MIN_FLOW_USD: 25000,

  MAX_TRADES: 1000,

  WALL_MIN_AGE_MS: 4000,
  WALL_STABLE_MS: 10000,
  WALL_TTL_MS: 30000,
  WALL_DISTANCE: 0.008,

  MIN_WALL_RATIO: 3.5,
  MIN_WALL_CONCENTRATION: 0.50,

  SCAN_MS: 250,
  MANAGER_MS: 700,
  UI_MS: 800,

  SIGNAL_TTL_MS: 15 * 60 * 1000,
  ENTRY_WINDOW_MS: 45000,

  COOLDOWN_MS: 90000,
  SETUP_COOLDOWN_MS: 180000,

  MIN_SCORE: 72,
  MIN_DIRECTION_MARGIN: 12,
  MIN_RR: 1.5,

  MAX_SPREAD_PCT: 0.12,

  WS_GROUP_SIZE: 20,
  WS_PING_MS: 20000,
  WS_STALE_MS: 9000,

  HTF_REFRESH_MS: 15 * 60 * 1000,
  HTF_BATCH: 3,
  HTF_DELAY_MS: 350,

  DEBUG: false
};

const EXCLUDED = new Set([
  "BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT","DOGEUSDT"
]);

const books = new Map();
const trades = new Map();
const market = new Map();
const instruments = new Map();
const htf = new Map();
const walls = new Map();
const signals = new Map();
const cooldowns = new Map();
const sockets = [];

let running = false;
let engineTimer = null;
let managerTimer = null;
let uiTimer = null;
let universeTimer = null;
let htfTimer = null;

let scanCycle = 0;
let lastEngineTick = 0;
let globalErrors = 0;

let currentUniverseKey = "";

const $ = id => document.getElementById(id);

function now(){
  return Date.now();
}

function num(v,d=0){
  const n=Number(v);
  return Number.isFinite(n)?n:d;
}

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function sleep(ms){
  return new Promise(r=>setTimeout(r,ms));
}

function fmtUsd(v){
  v=num(v);
  if(v>=1000000)return "$"+(v/1000000).toFixed(2)+"M";
  if(v>=1000)return "$"+(v/1000).toFixed(1)+"K";
  return "$"+Math.round(v);
}

function fmtPrice(v){
  v=num(v);
  if(!v)return "—";
  if(v>=1000)return v.toLocaleString("en-US",{maximumFractionDigits:2});
  if(v>=1)return v.toFixed(4);
  if(v>=.01)return v.toFixed(5);
  return v.toPrecision(6);
}

function fmtPct(v){
  return num(v).toFixed(3)+"%";
}

function tickRound(symbol,price){
  const m=instruments.get(symbol);
  const tick=num(m?.tickSize);
  if(!tick)return price;
  return Math.round(price/tick)*tick;
}

function pricePct(a,b){
  a=num(a);b=num(b);
  if(!a||!b)return 999;
  return Math.abs(a-b)/b*100;
}

function log(msg){
  if(!CONFIG.DEBUG)return;
  const el=$("diagnostics");
  if(!el)return;
  el.textContent=(new Date().toLocaleTimeString()+" "+msg+"\n"+el.textContent).slice(0,6000);
}

function setStatus(text,type=""){
  $("statusText").textContent=text;
  $("statusDot").className="dot "+type;
}

function ensureBook(symbol){
  if(!books.has(symbol)){
    books.set(symbol,{
      bids:new Map(),
      asks:new Map(),
      lastPrice:0,
      lastTradePrice:0,
      bestBid:0,
      bestAsk:0,
      spreadPct:999,
      updateId:0,
      seq:0,
      valid:false,
      lastRx:0,
      lastCts:0,
      snapshotAt:0,
      resyncing:false
    });
  }
  return books.get(symbol);
}

function ensureTrades(symbol){
  if(!trades.has(symbol))trades.set(symbol,[]);
  return trades.get(symbol);
}

function ensureHealth(symbol){
  const b=ensureBook(symbol);
  if(!b.health){
    b.health={
      bookRx:0,
      tradeRx:0,
      lastBookCts:0,
      lastTradeTs:0,
      sequenceResets:0,
      reconnects:0,
      errors:0
    };
  }
  return b.health;
}

function markCooldown(symbol,side,ms){
  cooldowns.set(symbol+":"+side,now()+ms);
}

function cooldownActive(symbol,side){
  return num(cooldowns.get(symbol+":"+side))>now();
}

function getCurrentPrice(symbol){
  const b=books.get(symbol);
  const m=market.get(symbol);
  return num(
    b?.lastTradePrice ||
    b?.lastPrice ||
    m?.lastPrice ||
    ((b?.bestBid||0)+(b?.bestAsk||0))/2
  );
}

function isBookFresh(symbol){
  const b=books.get(symbol);
  return !!(
    b &&
    b.valid &&
    b.bestBid>0 &&
    b.bestAsk>0 &&
    now()-b.lastRx<CONFIG.WS_STALE_MS
  );
}

function isTradeFresh(symbol){
  const b=books.get(symbol);
  return !!(b?.health?.tradeRx && now()-b.health.tradeRx<CONFIG.FLOW_FRESH_MS);
}

function currentUniverse(){
  return [...market.values()]
    .sort((a,b)=>b.turnover24h-a.turnover24h)
    .slice(0,CONFIG.TOP_SYMBOLS)
    .map(x=>x.symbol);
}

/* =========================================================
   REST
   ========================================================= */

async function rest(path,params={},timeout=12000){
  const qs=new URLSearchParams(params);
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);

  try{
    const r=await fetch(CONFIG.REST_BASE+path+"?"+qs,{
      signal:controller.signal,
      cache:"no-store"
    });

    if(!r.ok)throw new Error("HTTP "+r.status);

    const j=await r.json();

    if(j.retCode!==0)throw new Error(j.retMsg||"Bybit error");

    return j;
  }finally{
    clearTimeout(timer);
  }
}

async function loadInstruments(){
  let cursor="";

  do{
    const p={
      category:"linear",
      limit:"1000"
    };

    if(cursor)p.cursor=cursor;

    const j=await rest("/v5/market/instruments-info",p);

    for(const x of j.result.list||[]){
      if(
        x.status==="Trading" &&
        x.contractType==="LinearPerpetual" &&
        x.quoteCoin==="USDT"
      ){
        instruments.set(x.symbol,{
          symbol:x.symbol,
          tickSize:num(x.priceFilter?.tickSize),
          qtyStep:num(x.lotSizeFilter?.qtyStep),
          minOrderQty:num(x.lotSizeFilter?.minOrderQty)
        });
      }
    }

    cursor=j.result.nextPageCursor||"";

    if(cursor)await sleep(150);

  }while(cursor);

  log("instruments "+instruments.size);
}

async function loadUniverse(){
  const j=await rest("/v5/market/tickers",{
    category:"linear"
  });

  const arr=[];

  for(const x of j.result.list||[]){
    const symbol=x.symbol;

    if(
      !symbol.endsWith("USDT") ||
      EXCLUDED.has(symbol) ||
      !instruments.has(symbol)
    )continue;

    const price=num(x.lastPrice);
    const turnover=num(x.turnover24h);

    if(price<=0||turnover<=0)continue;

    arr.push({
      symbol,
      lastPrice:price,
      turnover24h:turnover,
      fundingRate:num(x.fundingRate),
      openInterest:num(x.openInterest),
      markPrice:num(x.markPrice),
      indexPrice:num(x.indexPrice)
    });
  }

  arr.sort((a,b)=>b.turnover24h-a.turnover24h);

  market.clear();

  arr.slice(0,CONFIG.TOP_SYMBOLS).forEach((x,i)=>{
    x.rank=i+1;
    market.set(x.symbol,x);
    ensureBook(x.symbol);
    ensureTrades(x.symbol);
    ensureHealth(x.symbol);
  });

  return currentUniverse();
}

async function loadKlines(symbol,interval,limit=120){
  const j=await rest("/v5/market/kline",{
    category:"linear",
    symbol,
    interval,
    limit:String(limit)
  });

  const out=[];

  for(const k of j.result.list||[]){
    const start=num(k[0]);
    const open=num(k[1]);
    const high=num(k[2]);
    const low=num(k[3]);
    const close=num(k[4]);

    if(!start||!open||!high||!low||!close)continue;

    const mins=Number(interval);
    const end=start+(Number.isFinite(mins)?mins:15)*60000;

    if(end>=now())continue;

    out.push({start,open,high,low,close,end});
  }

  return out.reverse();
}

function atr(candles,n=14){
  if(candles.length<n+1)return 0;

  const trs=[];

  for(let i=1;i<candles.length;i++){
    const c=candles[i];
    const p=candles[i-1];

    trs.push(Math.max(
      c.high-c.low,
      Math.abs(c.high-p.close),
      Math.abs(c.low-p.close)
    ));
  }

  let a=trs.slice(0,n).reduce((x,y)=>x+y,0)/n;

  for(let i=n;i<trs.length;i++){
    a=((a*(n-1))+trs[i])/n;
  }

  return a;
}

function swingZones(candles){
  const zones=[];

  for(let i=2;i<candles.length-2;i++){
    const c=candles[i];

    if(
      c.low<=candles[i-1].low &&
      c.low<=candles[i-2].low &&
      c.low<candles[i+1].low &&
      c.low<candles[i+2].low
    ){
      zones.push({
        type:"SUPPORT",
        price:c.low,
        strength:1,
        time:c.end
      });
    }

    if(
      c.high>=candles[i-1].high &&
      c.high>=candles[i-2].high &&
      c.high>candles[i+1].high &&
      c.high>candles[i+2].high
    ){
      zones.push({
        type:"RESISTANCE",
        price:c.high,
        strength:1,
        time:c.end
      });
    }
  }

  return zones;
}

function mergeZones(zones){
  const result=[];

  for(const z of zones.sort((a,b)=>a.price-b.price)){
    const existing=result.find(x=>
      x.type===z.type &&
      pricePct(x.price,z.price)<=0.18
    );

    if(existing){
      existing.price=(existing.price+z.price)/2;
      existing.strength+=z.strength;
    }else{
      result.push({...z});
    }
  }

  return result;
}

async function refreshHTFSymbol(symbol){
  try{
    const [m15,h1,h4]=await Promise.all([
      loadKlines(symbol,"15",160),
      loadKlines(symbol,"60",120),
      loadKlines(symbol,"240",100)
    ]);

    const all=[
      ...swingZones(m15).map(x=>({...x,tf:"15M"})),
      ...swingZones(h1).map(x=>({...x,tf:"1H"})),
      ...swingZones(h4).map(x=>({...x,tf:"4H"}))
    ];

    htf.set(symbol,{
      zones:mergeZones(all),
      atr15:atr(m15,14),
      atr60:atr(h1,14),
      atr240:atr(h4,14),
      updatedAt:now()
    });

  }catch(e){
    globalErrors++;
    log("HTF "+symbol+" "+e.message);
  }
}

async function refreshHTF(){
  const syms=currentUniverse();

  for(let i=0;i<syms.length;i+=CONFIG.HTF_BATCH){
    if(!running)return;

    const batch=syms.slice(i,i+CONFIG.HTF_BATCH);

    await Promise.all(batch.map(refreshHTFSymbol));

    await sleep(CONFIG.HTF_DELAY_MS);
  }
}

function nearestHTF(symbol,price,type){
  const data=htf.get(symbol);

  if(!data)return null;

  const candidates=data.zones.filter(z=>{
    if(type==="SUPPORT")return z.price<price;
    return z.price>price;
  });

  candidates.sort((a,b)=>{
    const da=Math.abs(a.price-price);
    const db=Math.abs(b.price-price);
    return da-db;
  });

  return candidates[0]||null;
}

/* =========================================================
   ORDERBOOK
   ========================================================= */

function resetBook(symbol){
  const b=ensureBook(symbol);

  b.bids.clear();
  b.asks.clear();
  b.bestBid=0;
  b.bestAsk=0;
  b.valid=false;
  b.resyncing=true;
  b.updateId=0;
  b.seq=0;
}

function applyLevels(map,levels){
  for(const x of levels||[]){
    const p=num(x[0]);
    const q=num(x[1]);

    if(p<=0)continue;

    if(q<=0)map.delete(p);
    else map.set(p,q);
  }
}

function recalcBook(symbol){
  const b=ensureBook(symbol);

  let bid=0;
  let ask=0;

  for(const p of b.bids.keys()){
    if(p>bid)bid=p;
  }

  for(const p of b.asks.keys()){
    if(!ask||p<ask)ask=p;
  }

  b.bestBid=bid;
  b.bestAsk=ask;

  if(bid&&ask){
    b.spreadPct=(ask-bid)/((ask+bid)/2)*100;
  }else{
    b.spreadPct=999;
  }
}

function handleOrderbook(message){
  const d=message.data||{};
  const symbol=d.s||String(message.topic||"").split(".").pop();

  if(!market.has(symbol))return;

  const b=ensureBook(symbol);
  const type=message.type;
  const u=num(d.u);
  const seq=num(d.seq);

  if(type==="snapshot"){
    resetBook(symbol);

    applyLevels(b.bids,d.b);
    applyLevels(b.asks,d.a);

    b.updateId=u;
    b.seq=seq;
    b.valid=true;
    b.resyncing=false;
    b.snapshotAt=now();
    b.lastRx=now();
    b.lastCts=num(message.cts)||now();

    recalcBook(symbol);

    const h=ensureHealth(symbol);
    h.bookRx=now();
    h.lastBookCts=b.lastCts;

    return;
  }

  if(type!=="delta"||!b.valid)return;

  /*
    Bybit's `u` is the orderbook update ID.
    We only require monotonicity here.
    `seq` is NOT assumed to be consecutive.
  */
  if(u && b.updateId && u<b.updateId){
    return;
  }

  if(u && u===b.updateId){
    return;
  }

  applyLevels(b.bids,d.b);
  applyLevels(b.asks,d.a);

  b.updateId=u||b.updateId;
  b.seq=seq||b.seq;
  b.lastRx=now();
  b.lastCts=num(message.cts)||b.lastCts;

  recalcBook(symbol);

  const h=ensureHealth(symbol);
  h.bookRx=now();
  h.lastBookCts=b.lastCts;
}

function getLevels(symbol,side){
  const b=books.get(symbol);
  if(!b)return [];

  const price=getCurrentPrice(symbol);
  if(!price)return [];

  const map=side==="BID"?b.bids:b.asks;

  const arr=[];

  for(const [p,q] of map){
    const distance=Math.abs(p-price)/price;

    if(distance<=CONFIG.ORDERBOOK_DISTANCE){
      arr.push({
        price:p,
        qty:q,
        usd:p*q,
        distance
      });
    }
  }

  arr.sort((a,b)=>side==="BID"?b.price-a.price:a.price-b.price);

  return arr;
}

function median(a){
  if(!a.length)return 0;
  const x=[...a].sort((a,b)=>a-b);
  const m=Math.floor(x.length/2);
  return x.length%2?x[m]:(x[m-1]+x[m])/2;
}

function localLiquidity(symbol,side){
  const levels=getLevels(symbol,side);
  const values=levels.map(x=>x.usd).filter(x=>x>0);

  return {
    levels,
    median:median(values),
    mean:values.length?values.reduce((a,b)=>a+b,0)/values.length:0,
    total:values.reduce((a,b)=>a+b,0)
  };
}

function adaptiveWallThreshold(symbol,side){
  const m=market.get(symbol);
  const l=localLiquidity(symbol,side);

  const turnover=num(m?.turnover24h);

  let floor=15000;

  if(turnover>=5e9)floor=750000;
  else if(turnover>=1e9)floor=400000;
  else if(turnover>=300e6)floor=200000;
  else if(turnover>=100e6)floor=100000;
  else if(turnover>=30e6)floor=50000;
  else floor=20000;

  const turnoverPart=turnover*0.00001;
  const localPart=Math.max(
    l.median*4,
    l.mean*2.8
  );

  return Math.max(
    floor,
    turnoverPart,
    localPart
  );
}

function clusterWalls(symbol,side){
  const levels=getLevels(symbol,side);

  if(!levels.length)return [];

  const price=getCurrentPrice(symbol);
  const tick=num(instruments.get(symbol)?.tickSize);

  const gap=Math.max(
    tick*12,
    price*0.00022
  );

  const clusters=[];

  for(const l of levels){
    let c=clusters.find(x=>Math.abs(x.center-l.price)<=gap);

    if(!c){
      c={
        side,
        center:l.price,
        totalUsd:0,
        maxUsd:0,
        levels:[],
        distance:Math.abs(l.price-price)/price
      };
      clusters.push(c);
    }

    c.totalUsd+=l.usd;
    c.maxUsd=Math.max(c.maxUsd,l.usd);
    c.levels.push(l);
    c.center=(c.center+l.price)/2;
  }

  const threshold=adaptiveWallThreshold(symbol,side);

  return clusters.map(c=>{
    const concentration=c.maxUsd/Math.max(c.totalUsd,1);
    const ratio=c.totalUsd/Math.max(threshold,1);

    return {
      ...c,
      concentration,
      ratio,
      threshold
    };
  }).filter(c=>
    c.maxUsd>=c.threshold &&
    c.ratio>=CONFIG.MIN_WALL_RATIO &&
    c.concentration>=CONFIG.MIN_WALL_CONCENTRATION &&
    c.distance<=CONFIG.WALL_DISTANCE
  );
}
 /* =========================================================
   PART 2/8
   WEBSOCKET ENGINE + TRADE FLOW + CONNECTION RECOVERY
   ========================================================= */

function wallKey(symbol,side,price){
  const tick=num(instruments.get(symbol)?.tickSize)||0.0001;
  const bucket=Math.max(tick*8,price*0.00012);
  return symbol+":"+side+":"+Math.round(price/bucket);
}

/* ---------- Trade Engine ---------- */

function handleTrades(message){

  const list=message.data||[];

  for(const t of list){

    const symbol=t.s;

    if(!market.has(symbol))continue;

    const buf=ensureTrades(symbol);
    const book=ensureBook(symbol);

    const price=num(t.p);
    const qty=num(t.v);

    if(price<=0||qty<=0)continue;

    // Bybit: S = Buy / Sell
    const side=String(t.S||"").toUpperCase();

    buf.push({
      id:t.i,
      price,
      qty,
      usd:price*qty,
      side,
      exchangeTime:num(t.T)||now(),
      receivedTime:now()
    });

    while(buf.length>CONFIG.MAX_TRADES){
      buf.shift();
    }

    const cut=now()-CONFIG.FLOW_BASELINE_MS;

    while(buf.length&&buf[0].receivedTime<cut){
      buf.shift();
    }

    book.lastTradePrice=price;
    book.lastPrice=price;

    const h=ensureHealth(symbol);
    h.tradeRx=now();
    h.lastTradeTs=num(t.T)||now();
  }

}

/* ---------- Flow ---------- */

function recentTrades(symbol,windowMs){

  const buf=trades.get(symbol)||[];

  const cut=now()-windowMs;

  return buf.filter(x=>x.receivedTime>=cut);

}

function aggressiveFlow(symbol){

  const arr=recentTrades(symbol,CONFIG.FLOW_WINDOW_MS);

  let buy=0;
  let sell=0;

  for(const t of arr){

    if(t.side==="BUY")buy+=t.usd;
    else if(t.side==="SELL")sell+=t.usd;

  }

  const total=buy+sell;

  return{
    buy,
    sell,
    total,
    delta:buy-sell,
    imbalance:total?(buy-sell)/total:0
  };

}

function baselineFlow(symbol){

  const arr=recentTrades(symbol,CONFIG.FLOW_BASELINE_MS);

  const buckets=new Map();

  for(const t of arr){

    const k=Math.floor(t.receivedTime/5000);

    buckets.set(k,(buckets.get(k)||0)+t.usd);

  }

  const values=[...buckets.values()].sort((a,b)=>a-b);

  const med=median(values);

  return{
    median:med,
    intensity:med?aggressiveFlow(symbol).total/(med*4):0
  };

}

/* =========================================================
   WEBSOCKET MANAGER
   ========================================================= */

let socketCounter=0;

function currentSocketGroups(){

  const symbols=currentUniverse();

  const groups=[];

  for(let i=0;i<symbols.length;i+=CONFIG.WS_GROUP_SIZE){
    groups.push(symbols.slice(i,i+CONFIG.WS_GROUP_SIZE));
  }

  return groups;

}

function closeSockets(){

  while(sockets.length){

    const s=sockets.pop();

    s.manual=true;

    clearInterval(s.ping);

    clearTimeout(s.reconnect);

    try{s.ws.close();}catch(e){}

  }

}

function buildSocket(group){

  const state={
    id:++socketCounter,
    symbols:group,
    ws:null,
    ping:null,
    reconnect:null,
    manual:false,
    attempt:0,
    lastRx:0
  };

  function connect(){

    if(state.manual||!running)return;

    const ws=new WebSocket(CONFIG.WS_URL);

    state.ws=ws;

    ws.onopen=()=>{

      state.attempt=0;
      state.lastRx=now();

      const args=[];

      for(const symbol of group){

        resetBook(symbol);

        args.push(`orderbook.${CONFIG.ORDERBOOK_DEPTH}.${symbol}`);
        args.push(`publicTrade.${symbol}`);

      }

      ws.send(JSON.stringify({
        op:"subscribe",
        args
      }));

      state.ping=setInterval(()=>{

        if(ws.readyState===WebSocket.OPEN){

          ws.send(JSON.stringify({op:"ping"}));

        }

      },CONFIG.WS_PING_MS);

    };

    ws.onmessage=e=>{

      state.lastRx=now();

      let msg;

      try{
        msg=JSON.parse(e.data);
      }catch{
        return;
      }

      if(msg.op==="pong")return;

      if(msg.topic?.startsWith("orderbook.")){
        handleOrderbook(msg);
      }else if(msg.topic?.startsWith("publicTrade.")){
        handleTrades(msg);
      }

    };

    ws.onerror=()=>{

      globalErrors++;

    };

    ws.onclose=()=>{

      clearInterval(state.ping);

      if(state.manual||!running)return;

      for(const s of group){

        resetBook(s);

        ensureHealth(s).reconnects++;

      }

      reconnect();

    };

  }

  function reconnect(){

    const delay=Math.min(
      15000,
      1000*Math.pow(2,state.attempt++)
    );

    state.reconnect=setTimeout(connect,delay);

  }

  state.connect=connect;

  connect();

  return state;

}

function openSockets(){

  closeSockets();

  const groups=currentSocketGroups();

  for(const g of groups){
    sockets.push(buildSocket(g));
  }

}

/* =========================================================
   WATCHDOG
   ========================================================= */

function watchdog(){

  const t=now();

  for(const socket of sockets){

    if(!socket.ws)continue;

    if(
      socket.ws.readyState===WebSocket.OPEN &&
      t-socket.lastRx>CONFIG.WS_STALE_MS
    ){

      try{
        socket.ws.close();
      }catch(e){}

    }

  }

  for(const symbol of currentUniverse()){

    const b=books.get(symbol);

    if(!b)continue;

    if(
      b.valid &&
      t-b.lastRx>CONFIG.WS_STALE_MS
    ){

      resetBook(symbol);

      const sock=sockets.find(x=>x.symbols.includes(symbol));

      if(sock&&sock.ws.readyState===WebSocket.OPEN){

        sock.ws.send(JSON.stringify({
          op:"unsubscribe",
          args:[
            `orderbook.${CONFIG.ORDERBOOK_DEPTH}.${symbol}`,
            `publicTrade.${symbol}`
          ]
        }));

        sock.ws.send(JSON.stringify({
          op:"subscribe",
          args:[
            `orderbook.${CONFIG.ORDERBOOK_DEPTH}.${symbol}`,
            `publicTrade.${symbol}`
          ]
        }));

      }

    }

  }

}

 /* =========================================================
   PART 3/8
   INSTITUTIONAL WALL ENGINE
   Spoof / Iceberg / Replenishment / Absorption
   ========================================================= */

function wallState(symbol, side, price){

  const key=wallKey(symbol,side,price);

  if(!walls.has(key)){

    walls.set(key,{

      key,
      symbol,
      side,
      price,

      firstSeen:now(),
      lastSeen:now(),

      peakUsd:0,
      currentUsd:0,

      removedUsd:0,
      addedUsd:0,

      executedUsd:0,
      cancelledUsd:0,

      replenishments:0,
      tests:0,

      state:"NEW",

      absorption:0,
      spoof:0,

      lastPriceDistance:999

    });

  }

  return walls.get(key);

}

/* ---------- Wall update ---------- */

function updateWall(symbol, cluster){

  const state=wallState(symbol,cluster.side,cluster.center);

  const previous=state.currentUsd||cluster.maxUsd;

  state.lastSeen=now();
  state.price=cluster.center;
  state.currentUsd=cluster.maxUsd;
  state.peakUsd=Math.max(state.peakUsd,cluster.maxUsd);

  const delta=cluster.maxUsd-previous;

  if(delta>0){

    state.addedUsd+=delta;

  }else if(delta<0){

    state.removedUsd+=Math.abs(delta);

  }

  const flow=aggressiveFlow(symbol);

  const attack=cluster.side==="BID"
    ?flow.sell
    :flow.buy;

  const reduction=Math.max(previous-cluster.maxUsd,0);

  const executed=Math.min(reduction,attack);

  state.executedUsd=executed;
  state.cancelledUsd=Math.max(reduction-executed,0);

  state.absorption=state.peakUsd
    ?executed/state.peakUsd
    :0;

  state.spoof=reduction
    ?state.cancelledUsd/reduction
    :0;

  const price=getCurrentPrice(symbol);

  state.lastPriceDistance=pricePct(price,state.price);

  if(state.lastPriceDistance<=0.15){

    state.tests++;

  }

  /* ---------- Replenishment ---------- */

  if(
    state.addedUsd>
    state.removedUsd*0.35 &&
    cluster.maxUsd>=state.peakUsd*0.70
  ){

    state.replenishments++;

  }

  /* ---------- Lifecycle ---------- */

  const age=now()-state.firstSeen;

  if(
    state.spoof>0.85 &&
    age<15000
  ){

    state.state="SPOOF";

  }else if(

    cluster.maxUsd<
    state.peakUsd*0.15

  ){

    state.state="REMOVED";

  }else if(

    state.replenishments>=2

  ){

    state.state="ICEBERG";

  }else if(

    age>=CONFIG.WALL_STABLE_MS &&
    state.tests>=2

  ){

    state.state="TESTED";

  }else if(

    age>=CONFIG.WALL_STABLE_MS

  ){

    state.state="STABLE";

  }else{

    state.state="NEW";

  }

  return state;

}

/* ---------- Full wall scan ---------- */

function scanWalls(symbol){

  const bidClusters=clusterWalls(symbol,"BID");
  const askClusters=clusterWalls(symbol,"ASK");

  const alive=new Set();

  for(const c of [...bidClusters,...askClusters]){

    const s=updateWall(symbol,c);

    alive.add(s.key);

  }

  /* ---------- Cleanup ---------- */

  for(const [key,state] of walls){

    if(state.symbol!==symbol)continue;

    if(

      !alive.has(key) &&
      now()-state.lastSeen>
      CONFIG.WALL_TTL_MS

    ){

      walls.delete(key);

    }

  }

}

/* ---------- Best wall ---------- */

function bestWall(symbol,direction){

  const wanted=direction==="LONG"
    ?"BID"
    :"ASK";

  const price=getCurrentPrice(symbol);

  return [...walls.values()]
    .filter(x=>

      x.symbol===symbol &&
      x.side===wanted &&
      x.state!=="SPOOF" &&
      x.state!=="REMOVED"

    )
    .sort((a,b)=>

      pricePct(price,a.price)-
      pricePct(price,b.price)

    )[0]||null;

}

/* ---------- Wall quality ---------- */

function wallScore(w){

  if(!w)return 0;

  let score=0;

  const age=now()-w.firstSeen;

  score+=Math.min(age/1000,25);

  score+=Math.min(w.absorption*100,25);

  score+=Math.min(w.replenishments*8,20);

  score+=Math.min(w.tests*3,15);

  score-=w.spoof*30;

  if(w.state==="ICEBERG")score+=15;
  if(w.state==="TESTED")score+=10;
  if(w.state==="STABLE")score+=6;

  return clamp(score,0,100);

}

/* =========================================================
   FLOW CONTEXT
   ========================================================= */

function flowContext(symbol){

  const flow=aggressiveFlow(symbol);

  const base=baselineFlow(symbol);

  const intensity=base.median
    ?flow.total/(base.median*4)
    :0;

  const imbalance=flow.imbalance;

  let direction="NEUTRAL";

  if(imbalance>=0.18){

    direction="BUY";

  }else if(imbalance<=-0.18){

    direction="SELL";

  }

  let score=35;

  score+=Math.min(Math.abs(imbalance)*45,30);

  score+=Math.min(intensity*10,20);

  if(direction!=="NEUTRAL")score+=8;

  return{

    ...flow,

    intensity,
    direction,

    score:clamp(score,0,100)

  };

}

/* =========================================================
   MARKET REACTION
   ========================================================= */

function marketReaction(symbol,direction){

  const arr=recentTrades(symbol,10000);

  if(arr.length<3){

    return{
      valid:false,
      score:0,
      move:0
    };

  }

  const move=(
    arr[arr.length-1].price-
    arr[0].price
  )/arr[0].price*100;

  const desired=direction==="LONG"
    ?move
    :-move;

  let score=0;

  score+=Math.max(desired*70,0);

  const flow=aggressiveFlow(symbol);

  if(direction==="LONG"){

    if(flow.buy>=flow.sell)score+=10;

  }else{

    if(flow.sell>=flow.buy)score+=10;

  }

  score=clamp(score,0,30);

  return{

    valid:true,
    score,
    move

  };

}

/* =========================================================
   WALL QUALITY GATE
   ========================================================= */

function wallGate(symbol,direction){

  const wall=bestWall(symbol,direction);

  if(!wall){

    return null;

  }

  const quality=wallScore(wall);

  if(quality<45){

    return null;

  }

  return{

    wall,
    quality

  };

}
 /* =========================================================
   PART 4/8
   SIGNAL ENGINE
   HTF + Wall + Flow + Retest + Lifecycle
   ========================================================= */

/* ---------- HTF context ---------- */

function htfContext(symbol,direction){

  const data=htf.get(symbol);

  if(!data)return null;

  if(now()-data.updatedAt>CONFIG.HTF_REFRESH_MS+120000)return null;

  const price=getCurrentPrice(symbol);

  const zone=nearestHTF(
    symbol,
    price,
    direction==="LONG"?"SUPPORT":"RESISTANCE"
  );

  if(!zone)return null;

  const distance=pricePct(price,zone.price);

  let score=0;

  if(zone.tf==="4H")score+=35;
  else if(zone.tf==="1H")score+=25;
  else score+=15;

  score+=Math.min(zone.strength*4,15);

  score-=distance*8;

  return{
    zone,
    score:clamp(score,0,50),
    atr:data.atr15||data.atr60||price*0.004
  };

}

/* ---------- TP target ---------- */

function targetPrice(symbol,direction,entry,risk){

  const data=htf.get(symbol);

  if(data){

    const zones=data.zones
      .filter(z=>

        direction==="LONG"
          ?z.type==="RESISTANCE"&&z.price>entry
          :z.type==="SUPPORT"&&z.price<entry

      )
      .sort((a,b)=>

        Math.abs(a.price-entry)-
        Math.abs(b.price-entry)

      );

    if(zones.length)return zones[0].price;

  }

  return direction==="LONG"
    ?entry+risk*2
    :entry-risk*2;

}

/* ---------- Setup ---------- */

function buildSetup(symbol,direction){

  const price=getCurrentPrice(symbol);

  if(!price)return null;

  const book=books.get(symbol);

  if(!book||!book.valid)return null;

  if(book.spreadPct>CONFIG.MAX_SPREAD_PCT)return null;

  if(!isBookFresh(symbol))return null;

  if(!isTradeFresh(symbol))return null;

  const wallInfo=wallGate(symbol,direction);

  if(!wallInfo)return null;

  const flow=flowContext(symbol);

  const reaction=marketReaction(symbol,direction);

  const htfInfo=htfContext(symbol,direction);

  if(!reaction.valid||!htfInfo)return null;

  const aligned=direction==="LONG"
    ?flow.direction!=="SELL"
    :flow.direction!=="BUY";

  let score=0;

  score+=htfInfo.score;
  score+=wallInfo.quality*0.45;
  score+=flow.score*0.40;
  score+=reaction.score;

  if(aligned)score+=8;
  else score-=18;

  score=clamp(score,0,100);

  if(score<CONFIG.MIN_SCORE)return null;

  const entry=direction==="LONG"
    ?book.bestAsk||price
    :book.bestBid||price;

  const stop=direction==="LONG"
    ?Math.min(
        wallInfo.wall.price,
        htfInfo.zone.price
      )-htfInfo.atr*0.35
    :Math.max(
        wallInfo.wall.price,
        htfInfo.zone.price
      )+htfInfo.atr*0.35;

  const risk=Math.abs(entry-stop);

  if(!risk)return null;

  const tp=targetPrice(
    symbol,
    direction,
    entry,
    risk
  );

  const rr=Math.abs(tp-entry)/risk;

  if(rr<CONFIG.MIN_RR)return null;

  return{

    symbol,

    direction,

    score,

    entry:tickRound(symbol,entry),

    stop:tickRound(symbol,stop),

    tp:tickRound(symbol,tp),

    rr,

    wallKey:wallInfo.wall.key,

    wallState:wallInfo.wall.state,

    wallPrice:wallInfo.wall.price,

    wallQuality:wallInfo.quality,

    htfZone:htfInfo.zone,

    created:now(),

    expires:now()+CONFIG.SIGNAL_TTL_MS,

    entryUntil:now()+CONFIG.ENTRY_WINDOW_MS,

    status:"ENTRY",

    leftWall:false,

    retest:false,

    fingerprint:
      direction+":"+
      wallInfo.wall.key+":"+
      Math.round(entry/(htfInfo.atr||price*0.004))

  };

}

/* ---------- Cooldown ---------- */

const setupCooldowns=new Map();

function setupLocked(fp){

  return num(setupCooldowns.get(fp))>now();

}

function lockSetup(fp){

  setupCooldowns.set(
    fp,
    now()+CONFIG.SETUP_COOLDOWN_MS
  );

}

/* ---------- Opposite protection ---------- */

function oppositeSignal(symbol,direction){

  const s=signals.get(symbol);

  if(!s)return false;

  return s.direction!==direction;

}

/* ---------- Create signal ---------- */

function createSignal(symbol,direction){

  if(signals.has(symbol))return;

  if(cooldownActive(symbol,direction))return;

  if(oppositeSignal(symbol,direction))return;

  const setup=buildSetup(symbol,direction);

  if(!setup)return;

  if(setupLocked(setup.fingerprint))return;

  signals.set(symbol,setup);

  markCooldown(
    symbol,
    direction,
    CONFIG.COOLDOWN_MS
  );

  lockSetup(setup.fingerprint);

}

/* ---------- Retest logic ---------- */

function updateRetest(signal){

  const price=getCurrentPrice(signal.symbol);

  if(!price)return;

  const distance=pricePct(
    price,
    signal.wallPrice
  );

  if(!signal.leftWall){

    if(distance>0.35){

      signal.leftWall=true;

    }

    return;

  }

  if(signal.retest)return;

  if(distance<=0.18){

    if(signal.direction==="LONG"){

      if(price>=signal.wallPrice){

        signal.retest=true;
        signal.status="HOLD";

      }

    }else{

      if(price<=signal.wallPrice){

        signal.retest=true;
        signal.status="HOLD";

      }

    }

  }

}

/* ---------- Validation ---------- */

function signalValid(signal){

  if(now()>signal.expires)return false;

  const book=books.get(signal.symbol);

  if(!book||!book.valid)return false;

  if(!isBookFresh(signal.symbol))return false;

  if(!isTradeFresh(signal.symbol))return false;

  const wall=walls.get(signal.wallKey);

  if(!wall)return false;

  if(
    wall.state==="SPOOF"||
    wall.state==="REMOVED"
  )return false;

  const flow=flowContext(signal.symbol);

  if(signal.direction==="LONG"){

    if(flow.imbalance<-0.50)return false;

  }else{

    if(flow.imbalance>0.50)return false;

  }

  const price=getCurrentPrice(signal.symbol);

  if(signal.direction==="LONG"){

    if(price<=signal.stop)return false;

  }else{

    if(price>=signal.stop)return false;

  }

  return true;

}

/* ---------- Manager ---------- */

function manageSignals(){

  for(const [symbol,signal] of signals){

    if(!signalValid(signal)){

      signals.delete(symbol);

      continue;

    }

    updateRetest(signal);

    const price=getCurrentPrice(symbol);

    if(signal.direction==="LONG"){

      if(price>=signal.tp){

        signal.status="TARGET";

      }

    }else{

      if(price<=signal.tp){

        signal.status="TARGET";

      }

    }

    if(
      signal.status==="ENTRY" &&
      now()>signal.entryUntil
    ){

      signal.status="WAIT";

    }

  }

}

/* ---------- Scan symbol ---------- */

function scanSymbol(symbol){

  scanWalls(symbol);

  if(signals.has(symbol))return;

  const longSetup=buildSetup(symbol,"LONG");
  const shortSetup=buildSetup(symbol,"SHORT");

  if(longSetup&&shortSetup){

    if(
      Math.abs(
        longSetup.score-shortSetup.score
      )<CONFIG.MIN_DIRECTION_MARGIN
    ){

      return;

    }

    if(longSetup.score>shortSetup.score){

      createSignal(symbol,"LONG");

    }else{

      createSignal(symbol,"SHORT");

    }

    return;

  }

  if(longSetup){

    createSignal(symbol,"LONG");

    return;

  }

  if(shortSetup){

    createSignal(symbol,"SHORT");

  }

}

/* ---------- Scan cycle ---------- */

function scanEngine(){

  scanCycle++;

  for(const symbol of currentUniverse()){

    try{

      scanSymbol(symbol);

    }catch(e){

      globalErrors++;

      log("scan "+symbol+" "+e.message);

    }

  }

}

 /* =========================================================
   PART 6/8
   PAPER TRADING ENGINE
   Retest Entry • MFE • MAE • R-Multiple • BreakEven
   ========================================================= */

const paper={

  open:new Map(),

  closed:[],

  wins:0,
  losses:0,

  totalR:0,

  maxHistory:500

};

/* ---------- Open ---------- */

function paperOpen(signal){

  if(paper.open.has(signal.symbol))return;

  if(!signal.retest)return;

  const entry=getCurrentPrice(signal.symbol);

  if(!entry)return;

  paper.open.set(signal.symbol,{

    symbol:signal.symbol,

    direction:signal.direction,

    entry,

    stop:signal.stop,

    target:signal.tp,

    openedAt:now(),

    risk:Math.abs(entry-signal.stop),

    mfe:0,
    mae:0,

    movedBE:false,

    state:"OPEN"

  });

  signal.status="PAPER";

}

/* ---------- Manage ---------- */

function paperManage(){

  for(const[positionKey,pos]of paper.open){

    const price=getCurrentPrice(pos.symbol);

    if(!price)continue;

    const r=pos.direction==="LONG"

      ?(price-pos.entry)/pos.risk

      :(pos.entry-price)/pos.risk;

    pos.mfe=Math.max(pos.mfe,r);

    pos.mae=Math.min(pos.mae,r);

    /* ---------- BreakEven ---------- */

    if(

      !pos.movedBE &&

      r>=1

    ){

      pos.stop=pos.entry;

      pos.movedBE=true;

    }

    let closed=false;

    let resultR=0;

    if(pos.direction==="LONG"){

      if(price>=pos.target){

        closed=true;

        resultR=Math.abs(pos.target-pos.entry)/pos.risk;

      }else if(price<=pos.stop){

        closed=true;

        resultR=pos.stop===pos.entry?0:-1;

      }

    }else{

      if(price<=pos.target){

        closed=true;

        resultR=Math.abs(pos.entry-pos.target)/pos.risk;

      }else if(price>=pos.stop){

        closed=true;

        resultR=pos.stop===pos.entry?0:-1;

      }

    }

    if(!closed)continue;

    pos.state="CLOSED";

    pos.closedAt=now();

    pos.exit=price;

    pos.resultR=resultR;

    paper.closed.push(pos);

    paper.open.delete(positionKey);

    paper.totalR+=resultR;

    if(resultR>0)paper.wins++;
    else if(resultR<0)paper.losses++;

    while(paper.closed.length>paper.maxHistory){

      paper.closed.shift();

    }

  }

}

/* ---------- Stats ---------- */

function paperStats(){

  const trades=paper.wins+paper.losses;

  const wr=trades

    ?paper.wins/trades*100

    :0;

  return{

    open:paper.open.size,

    closed:paper.closed.length,

    wins:paper.wins,

    losses:paper.losses,

    winRate:wr,

    totalR:paper.totalR,

    avgR:paper.closed.length

      ?paper.totalR/paper.closed.length

      :0

  };

}

/* ---------- Attach to manager ---------- */

const _oldManageSignals=manageSignals;

manageSignals=function(){

  _oldManageSignals();

  for(const signal of signals.values()){

    paperOpen(signal);

  }

  paperManage();

};

function confidenceLabel(score){

  if(score>=90)return"INSTITUTIONAL";

  if(score>=82)return"A+";

  if(score>=76)return"A";

  if(score>=72)return"B";

  return"C";

}

function confidenceColor(score){

  if(score>=90)return"good";

  if(score>=82)return"good";

  if(score>=76)return"warn";

  return"muted";

}

/* =========================================================
   EXECUTION FILTER
   ========================================================= */

function executionScore(symbol){

  const book=books.get(symbol);

  if(!book)return 0;

  let score=40;

  if(book.spreadPct<=0.03)score+=25;
  else if(book.spreadPct<=0.06)score+=15;
  else if(book.spreadPct<=0.10)score+=8;

  const lag=now()-book.lastRx;

  if(lag<400)score+=20;
  else if(lag<800)score+=12;
  else if(lag<1500)score+=5;

  if(isTradeFresh(symbol))score+=15;

  return clamp(score,0,100);

}

   PART 7/8
   STABILITY / PERFORMANCE / WALL LIFECYCLE PATCH
   ========================================================= */

/*
  ВАЖНО:
  Эта часть заменяет некоторые слишком агрессивные
  поведения предыдущих блоков через обёртки.
*/

/* =========================================================
   STABLE WALL INTERACTION
   ========================================================= */

const wallTouchState=new Map();

function wallInteraction(symbol,wall){

  if(!wall)return null;

  const price=getCurrentPrice(symbol);

  if(!price)return null;

  const distance=pricePct(price,wall.price);

  const key=wall.key;

  let state=wallTouchState.get(key);

  if(!state){

    state={
      key,
      active:false,
      lastEnter:0,
      lastExit:0,
      touches:0,
      lastPrice:price
    };

    wallTouchState.set(key,state);

  }

  const inside=distance<=0.18;

  /*
    Считаем новый тест только при входе
    в область стены.

    Поэтому 100 циклов сканирования возле
    одной стены = ОДИН тест, а не 100.
  */

  if(inside&&!state.active){

    state.active=true;
    state.lastEnter=now();
    state.touches++;

  }

  if(!inside&&state.active){

    state.active=false;
    state.lastExit=now();

  }

  state.lastPrice=price;

  return{
    distance,
    inside,
    touches:state.touches,
    active:state.active,
    lastEnter:state.lastEnter,
    lastExit:state.lastExit
  };

}

/* =========================================================
   WALL KEY STABILIZATION
   ========================================================= */

function canonicalWallPrice(symbol,side,price){

  const instrument=instruments.get(symbol);

  const tick=num(instrument?.tickSize);

  const p=num(price);

  if(!p)return 0;

  /*
    Более крупный bucket позволяет одной стене
    сохранять идентичность при небольших изменениях
    средней цены кластера.
  */

  const bucket=Math.max(
    tick*20,
    p*0.00030
  );

  return Math.round(p/bucket)*bucket;

}

/*
  Не используем текущую цену как часть идентичности стены.
  Цена рынка может двигаться, сама стена при этом остаётся
  тем же структурным уровнем.
*/

function stableWallKey(symbol,side,price){

  const cp=canonicalWallPrice(
    symbol,
    side,
    price
  );

  return symbol+":"+side+":"+Math.round(cp*100000000);

}

/* =========================================================
   STABLE WALL OBJECT
   ========================================================= */

function getStableWall(symbol,cluster){

  const key=stableWallKey(
    symbol,
    cluster.side,
    cluster.center
  );

  let state=walls.get(key);

  if(!state){

    state={
      key,
      symbol,
      side:cluster.side,

      price:cluster.center,

      firstSeen:now(),
      lastSeen:now(),

      peakUsd:cluster.maxUsd,
      currentUsd:cluster.maxUsd,

      previousUsd:cluster.maxUsd,

      addedUsd:0,
      removedUsd:0,

      executedUsd:0,
      cancelledUsd:0,

      replenishments:0,

      tests:0,
      testActive:false,

      absorption:0,
      spoof:0,

      state:"NEW",

      lastAttackUsd:0,
      lastInteraction:0,

      lastMarketPrice:getCurrentPrice(symbol),

      lastCycle:scanCycle

    };

    walls.set(key,state);

  }

  return state;

}

/* =========================================================
   WALL LIFECYCLE REWRITE
   ========================================================= */

function updateStableWall(symbol,cluster){

  const wall=getStableWall(symbol,cluster);

  const previous=wall.currentUsd;

  wall.previousUsd=previous;

  wall.currentUsd=cluster.maxUsd;

  wall.peakUsd=Math.max(
    wall.peakUsd,
    cluster.maxUsd
  );

  wall.price=cluster.center;
  wall.lastSeen=now();
  wall.lastCycle=scanCycle;

  const delta=cluster.maxUsd-previous;

  if(delta>0){

    wall.addedUsd+=delta;

  }else if(delta<0){

    wall.removedUsd+=Math.abs(delta);

  }

  const flow=aggressiveFlow(symbol);

  /*
    BID:
      SELL market orders are attacking the bid wall.

    ASK:
      BUY market orders are attacking the ask wall.
  */

  const attack=wall.side==="BID"
    ?flow.sell
    :flow.buy;

  wall.lastAttackUsd=attack;

  const reduction=Math.max(
    previous-cluster.maxUsd,
    0
  );

  /*
    This is an ESTIMATE.
    A displayed reduction cannot prove execution.
  */

  const estimatedExecuted=Math.min(
    reduction,
    attack
  );

  const estimatedCancelled=Math.max(
    reduction-estimatedExecuted,
    0
  );

  wall.executedUsd=estimatedExecuted;
  wall.cancelledUsd=estimatedCancelled;

  wall.absorption=wall.peakUsd
    ?estimatedExecuted/wall.peakUsd
    :0;

  /*
    Spoof is calculated from the current episode,
    not from the whole lifetime of the wall.
  */

  wall.spoof=reduction>0
    ?estimatedCancelled/reduction
    :0;

  const interaction=wallInteraction(
    symbol,
    wall
  );

  if(interaction){

    wall.testActive=interaction.active;

    /*
      Only increment when entering the test zone.
    */

    if(
      interaction.active &&
      interaction.touches>wall.tests
    ){

      wall.tests=interaction.touches;
      wall.lastInteraction=now();

    }

  }

  /*
    Replenishment:
    the wall gets attacked/reduced, then displayed
    liquidity returns to a substantial percentage
    of its previous peak.
  */

  if(
    reduction>0 &&
    cluster.maxUsd>=wall.peakUsd*0.70 &&
    wall.addedUsd>=reduction*0.40 &&
    attack>=Math.max(
      CONFIG.MIN_FLOW_USD,
      wall.peakUsd*0.05
    )
  ){

    const sinceLast=now()-wall.lastInteraction;

    if(sinceLast>1200){

      wall.replenishments++;
      wall.lastInteraction=now();

    }

  }

  const age=now()-wall.firstSeen;

  /*
    State priority:
      SPOOF
      ICEBERG
      TESTED
      STABLE
      NEW
  */

  if(
    wall.spoof>=0.90 &&
    wall.tests===0 &&
    age<12000 &&
    wall.currentUsd<wall.peakUsd*0.30
  ){

    wall.state="SPOOF";

  }else if(
    wall.replenishments>=2 &&
    wall.tests>=1
  ){

    wall.state="ICEBERG";

  }else if(
    wall.tests>=1 &&
    age>=CONFIG.WALL_MIN_AGE_MS
  ){

    wall.state="TESTED";

  }else if(
    age>=CONFIG.WALL_STABLE_MS
  ){

    wall.state="STABLE";

  }else{

    wall.state="NEW";

  }

  return wall;

}

/* =========================================================
   REBUILD WALL SCAN
   ========================================================= */

function scanWallsStable(symbol){

  const bids=clusterWalls(symbol,"BID");
  const asks=clusterWalls(symbol,"ASK");

  const seen=new Set();

  for(const cluster of [...bids,...asks]){

    const wall=updateStableWall(
      symbol,
      cluster
    );

    seen.add(wall.key);

  }

  /*
    IMPORTANT:
    A wall is NOT deleted immediately just because
    one orderbook update no longer contains it.

    It receives a grace period.
  */

  for(const [key,wall] of walls){

    if(wall.symbol!==symbol)continue;

    if(seen.has(key))continue;

    if(
      now()-wall.lastSeen>
      CONFIG.WALL_TTL_MS
    ){

      walls.delete(key);
      wallTouchState.delete(key);

    }

  }

}

/* =========================================================
   USE STABLE WALL ENGINE
   ========================================================= */

const _legacyScanWalls=scanWalls;

scanWalls=function(symbol){

  scanWallsStable(symbol);

};

/* =========================================================
   ACTIONABLE WALL
   ========================================================= */

function actionableWall(symbol,direction){

  const side=direction==="LONG"
    ?"BID"
    :"ASK";

  const price=getCurrentPrice(symbol);

  const candidates=[...walls.values()]
    .filter(w=>
      w.symbol===symbol &&
      w.side===side &&
      w.state!=="SPOOF" &&
      w.state!=="REMOVED" &&
      now()-w.lastSeen<CONFIG.WALL_TTL_MS
    );

  if(!candidates.length)return null;

  candidates.sort((a,b)=>{

    const da=pricePct(price,a.price);
    const db=pricePct(price,b.price);

    /*
      Prefer tested / iceberg walls,
      then distance.
    */

    const qa=
      (a.state==="ICEBERG"?35:0)+
      (a.state==="TESTED"?20:0)+
      Math.min(a.replenishments*5,15)+
      Math.min(a.tests*3,10);

    const qb=
      (b.state==="ICEBERG"?35:0)+
      (b.state==="TESTED"?20:0)+
      Math.min(b.replenishments*5,15)+
      Math.min(b.tests*3,10);

    return(
      (db*100- qb)-
      (da*100- qa)
    );

  });

  return candidates[0];

}

/* =========================================================
   DIRECTIONAL ABSORPTION
   ========================================================= */

function directionalAbsorption(symbol,direction){

  const wall=actionableWall(
    symbol,
    direction
  );

  if(!wall)return null;

  const flow=aggressiveFlow(symbol);

  /*
    LONG:
      sellers hit BID wall.
      Wall survives/replenishes.
      This is the useful absorption pattern.

    SHORT:
      buyers hit ASK wall.
      Wall survives/replenishes.
  */

  const attack=direction==="LONG"
    ?flow.sell
    :flow.buy;

  const directionalOpposite=direction==="LONG"
    ?flow.buy
    :flow.sell;

  const attackRatio=
    attack/
    Math.max(
      attack+directionalOpposite,
      1
    );

  let score=0;

  score+=Math.min(
    attackRatio*35,
    35
  );

  score+=Math.min(
    wall.absorption*35,
    35
  );

  score+=Math.min(
    wall.replenishments*10,
    20
  );

  if(wall.state==="ICEBERG")score+=10;
  if(wall.state==="TESTED")score+=8;

  return{
    wall,
    attack,
    attackRatio,
    score:clamp(score,0,100)
  };

}

/* =========================================================
   PRICE RESPONSE AFTER WALL ATTACK
   ========================================================= */

function wallResponse(symbol,wall){

  if(!wall)return null;

  const arr=recentTrades(
    symbol,
    8000
  );

  if(arr.length<5)return null;

  const price=getCurrentPrice(symbol);

  const start=arr[0].price;

  const move=(price-start)/start*100;

  let score=0;

  if(wall.side==="BID"){

    if(move>0){
      score+=Math.min(move*120,30);
    }

  }else{

    if(move<0){
      score+=Math.min(Math.abs(move)*120,30);
    }

  }

  if(
    wall.state==="TESTED"||
    wall.state==="ICEBERG"
  ){

    score+=20;

  }

  return{
    move,
    score:clamp(score,0,50)
  };

}

/* =========================================================
   SIGNAL DEDUPLICATION
   ========================================================= */

const recentSetups=new Map();

function setupFingerprint(symbol,direction,wall){

  if(!wall)return "";

  const priceBucket=
    Math.round(
      wall.price/
      Math.max(
        wall.price*0.0005,
        num(instruments.get(symbol)?.tickSize)||0.0001
      )
    );

  return[
    symbol,
    direction,
    wall.side,
    priceBucket
  ].join(":");

}

function setupRecentlyUsed(fp){

  const t=num(recentSetups.get(fp));

  return t>now();

}

function rememberSetup(fp){

  recentSetups.set(
    fp,
    now()+CONFIG.SETUP_COOLDOWN_MS
  );

}

/* =========================================================
   CLEANUP
   ========================================================= */

function cleanupRuntime(){

  const t=now();

  for(const [key,until] of cooldowns){

    if(num(until)<t){

      cooldowns.delete(key);

    }

  }

  for(const [key,until] of setupCooldowns){

    if(num(until)<t){

      setupCooldowns.delete(key);

    }

  }

  for(const [key,until] of recentSetups){

    if(num(until)<t){

      recentSetups.delete(key);

    }

  }

  for(const [key,wall] of walls){

    if(
      t-wall.lastSeen>
      CONFIG.WALL_TTL_MS*2
    ){

      walls.delete(key);
      wallTouchState.delete(key);

    }

  }

  /*
    Keep trade buffers bounded.
  */

  const cutoff=t-CONFIG.FLOW_BASELINE_MS;

  for(const [symbol,arr] of trades){

    while(
      arr.length &&
      arr[0].receivedTime<cutoff
    ){

      arr.shift();

    }

    if(arr.length>CONFIG.MAX_TRADES){

      arr.splice(
        0,
        arr.length-CONFIG.MAX_TRADES
      );

    }

  }

}

/* =========================================================
   PATCH SIGNAL CREATION
   ========================================================= */

const _oldCreateSignal=createSignal;

createSignal=function(symbol,direction){

  if(signals.has(symbol))return;

  const wall=actionableWall(
    symbol,
    direction
  );

  if(!wall)return;

  const fp=setupFingerprint(
    symbol,
    direction,
    wall
  );

  if(!fp)return;

  if(setupRecentlyUsed(fp))return;

  /*
    Require actual directional wall interaction
    before allowing a signal.
  */

  const absorption=
    directionalAbsorption(
      symbol,
      direction
    );

  if(!absorption)return;

  /*
    Do not require maximum absorption.
    We only reject clearly weak interaction.
  */

  if(absorption.score<35)return;

  _oldCreateSignal(
    symbol,
    direction
  );

  if(signals.has(symbol)){

    signals.get(symbol).absorptionScore=
      absorption.score;

    signals.get(symbol).wallTests=
      wall.tests;

    signals.get(symbol).replenishments=
      wall.replenishments;

    rememberSetup(fp);

  }

};

/* =========================================================
   PATCH SCAN
   ========================================================= */

const _oldScanSymbol=scanSymbol;

scanSymbol=function(symbol){

  if(!isBookFresh(symbol))return;

  scanWallsStable(symbol);

  _oldScanSymbol(symbol);

};

/* =========================================================
   EXTRA HEALTH CHECK
   ========================================================= */

function systemHealthy(){

  const syms=currentUniverse();

  if(!syms.length)return false;

  let booksOk=0;

  for(const s of syms){

    if(isBookFresh(s))booksOk++;

  }

  return booksOk>=Math.max(
    3,
    Math.floor(syms.length*0.30)
  );

}

/* =========================================================
   DEBUG API EXTENSION
   ========================================================= */

window.getScannerHealth=function(){

  return{

    running,

    symbols:currentUniverse().length,

    booksFresh:currentUniverse()
      .filter(isBookFresh)
      .length,

    tradesFresh:currentUniverse()
      .filter(isTradeFresh)
      .length,

    walls:walls.size,

    signals:signals.size,

    sockets:sockets.length,

    errors:globalErrors,

    healthy:systemHealthy()

  };

};
 <!-- ========================================================
     PART 8/8
     FINAL ENGINE / RECOVERY / API / CLOSE
     ======================================================== -->

<script>
/*
  PART 8 выполняется в том же документе.

  Если этот фрагмент вставляется строго после PART 7,
  НИЧЕГО дополнительного менять не нужно.
*/

/* =========================================================
   FINAL SIGNAL VALIDATION
   ========================================================= */

function finalSignalCheck(signal){

  if(!signal)return false;

  const price=getCurrentPrice(signal.symbol);

  if(!price)return false;

  const book=books.get(signal.symbol);

  if(!book||!book.valid)return false;

  if(book.spreadPct>CONFIG.MAX_SPREAD_PCT)return false;

  /*
    Жёсткая инвалидизация.
    Небольшое ухудшение качества НЕ удаляет сигнал.
  */

  if(signal.direction==="LONG"){

    if(price<=signal.stop)return false;

  }else{

    if(price>=signal.stop)return false;

  }

  const wall=walls.get(signal.wallKey);

  /*
    Стена может немного измениться.
    Не удаляем сигнал из-за небольшого изменения размера.
  */

  if(!wall)return false;

  if(wall.state==="SPOOF"){

    /*
      Если стена исчезла как spoof до подтверждения —
      сигнал недействителен.
    */

    if(!signal.retest)return false;

  }

  return true;

}

/* =========================================================
   PATCH SIGNAL MANAGER
   ========================================================= */

const _previousManageSignals=manageSignals;

manageSignals=function(){

  _previousManageSignals();

  for(const [symbol,signal] of signals){

    /*
      TARGET сохраняем на экране некоторое время,
      чтобы пользователь видел результат.
    */

    if(signal.status==="TARGET"){

      if(!signal.targetReachedAt){

        signal.targetReachedAt=now();

      }

      if(now()-signal.targetReachedAt>60000){

        signals.delete(symbol);

      }

      continue;

    }

    if(!finalSignalCheck(signal)){

      /*
        Если причина — временная потеря данных,
        сигнал не удаляем сразу.

        Удаляем только при жёстком нарушении
        структуры / SL / полной потере стены.
      */

      const book=books.get(symbol);

      const wall=walls.get(signal.wallKey);

      const price=getCurrentPrice(symbol);

      const hardStop=
        !book ||
        !book.valid ||
        !wall ||
        (
          signal.direction==="LONG" &&
          price<=signal.stop
        ) ||
        (
          signal.direction==="SHORT" &&
          price>=signal.stop
        );

      if(hardStop){

        signal.status="INVALIDATED";

        signal.invalidatedAt=now();

        signals.delete(symbol);

      }

      continue;

    }

    updateRetest(signal);

  }

};

/* =========================================================
   FINAL PAPER PATCH
   ========================================================= */

const _previousPaperManage=paperManage;

paperManage=function(){

  _previousPaperManage();

  /*
    После закрытия Paper-позиции соответствующий
    сигнал остаётся в UI ещё немного.
  */

};

/* =========================================================
   PERIODIC UI
   ========================================================= */

function finalRender(){

  try{

    render();

    const p=paperStats();

    const d=$("diagnostics");

    if(d){

      d.textContent+=
        "\n\nPAPER: "+
        "open="+p.open+
        " closed="+p.closed+
        " WR="+p.winRate.toFixed(1)+"%"+
        " totalR="+p.totalR.toFixed(2);

    }

  }catch(e){

    globalErrors++;

    console.error("UI:",e);

  }

}

/* =========================================================
   ERROR RECOVERY
   ========================================================= */

let recoveryLock=false;

async function recoverSystem(){

  if(!running)return;

  if(recoveryLock)return;

  recoveryLock=true;

  try{

    setStatus(
      "Восстановление соединений...",
      "warn"
    );

    watchdog();

    const healthy=systemHealthy();

    if(!healthy){

      /*
        Полностью пересоздаём WS,
        но НЕ очищаем сигналы.
      */

      openSockets();

    }

    await sleep(1200);

    if(systemHealthy()){

      setStatus(
        "Мониторинг запущен",
        "ok"
      );

    }else{

      setStatus(
        "Ожидание данных",
        "warn"
      );

    }

  }catch(e){

    globalErrors++;

    console.error("Recovery:",e);

  }finally{

    recoveryLock=false;

  }

}

/* =========================================================
   RECOVERY TIMER
   ========================================================= */

let recoveryTimer=null;

function startRecovery(){

  if(recoveryTimer)return;

  recoveryTimer=setInterval(()=>{

    if(!running)return;

    recoverSystem();

  },5000);

}

function stopRecovery(){

  if(recoveryTimer){

    clearInterval(recoveryTimer);

    recoveryTimer=null;

  }

}

/* =========================================================
   PATCH START / STOP AGAIN
   ========================================================= */

const _startWithMaintenance=start;

start=async function(){

  await _startWithMaintenance();

  if(running){

    startRecovery();

  }

};

const _stopWithRecovery=stop;

stop=function(){

  stopRecovery();

  _stopWithRecovery();

};

/* =========================================================
   UNIVERSE REFRESH PROTECTION
   ========================================================= */

let universeRefreshLock=false;

const _refreshUniverseOriginal=refreshUniverse;

refreshUniverse=async function(){

  if(!running)return;

  if(universeRefreshLock)return;

  universeRefreshLock=true;

  try{

    const before=
      currentUniverse().join(",");

    await _refreshUniverseOriginal();

    const after=
      currentUniverse().join(",");

    if(before!==after){

      /*
        Сигналы существующих монет не удаляем.
        Новые символы получают чистый state.
      */

      for(const symbol of currentUniverse()){

        ensureBook(symbol);
        ensureTrades(symbol);
        ensureHealth(symbol);

      }

    }

  }catch(e){

    globalErrors++;

    log(
      "Universe refresh: "+
      e.message
    );

  }finally{

    universeRefreshLock=false;

  }

};

/* =========================================================
   HTF REFRESH PROTECTION
   ========================================================= */

let htfRefreshLock=false;

const _refreshHTFOriginal=refreshHTF;

refreshHTF=async function(){

  if(htfRefreshLock)return;

  htfRefreshLock=true;

  try{

    await _refreshHTFOriginal();

  }catch(e){

    globalErrors++;

    log(
      "HTF refresh: "+
      e.message
    );

  }finally{

    htfRefreshLock=false;

  }

};

/* =========================================================
   PAGE VISIBILITY
   ========================================================= */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(!running)return;

    if(
      document.visibilityState==="visible"
    ){

      setTimeout(()=>{

        if(running){

          openSockets();

          recoverSystem();

        }

      },500);

    }

  }
);

/* =========================================================
   NETWORK STATUS
   ========================================================= */

window.addEventListener(
  "online",
  ()=>{

    if(running){

      setStatus(
        "Сеть восстановлена",
        "warn"
      );

      setTimeout(
        recoverSystem,
        500
      );

    }

  }
);

window.addEventListener(
  "offline",
  ()=>{

    if(running){

      setStatus(
        "Нет интернет-соединения",
        "err"
      );

    }

  }
);

/* =========================================================
   GLOBAL ERROR HANDLING
   ========================================================= */

window.addEventListener(
  "error",
  e=>{

    globalErrors++;

    console.error(
      "Global:",
      e.error||e.message
    );

  }
);

window.addEventListener(
  "unhandledrejection",
  e=>{

    globalErrors++;

    console.error(
      "Promise:",
      e.reason
    );

  }
);

/* =========================================================
   BEFORE UNLOAD
   ========================================================= */

window.addEventListener(
  "beforeunload",
  ()=>{

    try{

      running=false;

      stopRecovery();
      stopMaintenance();

      closeSockets();

    }catch(e){}

  }
);

/* =========================================================
   FINAL DIAGNOSTICS
   ========================================================= */

function fullDiagnostics(){

  const health=getScannerHealth();

  const paperResult=paperStats();

  return{

    engine:{
      running,
      scanCycle,
      errors:globalErrors
    },

    market:{
      symbols:currentUniverse().length,
      booksFresh:health.booksFresh,
      tradesFresh:health.tradesFresh
    },

    websocket:{
      sockets:sockets.length,
      states:sockets.map(s=>({
        id:s.id,
        symbols:s.symbols.length,
        state:s.ws?.readyState===1
          ?"OPEN"
          :"CLOSED",
        lastRx:
          s.lastRx
            ?now()-s.lastRx
            :null
      }))
    },

    orderflow:{
      walls:walls.size,
      signals:signals.size
    },

    paper:paperResult

  };

}

/* =========================================================
   PUBLIC API
   ========================================================= */

window.BybitInstitutionalOF={

  config:CONFIG,

  start,
  stop,

  clear:clearSignals,

  diagnostics:fullDiagnostics,

  health:getScannerHealth,

  paperStats,

  market:()=>[...market.values()],

  orderbook:symbol=>{

    const b=books.get(symbol);

    if(!b)return null;

    return{

      symbol,

      valid:b.valid,

      bestBid:b.bestBid,

      bestAsk:b.bestAsk,

      spreadPct:b.spreadPct,

      lastPrice:getCurrentPrice(symbol),

      updateId:b.updateId,

      lastRx:b.lastRx

    };

  },

  flow:symbol=>{

    return{

      flow:aggressiveFlow(symbol),

      baseline:baselineFlow(symbol),

      recent:recentTrades(
        symbol,
        CONFIG.FLOW_WINDOW_MS
      )

    };

  },

  walls:symbol=>{

    return[...walls.values()]
      .filter(x=>
        !symbol ||
        x.symbol===symbol
      )
      .map(x=>({...x}));

  },

  signals:()=>{

    return[...signals.values()]
      .map(x=>({...x}));

  }

};

   FINAL INITIALIZATION
   ========================================================= */

$("diagnostics").textContent=
  "Готово.\n"+
  "Нажми START для запуска сканера.\n\n"+
  "Архитектура:\n"+
  "Market → OrderBook → Trades → Walls → HTF → Signal → Paper";

setStatus(
  "Готов к запуску",
  ""
);

render();

   FINAL SELF-CHECK
   ========================================================= */

(function selfCheck(){

  const required=[
    "start",
    "stop",
    "clear",
    "diagnostics",
    "health",
    "paperStats"
  ];

  const missing=required.filter(
    x=>typeof window.BybitInstitutionalOF[x]!=="function"
  );

    globalErrors++;

    console.error(
      "SELF CHECK FAILED:",

    );

  }else{

    console.log(

    );

  }

})();
