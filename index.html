   PART 5/8
   CONFIRMATION ENGINE
   WATCH -> CONFIRM -> SIGNAL
========================================================= */


/* ---------------------------------------------------------
   PRICE HISTORY
--------------------------------------------------------- */

const priceHistory = new Map();

function ensurePriceHistory(symbol){

    if(!priceHistory.has(symbol)){
        priceHistory.set(symbol,[]);
    }

    return priceHistory.get(symbol);
}


function recordPrice(symbol){

    const price =
        currentPrice(symbol);

    if(!price || price <= 0){
        return;
    }

    const list =
        ensurePriceHistory(symbol);

    const timestamp =
        now();

    list.push({
        ts:timestamp,
        price
    });

    const cutoff =
        timestamp -
        Math.max(
            CONFIG.RETEST_TIMEOUT,
            CONFIG.PRICE_WINDOW || 60000
        );

    while(
        list.length &&
        list[0].ts < cutoff
    ){
        list.shift();
    }

    if(list.length > 500){
        list.splice(
            0,
            list.length - 500
        );
    }
}


/* ---------------------------------------------------------
   PRICE LOOKUP
--------------------------------------------------------- */

function priceAt(symbol,ageMs){

    const list =
        priceHistory.get(symbol);

    if(!list || !list.length){
        return null;
    }

    const target =
        now() - ageMs;

    let result = null;

    for(let i=list.length-1;i>=0;i--){

        if(list[i].ts <= target){
            result = list[i];
            break;
        }
    }

    return result;
}


/* ---------------------------------------------------------
   PRICE CHANGE
--------------------------------------------------------- */

function priceChange(symbol,ageMs){

    const current =
        currentPrice(symbol);

    const previous =
        priceAt(symbol,ageMs);

    if(
        !current ||
        !previous ||
        !previous.price
    ){
        return null;
    }

    return (
        (current - previous.price) /
        previous.price
    );
}


/* ---------------------------------------------------------
   PRICE MOMENTUM
--------------------------------------------------------- */

function priceMomentum(symbol){

    const c5 =
        priceChange(symbol,5000);

    const c15 =
        priceChange(symbol,15000);

    const c30 =
        priceChange(symbol,30000);

    return {
        c5:c5 || 0,
        c15:c15 || 0,
        c30:c30 || 0
    };
}


/* ---------------------------------------------------------
   WALL POSITION
--------------------------------------------------------- */

function wallPosition(symbol,wall){

    const price =
        currentPrice(symbol);

    if(!price || !wall){
        return null;
    }

    const delta =
        (price-wall.price) /
        price;

    return {
        delta,
        distance:Math.abs(delta),

        below:
            wall.price < price,

        above:
            wall.price > price,

        at:
            Math.abs(delta)
            <= CONFIG.TEST_DIST
    };
}


/* ---------------------------------------------------------
   APPROACH DETECTION
--------------------------------------------------------- */

function priceApproachingWall(symbol,wall){

    if(!wall){
        return false;
    }

    const previous =
        priceAt(symbol,3000);

    const current =
        currentPrice(symbol);

    if(
        !previous ||
        !current
    ){
        return false;
    }

    const previousDistance =
        Math.abs(
            previous.price-wall.price
        ) /
        previous.price;

    const currentDistance =
        Math.abs(
            current-wall.price
        ) /
        current;

    return (
        currentDistance <
        previousDistance
    );
}


/* ---------------------------------------------------------
   WALL TEST
--------------------------------------------------------- */

function isTestingWall(symbol,wall){

    if(!wall){
        return false;
    }

    const price =
        currentPrice(symbol);

    if(!price){
        return false;
    }

    const distance =
        Math.abs(price-wall.price) /
        price;

    return (
        distance <=
        CONFIG.TEST_DIST
    );
}


/* ---------------------------------------------------------
   BOUNCE FROM BID
--------------------------------------------------------- */

function detectLongReaction(symbol,wall){

    if(
        !wall ||
        wall.side !== "BID"
    ){
        return {
            valid:false,
            score:0,
            reason:"NO_BID_WALL"
        };
    }

    const price =
        currentPrice(symbol);

    if(!price){
        return {
            valid:false,
            score:0,
            reason:"NO_PRICE"
        };
    }

    /*
       Price must have interacted with
       the bid wall and then move away upward.
    */

    const p1 =
        priceAt(symbol,3000);

    const p2 =
        priceAt(symbol,1000);

    if(!p1 || !p2){
        return {
            valid:false,
            score:0,
            reason:"NOT_ENOUGH_PRICE_HISTORY"
        };
    }

    const wallPrice =
        wall.price;

    const distanceNow =
        (price-wallPrice) /
        price;

    const distancePrevious =
        (p1.price-wallPrice) /
        p1.price;

    const distanceMiddle =
        (p2.price-wallPrice) /
        p2.price;

    const touched =
        Math.abs(distancePrevious) <=
        CONFIG.REACTION_DIST ||
        Math.abs(distanceMiddle) <=
        CONFIG.REACTION_DIST;

    if(!touched){

        return {
            valid:false,
            score:0,
            reason:"WALL_NOT_TESTED"
        };
    }

    const bounce =
        price > p2.price &&
        p2.price >= p1.price;

    const rebound =
        price > wallPrice;

    let score = 0;

    if(touched){
        score += 30;
    }

    if(bounce){
        score += 40;
    }

    if(rebound){
        score += 20;
    }

    const flow =
        tradeFlow(symbol);

    if(
        flow &&
        flow.delta > 0
    ){
        score += 10;
    }

    return {
        valid:
            touched &&
            bounce &&
            rebound,

        score:clamp(score,0,100),

        reason:
            touched
                ? (
                    bounce
                        ? "BID_BOUNCE"
                        : "BID_TEST"
                  )
                : "WALL_NOT_TESTED",

        wallPrice,
        currentPrice:price
    };
}


/* ---------------------------------------------------------
   REJECTION FROM ASK
--------------------------------------------------------- */

function detectShortReaction(symbol,wall){

    if(
        !wall ||
        wall.side !== "ASK"
    ){
        return {
            valid:false,
            score:0,
            reason:"NO_ASK_WALL"
        };
    }

    const price =
        currentPrice(symbol);

    if(!price){
        return {
            valid:false,
            score:0,
            reason:"NO_PRICE"
        };
    }

    const p1 =
        priceAt(symbol,3000);

    const p2 =
        priceAt(symbol,1000);

    if(!p1 || !p2){
        return {
            valid:false,
            score:0,
            reason:"NOT_ENOUGH_PRICE_HISTORY"
        };
    }

    const wallPrice =
        wall.price;

    const distancePrevious =
        (wallPrice-p1.price) /
        p1.price;

    const distanceMiddle =
        (wallPrice-p2.price) /
        p2.price;

    const distanceNow =
        (wallPrice-price) /
        price;

    const touched =
        Math.abs(distancePrevious) <=
        CONFIG.REACTION_DIST ||
        Math.abs(distanceMiddle) <=
        CONFIG.REACTION_DIST;

    if(!touched){

        return {
            valid:false,
            score:0,
            reason:"WALL_NOT_TESTED"
        };
    }

    const rejection =
        price < p2.price &&
        p2.price <= p1.price;

    const belowWall =
        price < wallPrice;

    let score = 0;

    if(touched){
        score += 30;
    }

    if(rejection){
        score += 40;
    }

    if(belowWall){
        score += 20;
    }

    const flow =
        tradeFlow(symbol);

    if(
        flow &&
        flow.delta < 0
    ){
        score += 10;
    }

    return {
        valid:
            touched &&
            rejection &&
            belowWall,

        score:clamp(score,0,100),

        reason:
            touched
                ? (
                    rejection
                        ? "ASK_REJECTION"
                        : "ASK_TEST"
                  )
                : "WALL_NOT_TESTED",

        wallPrice,
        currentPrice:price
    };
}


/* ---------------------------------------------------------
   REACTION ENGINE
--------------------------------------------------------- */

function detectReaction(symbol,direction,wall){

    if(
        direction === "LONG"
    ){
        return detectLongReaction(
            symbol,
            wall
        );
    }

    if(
        direction === "SHORT"
    ){
        return detectShortReaction(
            symbol,
            wall
        );
    }

    return {
        valid:false,
        score:0,
        reason:"UNKNOWN_DIRECTION"
    };
}


/* ---------------------------------------------------------
   FLOW CONFIRMATION
--------------------------------------------------------- */

function confirmFlow(symbol,direction){

    const flow =
        tradeFlow(symbol);

    if(!flow){
        return {
            valid:false,
            score:0,
            reason:"NO_FLOW"
        };
    }

    const threshold =
        baseFlowThreshold(symbol);

    let score = 0;

    if(direction === "LONG"){

        if(flow.delta > 0){
            score += 35;
        }

        if(flow.fastDelta > 0){
            score += 30;
        }

        if(
            flow.delta >=
            threshold
        ){
            score += 20;
        }

        if(
            flow.fastDelta >=
            CONFIG.MIN_FAST_FLOW
        ){
            score += 15;
        }

        return {
            valid:
                flow.delta >= threshold &&
                flow.fastDelta >=
                    CONFIG.MIN_FAST_FLOW,

            score:clamp(score,0,100),

            reason:
                flow.delta >= threshold
                    ? "BUY_FLOW_CONFIRMED"
                    : "BUY_FLOW_WEAK",

            flow
        };
    }


    if(direction === "SHORT"){

        if(flow.delta < 0){
            score += 35;
        }

        if(flow.fastDelta < 0){
            score += 30;
        }

        if(
            Math.abs(flow.delta) >=
            threshold
        ){
            score += 20;
        }

        if(
            Math.abs(flow.fastDelta) >=
            CONFIG.MIN_FAST_FLOW
        ){
            score += 15;
        }

        return {
            valid:
                flow.delta <= -threshold &&
                flow.fastDelta <=
                    -CONFIG.MIN_FAST_FLOW,

            score:clamp(score,0,100),

            reason:
                flow.delta <= -threshold
                    ? "SELL_FLOW_CONFIRMED"
                    : "SELL_FLOW_WEAK",

            flow
        };
    }

    return {
        valid:false,
        score:0,
        reason:"UNKNOWN_DIRECTION"
    };
}


/* ---------------------------------------------------------
   WALL PERSISTENCE
--------------------------------------------------------- */

function confirmWall(wall){

    if(!wall){
        return {
            valid:false,
            score:0,
            reason:"NO_WALL"
        };
    }

    const age =
        now() -
        Number(wall.detected || 0);

    const samples =
        Number(wall.samples || 0);

    const strength =
        Number(wall.strength || 0);

    let score = 0;

    if(
        age >= CONFIG.WALL_MIN_AGE
    ){
        score += 30;
    }

    if(
        samples >= CONFIG.WALL_MIN_SAMPLES
    ){
        score += 30;
    }

    if(strength >= 40){
        score += 20;
    }

    if(
        Number(wall.ratio || 0) >=
        CONFIG.WALL_RATIO
    ){
        score += 20;
    }

    return {
        valid:
            age >= CONFIG.WALL_MIN_AGE &&
            samples >= CONFIG.WALL_MIN_SAMPLES &&
            strength >= 25,

        score:clamp(score,0,100),

        reason:
            score >= 70
                ? "WALL_PERSISTENT"
                : "WALL_NOT_STABLE"
    };
}


/* ---------------------------------------------------------
   DIRECTION CONSISTENCY
--------------------------------------------------------- */

function directionConsistency(symbol,direction){

    const setup =
        ensureSetup(symbol);

    if(
        !setup.direction
    ){
        return {
            valid:true,
            score:50,
            reason:"NO_PREVIOUS_DIRECTION"
        };
    }

    if(
        setup.direction === direction
    ){
        return {
            valid:true,
            score:100,
            reason:"SAME_DIRECTION"
        };
    }

    /*
       Opposite direction is deliberately
       blocked here.
    */

    return {
        valid:false,
        score:0,
        reason:"OPPOSITE_DIRECTION"
    };
}


/* ---------------------------------------------------------
   CONFIRMATION SCORE
--------------------------------------------------------- */

function confirmationScore(
    candidate,
    reaction,
    flowConfirm,
    wallConfirm
){

    if(!candidate){
        return 0;
    }

    const quality =
        Number(candidate.quality || 0);

    const reactionScore =
        Number(reaction?.score || 0);

    const flowScore =
        Number(flowConfirm?.score || 0);

    const wallScoreValue =
        Number(wallConfirm?.score || 0);

    return clamp(
        quality * 0.20 +
        reactionScore * 0.35 +
        flowScore * 0.25 +
        wallScoreValue * 0.20,
        0,
        100
    );
}


/* ---------------------------------------------------------
   CONFIRM CANDIDATE
--------------------------------------------------------- */

function confirmCandidate(symbol,candidate){

    if(!candidate){
        return null;
    }

    const direction =
        candidate.direction;

    const wall =
        candidate.wall;

    const consistency =
        directionConsistency(
            symbol,
            direction
        );

    if(!consistency.valid){

        return {
            confirmed:false,
            direction,
            score:0,
            reason:consistency.reason
        };
    }

    const wallConfirm =
        confirmWall(wall);

    const flowConfirm =
        confirmFlow(
            symbol,
            direction
        );

    const reaction =
        detectReaction(
            symbol,
            direction,
            wall
        );

    const score =
        confirmationScore(
            candidate,
            reaction,
            flowConfirm,
            wallConfirm
        );

    /*
       Confirmation requires:
       - persistent wall
       - correct aggressive flow
       - actual price reaction
    */

    const confirmed =
        wallConfirm.valid &&
        flowConfirm.valid &&
        reaction.valid &&
        score >= 60;

    return {
        confirmed,

        direction,

        score,

        wall,
        reaction,
        flowConfirm,
        wallConfirm,

        reason:
            confirmed
                ? "FULL_CONFIRMATION"
                : (
                    !wallConfirm.valid
                        ? "WALL_NOT_CONFIRMED"
                        : !flowConfirm.valid
                            ? "FLOW_NOT_CONFIRMED"
                            : !reaction.valid
                                ? "PRICE_NOT_CONFIRMED"
                                : "SCORE_TOO_LOW"
                  )
    };
}


/* ---------------------------------------------------------
   WATCH -> CONFIRM
--------------------------------------------------------- */

function processConfirmation(symbol){

    const setup =
        ensureSetup(symbol);

    if(
        setup.state !== "WATCH"
    ){
        return null;
    }

    const candidate =
        evaluateSetupCandidate(symbol);

    if(!candidate){

        /*
           Keep WATCH alive for a short period.
           Do not immediately erase it.
        */

        if(
            now() -
            setup.updated >
            CONFIG.RETEST_TIMEOUT
        ){
            setup.state = "IDLE";
            setup.direction = null;
            setup.wall = null;
            setup.reason =
                "WATCH_EXPIRED";
            setup.updated = now();
        }

        return null;
    }

    /*
       Direction must remain identical.
    */

    if(
        setup.direction !==
        candidate.direction
    ){
        return null;
    }

    const confirmation =
        confirmCandidate(
            symbol,
            candidate
        );

    if(!confirmation){
        return null;
    }

    setup.confirmation =
        confirmation.score;

    setup.updated =
        now();

    if(
        confirmation.confirmed
    ){

        setup.state =
            "CONFIRM";

        setup.reason =
            confirmation.reason;

        setup.retest = true;

        return confirmation;
    }

    setup.reason =
        confirmation.reason;

    return confirmation;
}


/* ---------------------------------------------------------
   SIGNAL ELIGIBILITY
--------------------------------------------------------- */

function signalEligible(
    symbol,
    confirmation
){

    if(
        !confirmation ||
        !confirmation.confirmed
    ){
        return false;
    }

    if(
        confirmation.score <
        CONFIG.MIN_QUALITY
    ){
        return false;
    }

    const setup =
        ensureSetup(symbol);

    /*
       Do not create another signal while
       the current one is still alive.
    */

    if(
        setup.signal &&
        now() <
        setup.expires
    ){
        return false;
    }

    const cooldownUntil =
        Number(
            cooldowns.get(symbol) || 0
        );

    if(
        now() <
        cooldownUntil
    ){
        return false;
    }

    return true;
}


/* ---------------------------------------------------------
   SIGNAL CREATION
--------------------------------------------------------- */

function createSignal(
    symbol,
    confirmation
){

    if(
        !signalEligible(
            symbol,
            confirmation
        )
    ){
        return null;
    }

    const setup =
        ensureSetup(symbol);

    const price =
        currentPrice(symbol);

    if(!price){
        return null;
    }

    const direction =
        confirmation.direction;

    const wall =
        confirmation.wall;

    const signal = {
        id:
            symbol +
            "_" +
            direction +
            "_" +
            now(),

        symbol,

        direction,

        entry:price,

        wallPrice:
            wall
                ? wall.price
                : null,

        wallSide:
            wall
                ? wall.side
                : null,

        score:
            confirmation.score,

        created:
            now(),

        updated:
            now(),

        expires:
            now() +
            CONFIG.SIGNAL_TTL,

        active:true,

        status:"ACTIVE",

        reason:
            confirmation.reason,

        reaction:
            confirmation.reaction?.reason ||
            "",

        flowReason:
            confirmation.flowConfirm?.reason ||
            "",

        wallReason:
            confirmation.wallConfirm?.reason ||
            ""
    };

    setup.signal =
        signal;

    setup.state =
        "SIGNAL";

    setup.direction =
        direction;

    setup.wall =
        wall;

    setup.created =
        signal.created;

    setup.updated =
        signal.updated;

    setup.expires =
        signal.expires;

    setup.reason =
        signal.reason;

    cooldowns.set(
        symbol,
        now() +
        CONFIG.COOLDOWN
    );

    logEvent(
        "SIGNAL",
        symbol +
        " " +
        direction +
        " score=" +
        confirmation.score.toFixed(1)
    );

    return signal;
}


/* ---------------------------------------------------------
   SIGNAL MANAGER
--------------------------------------------------------- */

function processSymbolState(symbol){

    recordPrice(symbol);

    const setup =
        ensureSetup(symbol);

    /*
       IDLE -> WATCH
    */

    if(
        setup.state === "IDLE"
    ){

        const candidate =
            analyzeSymbol(symbol);

        if(candidate){

            updateWatchState(
                symbol,
                candidate
            );
        }

        return;
    }


    /*
       WATCH -> CONFIRM
    */

    if(
        setup.state === "WATCH"
    ){

        const confirmation =
            processConfirmation(
                symbol
            );

        if(
            confirmation &&
            confirmation.confirmed
        ){

            createSignal(
                symbol,
                confirmation
            );
        }

        return;
    }


    /*
       CONFIRM -> SIGNAL
    */

    if(
        setup.state === "CONFIRM"
    ){

        const candidate =
            evaluateSetupCandidate(
                symbol
            );

        if(!candidate){
            return;
        }

        const confirmation =
            confirmCandidate(
                symbol,
                candidate
            );

        if(
            confirmation &&
            confirmation.confirmed
        ){

            createSignal(
                symbol,
                confirmation
            );
        }

        return;
    }
}


/* ---------------------------------------------------------
   ACTIVE SIGNAL MONITOR
--------------------------------------------------------- */

function monitorSignal(symbol){

    const setup =
        ensureSetup(symbol);

    const signal =
        setup.signal;

    if(!signal){
        return;
    }

    if(!signal.active){
        return;
    }

    const price =
        currentPrice(symbol);

    if(!price){
        return;
    }

    signal.updated =
        now();

    /*
       Signal expires by time.
    */

    if(
        now() >
        signal.expires
    ){

        signal.active = false;
        signal.status = "EXPIRED";

        setup.signal =
            signal;

        setup.state =
            "IDLE";

        setup.reason =
            "SIGNAL_EXPIRED";

        setup.direction =
            null;

        setup.wall =
            null;

        setup.updated =
            now();

        return;
    }

    /*
       Check whether original wall disappeared.
       We don't instantly kill the signal.
    */

    const wall =
        signal.wallPrice;

    if(wall){

        const distance =
            Math.abs(
                price-wall
            ) /
            price;

        /*
           If price moved significantly away,
           the original setup has completed.
        */

        if(
            distance >
            CONFIG.REACTION_DIST * 3
        ){

            signal.status =
                "MOVED_AWAY";

            signal.active =
                false;

            setup.state =
                "IDLE";

            setup.direction =
                null;

            setup.wall =
                null;

            setup.reason =
                "PRICE_MOVED_AWAY";

            setup.updated =
                now();

            return;
        }
    }
}

                        (

                        symbols.length;

                    const symbol =

                        symbol

                    monitorSignal(

            CONFIG.MANAGER_MS
        );

function activeSignals(){

    const result = [];

    for(const [symbol,setup]
        of setups.entries()){

        if(
            setup.signal &&
            setup.signal.active
        ){
            result.push(
                setup.signal
            );

    return result.sort(
        (a,b)=>
            b.score-a.score
    );

/* ---------------------------------------------------------
   SIGNAL STATISTICS
--------------------------------------------------------- */

function signalStats(){

    let active = 0;
    let expired = 0;
    let moved = 0;

    for(const setup
        of setups.values()){

        const signal =
            setup.signal;

        if(!signal){
            continue;
        }

        if(signal.active){
            active++;
        }

        if(
            signal.status ===
            "EXPIRED"
        ){
            expired++;
        }

        if(
            signal.status ===
            "MOVED_AWAY"
        ){
            moved++;
        }
    }

    return {
        active,
        expired,
        moved
    };
}

/* ---------------------------------------------------------
   DATA QUALITY
--------------------------------------------------------- */

function calculateDataQuality(){

    const symbols =
        universe();

    if(!symbols.length){
        return 0;
    }

    let total = 0;
    let count = 0;

    for(const symbol of symbols){

        const book =
            books.get(symbol);

        const tradesList =
            trades.get(symbol);

        let score = 0;

        /*
           ORDERBOOK
        */

        if(
            book &&
            book.valid &&
            book.synced
        ){
            score += 45;
        }

        if(
            book &&
            freshBook(symbol)
        ){
            score += 20;
        }

        /*
           TRADES
        */

        if(
            tradesList &&
            tradesList.length
        ){
            score += 20;
        }

        if(
            freshTrades(symbol)
        ){
            score += 15;
        }

        total +=
            clamp(score,0,100);

        count++;
    }

    return count
        ? total / count
        : 0;
}


/* ---------------------------------------------------------
   SYMBOL DATA STATUS
--------------------------------------------------------- */

function symbolDataStatus(symbol){

    const book =
        books.get(symbol);

    const tradeList =
        trades.get(symbol);

    const bAge =
        book &&
        book.lastRx
            ? now() - book.lastRx
            : Infinity;

    const lastTrade =
        tradeList &&
        tradeList.length
            ? tradeList[
                tradeList.length - 1
              ]
            : null;

    const tAge =
        lastTrade
            ? now() -
              Number(lastTrade.ts || 0)
            : Infinity;

    return {

        symbol,

        book:
            !!(
                book &&
                book.valid &&
                book.synced
            ),

        bookFresh:
            bAge <=
            CONFIG.BOOK_STALE,

        bookAge:bAge,

        trades:
            !!(
                tradeList &&
                tradeList.length
            ),

        tradeFresh:
            tAge <=
            CONFIG.TRADE_STALE,

        tradeAge:tAge,

        quality:
            marketQuality(symbol)
    };
}

/* ---------------------------------------------------------
   REST / WEBSOCKET WATCHDOG
--------------------------------------------------------- */

function engineWatchdog(){

    if(!running){
        return;
    }

    const timestamp =
        now();

    /*
       If the engine itself has not executed
       for too long, record a diagnostic event.
    */

    if(
        lastEngine &&
        timestamp - lastEngine >
        5000
    ){

        logEvent(
            "WATCHDOG",
            "ENGINE_DELAY " +
            (
                timestamp -
                lastEngine
            ) +
            "ms"
        );
    }

    /*
       Check websocket health.
    */

    const health =
        socketHealth();

    if(
        health.connected > 0 &&
        health.stale > 0
    ){

        logEvent(
            "WS",
            "STALE_SOCKETS=" +
            health.stale
        );

        for(
            const state
            of sockets
        ){

            if(
                state &&
                state.ws &&
                state.ws.readyState ===
                    WebSocket.OPEN
            ){

                const age =
                    timestamp -
                    Number(
                        state.lastMessage || 0
                    );

                if(
                    age >
                    CONFIG.SOCKET_STALE
                ){

                    try{
                        state.ws.close();
                    }catch(error){
                        engineError(
                            "watchdog.close",
                            error
                        );
                    }
                }
            }
        }
    }

    /*
       If no usable sockets remain,
       initiate reconnect.
    */

    if(
        subscribedSymbols.size > 0 &&
        health.connected === 0
    ){

        scheduleGlobalReconnect();
    }
}


/* ---------------------------------------------------------
   GLOBAL RECONNECT
--------------------------------------------------------- */

function scheduleGlobalReconnect(){

    if(!running){
        return;
    }

    if(reconnectTimer){
        return;
    }

    const delay =
        clamp(
            CONFIG.RECONNECT_BASE *
            Math.max(
                1,
                Math.min(
                    globalErrors + 1,
                    8
                )
            ),
            CONFIG.RECONNECT_BASE,
            CONFIG.RECONNECT_MAX
        );

    reconnectTimer =
        setTimeout(
            async ()=>{

                reconnectTimer = null;

                if(!running){
                    return;
                }

                try{

                    await restartSockets();

                }catch(error){

                    engineError(
                        "globalReconnect",
                        error
                    );
                }

            },
            delay
        );
}


/* ---------------------------------------------------------
   RESTART SOCKETS
--------------------------------------------------------- */

async function restartSockets(){

    if(!running){
        return;
    }

    logEvent(
        "WS",
        "RESTART"

    stopSockets();

    /*
       Small delay prevents immediate reconnect storm.

    await sleep(700);

    if(!running){

    await startSockets();

    logEvent(
        "WS",
        "RESTART_COMPLETE"
    );
}

                await restartSockets();

/* ---------------------------------------------------------
   HTF CACHE
--------------------------------------------------------- */

async function loadHTF(){

    /*
       Higher-timeframe context is intentionally lightweight.

       We use REST klines only for the symbols currently
       present in the active universe.

       No signal is generated from HTF alone.
    */

    const symbols =
        universe();

    if(!symbols.length){
        return;
    }

    /*
       Limit the amount of REST traffic.
       Only update a rotating subset.
    */

    const batchSize =
        Math.min(
            10,
            symbols.length
        );

    const start =
        Math.floor(
            now() /
            CONFIG.HTF_MS
        ) %
        symbols.length;

    for(let i=0;i<batchSize;i++){

        const symbol =
            symbols[
                (start+i) %
                symbols.length
            ];

        try{

            const response =
                await rest(
                    "/v5/market/kline",
                    {
                        category:
                            CONFIG.CATEGORY,

                        symbol,

                        interval:"15",

                        limit:20
                    }
                );

            const rows =
                response.result?.list || [];

            if(!rows.length){
                continue;
            }

            /*
               Bybit kline rows:

               [startTime, open, high,
                low, close, volume, turnover]
            */

            const candles =
                rows
                    .map(row=>({
                        ts:Number(row[0]),
                        open:Number(row[1]),
                        high:Number(row[2]),
                        low:Number(row[3]),
                        close:Number(row[4]),
                        volume:Number(row[5]),
                        turnover:Number(row[6])
                    }))
                    .filter(
                        x =>
                            Number.isFinite(
                                x.close
                            )
                    )
                    .sort(
                        (a,b)=>
                            a.ts-b.ts
                    );

            if(candles.length < 5){
                continue;
            }

            const last =
                candles[
                    candles.length-1
                ];

            const previous =
                candles[
                    candles.length-2
                ];

            const closes =
                candles.map(
                    x=>x.close
                );

            const ema20 =
                calculateEMA(
                    closes,
                    20
                );

            const trend =
                last.close > ema20
                    ? "UP"
                    : "DOWN";

            const change =
                previous.close
                    ? (
                        last.close -
                        previous.close
                    ) /
                    previous.close
                    : 0;

            const item =
                ensureHTF(symbol);

            item.symbol =
                symbol;

            item.price =
                last.close;

            item.ema20 =
                ema20;

            item.trend =
                trend;

            item.change =
                change;

            item.updated =
                now();

            item.valid = true;

        }catch(error){

            engineError(
                "HTF:" + symbol,
                error
            );
        }
    }

    lastHTF =
        now();
}


/* ---------------------------------------------------------
   EMA
--------------------------------------------------------- */

function calculateEMA(values,period){

    if(
        !Array.isArray(values) ||
        !values.length
    ){
        return 0;
    }

    if(values.length < period){

        return values[
            values.length-1
        ] || 0;
    }

    const multiplier =
        2 /
        (period + 1);

    let ema =
        values
            .slice(0,period)
            .reduce(
                (sum,x)=>sum+x,
                0
            ) /
            period;

    for(
        let i=period;
        i<values.length;
        i++
    ){

        ema =
            (
                values[i] -
                ema
            ) *
            multiplier +
            ema;
    }

    return ema;
}

/* ---------------------------------------------------------
   DATA CLEANUP
--------------------------------------------------------- */

function cleanupRuntimeData(){

    const timestamp =
        now();

    /*
       Remove expired setups.
    */

    for(
        const [symbol,setup]
        of setups.entries()
    ){

        if(
            setup.signal &&
            !setup.signal.active &&
            timestamp -
                Number(
                    setup.updated || 0
                ) >
                CONFIG.SIGNAL_TTL
        ){

            setup.signal =
                null;
        }
    }

    /*
       Remove expired cooldowns.
    */

    for(
        const [
            symbol,
            expires
        ]
        of cooldowns.entries()
    ){

        if(
            timestamp >=
            Number(expires || 0)
        ){
            cooldowns.delete(
                symbol
            );
        }
    }

    /*
       Limit journal size.
    */

    while(
        journal.length >
        CONFIG.MAX_JOURNAL
    ){
        journal.shift();
    }
}

async function startEngine(){

    if(running){
        return;
    }

    running = true;

    mode = "BALANCED";

    startedAt =
        now();

    lastError = "";

    setStatus(
        "Запуск..."
    );

    logEvent(
        "ENGINE",
        "START"
    );

    try{

        /*
           STEP 1
           Instruments + tickers
        */

        await initializeMarket();

        if(
            !validUniverse()
        ){
            throw new Error(
                "Не удалось получить торговую вселенную"
            );
        }

        /*
           STEP 2
           WebSockets
        */

        setStatus(
            "Подключение WebSocket..."
        );

        await startSockets();

        /*
           STEP 3
           Analysis loops
        */

        startAnalysisLoop();

        startManagerLoop();

        startPingLoop();

        startWatchdog();

        startUniverseLoop();

        startHTFLoop();

        startCleanupLoop();

        setStatus(
            "Работает"
        );

        logEvent(
            "ENGINE",
            "READY"
        );

    }catch(error){

        engineError(
            "startEngine",
            error
        );

        /*
           Important:
           partially started engine must be
           completely stopped.
        */

        try{
            stopEngine();
        }catch(stopError){
            engineError(
                "startEngine.stop",
                stopError
            );
        }

        setStatus(
            "Ошибка запуска"
        );
    }
}

/* ---------------------------------------------------------
   NUMBER FORMAT
--------------------------------------------------------- */

function fmtNumber(value,digits=2){

    const n =
        Number(value);

    if(!Number.isFinite(n)){
        return "—";
    }

    return n.toLocaleString(
        "en-US",
        {
            minimumFractionDigits:digits,
            maximumFractionDigits:digits
        }
    );
}


/* ---------------------------------------------------------
   AGE FORMAT
--------------------------------------------------------- */

function fmtAge(ms){

    if(
        !Number.isFinite(ms) ||
        ms < 0
    ){
        return "—";
    }

    if(ms < 1000){
        return "<1с";
    }

    if(ms < 60000){
        return (
            Math.floor(ms/1000) +
            "с"
        );
    }

    return (
        Math.floor(ms/60000) +
        "м"
    );
}

        return "signal-long";
    }

    if(direction === "SHORT"){

}

            </div>


            <div class="signal-reason">

                ${signal.reason || ""}

            </div>


            <div class="signal-details">

                ${signal.reaction || ""}

                ${signal.flowReason
                    ? " · " + signal.flowReason
                    : ""}

            </div>

        </div>
    `;
}


/* ---------------------------------------------------------
   WATCH CARD
--------------------------------------------------------- */

function renderWatchCard(symbol,setup){

    if(
        !setup ||
        setup.state === "IDLE"
    ){
        return "";
    }

    const direction =
        setup.direction || "WATCH";

    const price =
        currentPrice(symbol);

    const wall =
        setup.wall;

    const score =
        Number(
            setup.confirmation || 0
        );

    return `
        <div class="watch-card">

            <div class="watch-head">

                <b>${symbol}</b>

                <span>
                    ${direction}
                </span>

            </div>

            <div class="watch-grid">

                <div>
                    <small>PRICE</small>
                    <b>
                        ${
                            price
                                ? fmtPrice(
                                    symbol,
                                    price
                                )
                                : "—"
                        }
                    </b>
                </div>

                <div>
                    <small>WALL</small>
                    <b>
                        ${
                            wall
                                ? fmtPrice(
                                    symbol,
                                    wall.price
                                )
                                : "—"
                        }
                    </b>
                </div>

                <div>
                    <small>SCORE</small>
                    <b>
                        ${score.toFixed(0)}
                    </b>
                </div>

            </div>

            <div class="watch-reason">
                ${setup.reason || "WATCH"}
            </div>

        </div>
    `;
}


/* ---------------------------------------------------------
   RENDER SIGNALS
--------------------------------------------------------- */

function renderSignals(){

    const container =
        $("signals");

    if(!container){
        return;
    }

    const active =
        activeSignals();

    const watch =
        [];

    for(
        const [symbol,setup]
        of setups.entries()
    ){

        if(
            setup.state === "WATCH" ||
            setup.state === "CONFIRM"
        ){

            watch.push(
                renderWatchCard(
                    symbol,
                    setup
                )
            );
        }
    }

    const signalHtml =
        active
            .map(
                renderSignalCard
            )
            .join("");

    const watchHtml =
        watch.join("");

    if(
        !signalHtml &&
        !watchHtml
    ){

        container.innerHTML = `
            <div class="empty-state">
                Ожидание подтвержденных сигналов...
            </div>
        `;

        return;
    }

    container.innerHTML =
        signalHtml +
        watchHtml;
}

/* ---------------------------------------------------------
   CONNECTION STATUS
--------------------------------------------------------- */

function connectionStatus(){

    const health =
        socketHealth();

    if(!running){
        return "ОСТАНОВЛЕН";
    }

    if(
        health.connected === 0
    ){
        return "WS: НЕТ СОЕДИНЕНИЯ";
    }

    if(
        health.stale > 0
    ){
        return (
            "WS: ПРОБЛЕМА (" +
            health.stale +
            ")"
        );
    }

    if(
        health.subscribed <
        health.total
    ){
        return "WS: ПОДКЛЮЧЕНИЕ";
    }

    return "WS: ONLINE";
}

--------------------------------------------------------- */

function renderJournal(){

   FULL UI RENDER
--------------------------------------------------------- */

function renderUI(){

    if(
        now() -
        lastRender <
        CONFIG.UI_MS
    ){
        return;
    }

    lastRender =
        now();

    try{

        renderStats();

        renderSignals();

        renderDiagnostics();

        renderHealth();

        renderLastError();

        renderJournal();

    }catch(error){

        engineError(
            "renderUI",
            error
        );
    }
}


/* ---------------------------------------------------------
   UI LOOP
--------------------------------------------------------- */

function startUILoop(){

    if(uiTimer){
        clearInterval(
            uiTimer
        );
    }

    uiTimer =
        setInterval(
            ()=>{
                renderUI();
            },
            CONFIG.UI_MS
        );
}


/* ---------------------------------------------------------
   BUTTON STATE
--------------------------------------------------------- */

function updateButtons(){

    const start =
        $("start");

    const stop =
        $("stop");

    const clear =
        $("clear");

    if(start){

        start.disabled =
            running;
    }

    if(stop){

        stop.disabled =
            !running;
    }

    if(clear){

        clear.disabled =
            false;
    }
}


/* ---------------------------------------------------------
   BUTTON HANDLERS
--------------------------------------------------------- */

function bindUI(){

    const start =
        $("start");

    const stop =
        $("stop");

    const clear =
        $("clear");

    const balanced =
        $("balanced");

    if(start){

        start.addEventListener(
            "click",
            async ()=>{
                await safeStart();
                updateButtons();
            }
        );
    }


    if(stop){

        stop.addEventListener(
            "click",
            ()=>{
                safeStop();
                updateButtons();
            }
        );
    }


    if(clear){

        clear.addEventListener(
            "click",
            ()=>{
                clearEngineData();
                renderUI();
            }
        );
    }


    if(balanced){

        balanced.addEventListener(
            "click",
            ()=>{
                setEngineMode(
                    "BALANCED"
                );

                uiText(
                    "mode",
                    "BALANCED"
                );
            }
        );
    }
}


/* ---------------------------------------------------------
   KEYBOARD SHORTCUTS
--------------------------------------------------------- */

function bindKeyboard(){

    document.addEventListener(
        "keydown",
        event=>{

            /*
               Do not trigger shortcuts
               while typing into an input.
            */

            const tag =
                event.target?.tagName;

            if(
                tag === "INPUT" ||
                tag === "TEXTAREA" ||
                tag === "SELECT"
            ){
                return;
            }

            if(
                event.key === " "
            ){

                event.preventDefault();

                if(running){
                    safeStop();
                }else{
                    safeStart();
                }

                updateButtons();
            }

        }
    );
}


/* ---------------------------------------------------------
   INITIAL UI
--------------------------------------------------------- */

function initializeUI(){

    bindUI();

    bindKeyboard();

    startUILoop();

    updateButtons();

    renderUI();

    setStatus(

}

/* ---------------------------------------------------------
   REQUIRED DOM CHECK
--------------------------------------------------------- */

function checkRequiredDOM(){

    const required = [
        "start",
        "stop",
        "clear",
        "balanced",
        "signals",
        "diagnostics",
        "health"
    ];

    const missing = [];

    for(
        const id
        of required
    ){

        if(!$(id)){
            missing.push(id);
        }
    }

    if(missing.length){

        const message =
            "Не найдены элементы интерфейса: " +
            missing.join(", ");

        engineError(
            "DOM_CHECK",
            new Error(message)
        );

        return false;
    }

    return true;
}


/* ---------------------------------------------------------
   CONFIG VALIDATION
--------------------------------------------------------- */

function validateConfig(){

    const errors = [];

    if(
        !CONFIG.REST ||
        !CONFIG.REST.startsWith("http")
    ){
        errors.push(
            "REST URL"
        );
    }

    if(
        !CONFIG.WS ||
        !CONFIG.WS.startsWith("ws")
    ){
        errors.push(
            "WebSocket URL"
        );
    }

    if(
        CONFIG.TOP < 1 ||
        CONFIG.TOP > 500
    ){
        errors.push(
            "TOP"
        );
    }

    if(
        CONFIG.DEPTH < 1
    ){
        errors.push(
            "DEPTH"
        );
    }

    if(
        CONFIG.SCAN_MS < 100
    ){
        errors.push(
            "SCAN_MS"
        );
    }

    if(
        CONFIG.WALL_MAX_DIST <=
        CONFIG.WALL_MIN_DIST
    ){
        errors.push(
            "WALL_DISTANCE"
        );
    }

    if(
        CONFIG.WALL_RATIO <= 1
    ){
        errors.push(
            "WALL_RATIO"
        );
    }

    if(errors.length){

        throw new Error(
            "CONFIG ERROR: " +
            errors.join(", ")
        );
    }

    return true;
}


/* ---------------------------------------------------------
   BROWSER CAPABILITY CHECK
--------------------------------------------------------- */

function checkBrowser(){

    const errors = [];

    if(
        typeof WebSocket ===
        "undefined"
    ){
        errors.push(
            "WebSocket"
        );
    }

    if(
        typeof fetch ===
        "undefined"
    ){
        errors.push(
            "fetch"
        );
    }

    if(
        typeof Map ===
        "undefined"
    ){
        errors.push(
            "Map"
        );
    }

    if(
        typeof Set ===
        "undefined"
    ){
        errors.push(
            "Set"
        );
    }

    if(errors.length){

        throw new Error(
            "Браузер не поддерживает: " +
            errors.join(", ")
        );
    }

    return true;
}


/* ---------------------------------------------------------
   FINAL PRE-FLIGHT
--------------------------------------------------------- */

function preflight(){

    try{

        checkBrowser();

        validateConfig();

        if(
            !checkRequiredDOM()
        ){
            throw new Error(
                "DOM CHECK FAILED"
            );
        }

        logEvent(
            "PREFLIGHT",
            "OK"
        );

        return true;

    }catch(error){

        engineError(
            "preflight",
            error
        );

        setStatus(
            "Ошибка проверки"
        );

        return false;
    }
}


/* ---------------------------------------------------------
   STARTUP
--------------------------------------------------------- */

function boot(){

    try{

        if(
            !preflight()
        ){
            return;
        }

        initializeUI();

        /*
           Initial empty state.
        */

        renderUI();

        logEvent(
            "BOOT",
            "APPLICATION_READY"
        );

        setStatus(
            "Готов к запуску"
        );

    }catch(error){

        engineError(
            "boot",
            error
        );

        setStatus(
            "Ошибка запуска UI"
        );
    }
}


/* ---------------------------------------------------------
   DOM READY
--------------------------------------------------------- */

if(
    document.readyState ===
    "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        boot,
        {
            once:true
        }
    );

}else{

    boot();
}
