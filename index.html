<script>
'use strict';
const API='https://api.bybit.com';
const WS_URL='wss://stream.bybit.com/v5/public/linear';
const CFG={
 TOP:200,DEPTH:50,ZONE_LOOKBACK:120,SWING:3,MAX_WALL_DIST:.004,ZONE_PAD:.0018,MIN_ZONE_SCORE:58,
 MAX_CARDS:8,ENTRY_TTL:1800000,WATCH_TTL:300000,COOLDOWN:1200000,BOOK_STALE:5000,WALL_MIN_AGE:8000,
 REACTION_WINDOW:20000,PRICE_HISTORY:60000,MIN_TF_ALIGN:3,WALL_RATIO:3,ABSORB_RATIO:.25,REACTION_ATR:.18,MIN_RR:2,
 WS_SYMBOLS_PER_CONN:20,WS_MAX:10,HTF_BATCH:8,TOP_REFRESH:900000,ANALYSIS_BASE:350,ANALYSIS_MAX:1600,
 REST_MIN_GAP:80,REST_MAX_RETRIES:5
};
let running=false,mode='watch',wsList=[],reconnectTimer=null,pingTimer=null,scanTimer=null,renderTimer=null,topRefreshTimer=null,analysisTimer=null;
let restBusy=false,lastRestAt=0;
const coins=new Map(),books=new Map(),trades=new Map(),zones=new Map(),states=new Map(),signals=new Map(),metrics=new Map();
const priority={high:new Set(),mid:new Set(),low:new Set()};
const $=id=>document.getElementById(id),now=()=>Date.now(),num=x=>Number(x)||0,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const fmt=n=>{n=num(n);if(!n)return '$0';const a=Math.abs(n);if(a>=1e6)return '$'+(n/1e6).toFixed(2)+'M';if(a>=1e3)return '$'+(n/1e3).toFixed(1)+'K';if(a>=1)return '$'+n.toFixed(0);return '$'+n.toFixed(2)};
function setStatus(t,good=true){$('status').textContent=t;$('status').className='status '+(good?'good':'bad')}
function stat(label,val){return '<div class="stat"><b>'+val+'</b><span>'+label+'</span></div>'}
function renderStats(){let ws=wsList.filter(x=>x.readyState===1).length,wall=0,cand=0,sig=0,good=0;for(const s of coins.keys()){const b=books.get(s);if(b?.valid)good++;if(states.get(s)?.wall)wall++;if(states.get(s)?.candidate)cand}for(const x of signals.values())if(x.expires>now())sig;$('stats').innerHTML=stat('МОНЕТЫ',coins.size)+stat('СТЕНЫ',wall)+stat('КАНДИДАТЫ',cand)+stat('СИГНАЛЫ',sig)+stat('WS',ws);}
function clean(arr,maxAge){const t=now()-maxAge;while(arr.length&&arr[0].ts<t)arr.shift()}
function median(a){if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2}
async function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function getJSON(path,params,attempt=0){const wait=Math.max(0,CFG.REST_MIN_GAP-(performance.now()-lastRestAt));if(wait)await sleep(wait);lastRestAt=performance.now();const u=new URL(API+path);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));try{const r=await fetch(u,{cache:'no-store'});if(r.status===429){if(attempt>=CFG.REST_MAX_RETRIES)throw Error('HTTP 429: лимит REST');await sleep(Math.min(8000,500*Math.pow(2,attempt)));return getJSON(path,params,attempt+1)}if(!r.ok){if(attempt<CFG.REST_MAX_RETRIES&&r.status>=500){await sleep(500*Math.pow(2,attempt));return getJSON(path,params,attempt+1)}throw Error('HTTP '+r.status)}const j=await r.json();if(j.retCode!==0){if(attempt<CFG.REST_MAX_RETRIES&&[10006,10016].includes(j.retCode)){await sleep(Math.min(8000,500*Math.pow(2,attempt)));return getJSON(path,params,attempt+1)}throw Error(j.retMsg||'Bybit error')}metrics.set('restLatency',Math.round(performance.now()-lastRestAt));return j.result}catch(e){if(attempt<CFG.REST_MAX_RETRIES&&/Failed to fetch|NetworkError|network/i.test(e.message)){await sleep(500*Math.pow(2,attempt));return getJSON(path,params,attempt+1)}throw e}}
async function loadCoins(){const r=await getJSON('/v5/market/tickers',{category:'linear'});const a=(r.list||[]).filter(x=>x.symbol.endsWith('USDT')&&num(x.turnover24h)>0).sort((a,b)=>num(b.turnover24h)-num(a.turnover24h)).slice(0,CFG.TOP);const old=new Set(coins.keys());coins.clear();for(let i=0;i<a.length;i++)coins.set(a[i].symbol,{rank:i+1,turn:num(a[i].turnover24h),price:num(a[i].lastPrice)});return{added:[...coins.keys()].filter(s=>!old.has(s)),removed:[...old].filter(s=>!coins.has(s))}}
function candlesToObj(list){return [...list].reverse().map(x=>({ts:num(x[0]),o:num(x[1]),h:num(x[2]),l:num(x[3]),c:num(x[4]),v:num(x[5]),q:num(x[6])})).filter(x=>x.o&&x.h&&x.l&&x.c)}
async function loadTF(sym,interval){const r=await getJSON('/v5/market/kline',{category:'linear',symbol:sym,interval,limit:CFG.ZONE_LOOKBACK});return candlesToObj(r.list||[]).filter(x=>x.ts<now()-60000)}
function swings(c){const out=[];for(let i=CFG.SWING;i<c.length-CFG.SWING;i++){let hi=true,lo=true;for(let j=1;j<=CFG.SWING;j++){if(c[i].h<=c[i-j].h||c[i].h<c[i+j].h)hi=false;if(c[i].l>=c[i-j].l||c[i].l>c[i+j].l)lo=false}if(hi)out.push({p:c[i].h,kind:'SHORT',ts:c[i].ts});if(lo)out.push({p:c[i].l,kind:'LONG',ts:c[i].ts})}return out}
function atr(c){if(c.length<15)return 0;const a=[];for(let i=1;i<c.length;i++)a.push(Math.max(c[i].h-c[i].l,Math.abs(c[i].h-c[i-1].c),Math.abs(c[i].l-c[i-1].c)));return median(a.slice(-40))}
function buildZones(sym,tf4,tf1,tf15){const all=[];for(const z of swings(tf4))all.push({...z,tf:'4H',w:5});for(const z of swings(tf1))all.push({...z,tf:'1H',w:3});for(const z of swings(tf15))all.push({...z,tf:'15M',w:1.5});all.sort((a,b)=>a.p-b.p);const lastPrice=tf1.at(-1)?.c||tf4.at(-1)?.c||0,ar=atr(tf1)||(lastPrice*.003),tol=Math.max(ar*.75,lastPrice*CFG.ZONE_PAD),zs=[];for(const z of all){let g=zs.find(x=>Math.abs(x.p-z.p)<=tol);if(!g){g={p:z.p,lo:z.p,hi:z.p,score:0,tfs:new Set(),long:0,short:0,last:z.ts,count:0};zs.push(g)}g.p=(g.p*g.count+z.p)/(g.count+1);g.lo=Math.min(g.lo,z.p);g.hi=Math.max(g.hi,z.p);g.score+=z.w;g.tfs.add(z.tf);g[z.kind==='LONG'?'long':'short']+=z.w;g.last=Math.max(g.last,z.ts);g.count++}for(const g of zs){const ageH=(now()-g.last)/3600000;g.score+=Math.max(0,8-ageH*.5);g.tfsScore=g.tfs.has('4H')?30:0;if(g.tfs.has('1H'))g.tfsScore+=18;if(g.tfs.has('15M'))g.tfsScore+=8;g.score+=g.tfsScore}return zs.filter(z=>z.score>=CFG.MIN_ZONE_SCORE/2).sort((a,b)=>b.score-a.score).slice(0,18)}
async function loadAllHTF(){const syms=[...coins.keys()];let done=0;for(let c=0;c<syms.length;c+=CFG.HTF_BATCH){if(!running)break;const chunk=syms.slice(c,c+CFG.HTF_BATCH);await Promise.all(chunk.map(async s=>{try{const [h4,h1,m15]=await Promise.all([loadTF(s,'240'),loadTF(s,'60'),loadTF(s,'15')]);zones.set(s,buildZones(s,h4,h1,m15));metrics.set(s,{...(metrics.get(s)||{}),atr1:atr(h1),atr15:atr(m15),htfAt:now()})}catch(e){metrics.set(s,{...(metrics.get(s)||{}),error:e.message})}done++}));$('diag').textContent='Загрузка HTF: '+done+'/'+syms.length+'\nBatch: '+CFG.HTF_BATCH+' | REST: '+(metrics.get('restLatency')?.toString()||'?')+' ms';await sleep(100)} }
function ensureBook(s){if(!books.has(s))books.set(s,{bids:new Map(),asks:new Map(),valid:false,last:0,u:0,seq:0,wallHist:new Map()});return books.get(s)}
function applyBook(d){const s=d.s;if(!coins.has(s))return;const b=ensureBook(s),type=d.type;if(type==='snapshot'){b.bids.clear();b.asks.clear();for(const [p,q] of d.b||[])b.bids.set(num(p),num(q));for(const [p,q] of d.a||[])b.asks.set(num(p),num(q));b.valid=true}else if(type==='delta'&&b.valid){for(const [p,q] of d.b||[]){const qty=num(q),price=num(p);qty?b.bids.set(price,qty):b.bids.delete(price)}for(const [p,q] of d.a||[]){const qty=num(q),price=num(p);qty?b.asks.set(price,qty):b.asks.delete(price)}}b.last=now();b.u=num(d.u);b.seq=num(d.seq)}
function addTrade(d){const s=d.s;if(!coins.has(s))return;let a=trades.get(s);if(!a)trades.set(s,a=[]);const p=num(d.p),q=num(d.v),side=d.S==='Buy'?'BUY':'SELL';a.push({ts:num(d.T)||now(),p,q,side,usd:p*q});clean(a,CFG.PRICE_HISTORY);const c=coins.get(s);if(c)c.price=p}
function subscribe(ws,symbols){const args=[];for(const s of symbols)args.push('orderbook.'+CFG.DEPTH+'.'+s,'publicTrade.'+s);ws.send(JSON.stringify({op:'subscribe',args}))}
function closeSockets(){for(const w of wsList)try{w.close()}catch{}wsList=[]}
function connect(){closeSockets();clearTimeout(reconnectTimer);reconnectTimer=null;clearInterval(pingTimer);const arr=[...coins.keys()];const need=Math.min(CFG.WS_MAX,Math.ceil(arr.length/CFG.WS_SYMBOLS_PER_CONN));for(let i=0;i<need;i++){const chunk=arr.slice(i*CFG.WS_SYMBOLS_PER_CONN,(i+1)*CFG.WS_SYMBOLS_PER_CONN);const w=new WebSocket(WS_URL);wsList.push(w);w.onopen=()=>{subscribe(w,chunk);setStatus('WebSocket: '+wsList.filter(x=>x.readyState===1).length+'/'+need+' | TOP-'+coins.size)};w.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.topic?.startsWith('orderbook.'+CFG.DEPTH+'.'))applyBook(m.data);else if(m.topic?.startsWith('publicTrade.'))for(const t of m.data||[])addTrade(t)}catch{}};w.onclose=()=>{if(running&&!reconnectTimer){reconnectTimer=setTimeout(()=>{reconnectTimer=null;connect()},2000)}};w.onerror=()=>{try{w.close()}catch{}}}pingTimer=setInterval(()=>wsList.forEach(w=>{if(w.readyState===1)try{w.send(JSON.stringify({op:'ping'}))}catch{}}),20000)}
function localLiquidity(book,price){const vals=[];for(const [p,q] of book.bids)if(Math.abs(p-price)/price<.003)vals.push(p*q);for(const [p,q] of book.asks)if(Math.abs(p-price)/price<.003)vals.push(p*q);return median(vals)}
function adaptiveWallMin(s,liq){const turn=coins.get(s)?.turn||0,rank=coins.get(s)?.rank||999;let mult=rank<=50?2.0:rank<=100?1.8:rank<=150?1.6:1.45;return Math.max(1200,liq*mult,(turn/86400)*8)}
function bestWall(s,zone,side,price){const b=books.get(s);if(!b?.valid||now()-b.last>CFG.BOOK_STALE)return null;const map=side==='LONG'?b.bids:b.asks,candidates=[];for(const [p,q] of map){if(Math.abs(p-zone.p)/zone.p>CFG.MAX_WALL_DIST)continue;if(side==='LONG'&&p>price*1.001)continue;if(side==='SHORT'&&p<price*.999)continue;const usd=p*q;if(usd>0)candidates.push({p,q,usd})}if(!candidates.length)return null;candidates.sort((a,b)=>b.usd-a.usd);const liq=localLiquidity(b,price),min=adaptiveWallMin(s,liq),w=candidates[0];if(w.usd<min)return null;for(const [k,v] of b.wallHist.entries())if(now()-v.last>60000)b.wallHist.delete(k);const step=Math.max(price*.0005,1e-8),priceBin=(Math.round(w.p/step)*step).toFixed(8),key=side+'@'+priceBin,h=b.wallHist.get(key)||{first:now(),last:now(),max:0};h.last=now();h.max=Math.max(h.max,w.usd);b.wallHist.set(key,h);return{...w,age:now()-h.first,liq,min,ratio:liq?w.usd/liq:0}}
function flowStats(s,price,window){const a=trades.get(s)||[],t=now()-window;let buy=0,sell=0,near=0;for(const x of a){if(x.ts<t)continue;const nearPrice=Math.abs(x.p-price)/price<.002;if(nearPrice){near++;if(x.side==='BUY')buy+=x.usd;else sell+=x.usd}}return{buy,sell,delta:buy-sell,total:buy+sell,near}}
function reaction(s,side){const a=trades.get(s)||[];if(a.length<2)return{score:0,move:0};const t=now()-CFG.REACTION_WINDOW,arr=a.filter(x=>x.ts>=t);if(arr.length<3)return{score:0,move:0};const first=arr[0].p,last=arr.at(-1).p,move=(last-first)/first,dir=side==='LONG'?move:-move,score=clamp(dir/.0015*35,0,35);return{score,move}}
function stateFor(s){if(!states.has(s))states.set(s,{stage:'ОЖИДАНИЕ',side:null,zone:null,wall:null,candidate:false,quality:0,updated:0,priority:'low',lastEval:0});return states.get(s)}
function priorityScore(s){const st=stateFor(s),b=books.get(s),c=coins.get(s);if(!c||!b?.valid)return 0;let p=0;if(now()-b.last<1500)p+=20;if(st.wall)p+=35;if(st.candidate)p+=40;const zs=zones.get(s)||[];const price=c.price;if(zs.some(z=>Math.abs(price-z.p)/price<CFG.MAX_WALL_DIST))p+=25;const m=metrics.get(s);if(m?.htfAt&&now()-m.htfAt<CFG.TOP_REFRESH)p+=5;return p}
function rebuildPriority(){priority.high.clear();priority.mid.clear();priority.low.clear();for(const s of coins.keys()){const p=priorityScore(s);if(p>=55)priority.high.add(s);else if(p>=25)priority.mid.add(s);else priority.low.add(s);}}
function nextQueue(){const h=[...priority.high],m=[...priority.mid],l=[...priority.low];return [...h,...m,...l]}
function evaluate(s){const st=stateFor(s),c=coins.get(s),zs=zones.get(s)||[],b=books.get(s);st.candidate=false;st.wall=null;st.quality=0;if(!c||!b?.valid||now()-b.last>CFG.BOOK_STALE){st.stage='НЕТ ДАННЫХ';return}const price=c.price;let best=null;for(const z of zs){const dist=Math.abs(price-z.p)/price;if(dist>CFG.MAX_WALL_DIST)continue;const has4H=z.tfs.has('4H'),has1H=z.tfs.has('1H'),has15M=z.tfs.has('15M');if(mode==='entry'&&(!has4H||!has1H||!has15M))continue;if(mode==='watch'&&z.tfs.size<2)continue;const atr1=metrics.get(s)?.atr1||price*.002;for(const side of ['LONG','SHORT']){const directional=side==='LONG'?z.long>=z.short*1.5:z.short>=z.long*1.5;if(!directional)continue;const wall=bestWall(s,z,side,price);if(!wall||wall.age<CFG.WALL_MIN_AGE||wall.ratio<CFG.WALL_RATIO)continue;const f=flowStats(s,price,Number($('flowWindow').value)),opp=side==='LONG'?f.sell:f.buy,flowRatio=wall.usd?opp/wall.usd:0;if(flowRatio<CFG.ABSORB_RATIO)continue;const react=reaction(s,side);if(react.score<18)continue;if(side==='LONG'&&price<z.lo)continue;if(side==='SHORT'&&price>z.hi)continue;const stop=side==='LONG'?z.lo-atr1*.12:z.hi+atr1*.12,risk=Math.abs(price-stop),target=side==='LONG'?price+Math.max(risk*2.2,atr1*.8):price-Math.max(risk*2.2,atr1*.8),rr=Math.abs(target-price)/Math.max(risk,1e-12);if(rr<CFG.MIN_RR)continue;const maxChase=atr1*.55;if(side==='LONG'&&price>z.hi+maxChase)continue;if(side==='SHORT'&&price<z.lo-maxChase)continue;const rank=c.rank,rankBonus=rank>100?Math.min(8,(rank-100)*.04):0,qualityScore=Math.min(100,Math.round(z.score*.4+react.score*1.2+Math.min(wall.ratio*5,20)+rankBonus));const minQuality=Number($('quality').value)||84;if(qualityScore<minQuality)continue;const x={side,zone:z,wall,flow:f,opp,react,price,entry:price,stop,target,rr,flowRatio,abs:flowRatio*100,quality:qualityScore};if(!best||x.quality>best.quality)best=x}}
if(!best){st.stage='ОЖИДАНИЕ';return}st.side=best.side;st.zone=best.zone;st.wall=best.wall;st.quality=best.quality;st.candidate=true;st.updated=now();st.priority='high';st.stage='ПОДТВЕРЖДЁН';createSignal(s,best)}
function createSignal(s,x){const old=signals.get(s);if(old&&old.expires>now())return;if(old&&now()-old.ts<CFG.COOLDOWN)return;signals.set(s,{symbol:s,side:x.side,price:x.price,entry:x.entry,stop:x.stop,target:x.target,rr:x.rr,ts:now(),expires:now()+CFG.ENTRY_TTL,zone:x.zone,flow:x.flow,abs:x.abs,react:x.react,quality:x.quality})}
function scanPriority(){if(!running)return;rebuildPriority();const q=nextQueue(),t=now();let budget=0;for(const s of q){const st=stateFor(s),age=t-st.lastEval,interval=priority.high.has(s)?CFG.ANALYSIS_BASE:priority.mid.has(s)?700:CFG.ANALYSIS_MAX;if(age>=interval){evaluate(s);st.lastEval=t;budget++;if(budget>=45)break}}}
function stages(side,x){const flowOpp=side==='LONG'?x.flow?.sell||0:x.flow?.buy||0;return '<div class="stages"><span class="stage ok">4H ✓</span><span class="stage '+(x.zone?.tfs?.has('1H')?'ok':'warn')+'">1H '+(x.zone?.tfs?.has('1H')?'✓':'наблюдение')+'</span><span class="stage '+(x.zone?.tfs?.has('15M')?'ok':'warn')+'">15M '+(x.zone?.tfs?.has('15M')?'✓':'уточнение')+'</span><span class="stage ok">Стена ✓</span><span class="stage '+(flowOpp>0?'ok':'warn')+'">Поток '+fmt(flowOpp)+'</span><span class="stage '+((x.abs||0)>=10?'ok':'warn')+'">Поглощение '+((x.abs||0).toFixed(0))+'%</span><span class="stage '+((x.react?.score||0)>=10?'ok':'warn')+'">Реакция '+((x.react?.score||0).toFixed(0))+'</span></div>'}
function fmtPrice(v){if(!Number.isFinite(v))return '-';if(v>=100)return v.toFixed(2);if(v>=1)return v.toFixed(4);if(v>=.01)return v.toFixed(6);return v.toFixed(8)}
function cardSignal(x){const cls=x.side==='LONG'?'long':'short',qBadge=x.quality?'<span class="badge">Качество: '+x.quality+'</span>':'';return '<div class="card '+cls+'"><div class="head"><div><span class="sym">'+x.symbol+'</span> <span class="side '+cls+'">'+x.side+'</span></div>'+qBadge+'</div><div class="grid"><div class="kv"><small>ВХОД</small><b>'+fmtPrice(x.entry)+'</b></div><div class="kv"><small>СТОП</small><b>'+fmtPrice(x.stop)+'</b></div><div class="kv"><small>ТЕЙК</small><b>'+fmtPrice(x.target)+'</b></div><div class="kv"><small>RR</small><b>'+x.rr.toFixed(1)+'</b></div></div>'+stages(x.side,x)+'</div>'}
function render(){const list=[...signals.values()].filter(x=>x.expires>now()).sort((a,b)=>b.ts-a.ts);$('cards').innerHTML=list.length?list.slice(0,CFG.MAX_CARDS).map(cardSignal).join(''):'<div class="empty">Нет подтверждённых входов. Качество важнее количества.</div>';renderStats();renderDiag()}
function renderDiag(){let stale=0,valid=0;for(const b of books.values()){if(b.valid)valid++;if(now()-b.last>CFG.BOOK_STALE)stale}let errors=[...metrics.values()].filter(x=>x.error).length,hi=priority.high.size,mi=priority.mid.size,lo=priority.low.size;$('diag').textContent='Режим: '+(mode==='watch'?'НАБЛЮДЕНИЕ':'ВХОД')+'\nМонет: '+coins.size+' | Стаканов: '+valid+' | Устарели: '+stale+' | REST errors: '+errors+'\nОчередь: HIGH '+hi+' | MID '+mi+' | LOW '+lo+'\nWS: '+wsList.filter(w=>w.readyState===1).length+'/'+Math.min(CFG.WS_MAX,Math.ceil(coins.size/CFG.WS_SYMBOLS_PER_CONN))+' | HTF batch: '+CFG.HTF_BATCH+'\nTOP refresh: 15 мин | REST retry/429: включён\nЛогика: HTF + зона + стена + поток + абсорбция + реакция + RR + антиспам';}
async function refreshTop(){if(!running)return;try{const old=[...coins.keys()];const ch=await loadCoins();const changed=ch.added.length||ch.removed.length;if(changed){for(const s of ch.removed){books.delete(s);trades.delete(s);zones.delete(s);states.delete(s);signals.delete(s)}connect();await loadAllHTF()}else{for(const s of coins.keys()){const c=coins.get(s);if(c) c.price=c.price||0}}$('diag').textContent='TOP обновлён: '+new Date().toLocaleTimeString('ru-RU')+'\nTOP-200 | новых: '+ch.added.length+' | удалено: '+ch.removed.length;setStatus('TOP-200 обновлён | WebSocket и HTF синхронизированы')}catch(e){setStatus('Ошибка обновления TOP: '+e.message,false)}}
function startLoops(){clearInterval(scanTimer);clearInterval(renderTimer);clearInterval(topRefreshTimer);scanTimer=setInterval(scanPriority,150);renderTimer=setInterval(render,900);topRefreshTimer=setInterval(refreshTop,CFG.TOP_REFRESH)}
async function start(){if(running)return;running=true;$('startBtn').classList.add('on');setStatus('Загрузка TOP-200 и HTF-зон…');try{await loadCoins();await loadAllHTF();connect();startLoops();rebuildPriority();setStatus('Сканер запущен: TOP-200 | 10 WS | приоритетный Order Flow');render()}catch(e){running=false;setStatus('Ошибка запуска: '+e.message,false);$('diag').textContent=e.stack||e.message}}
function stop(){running=false;clearInterval(scanTimer);clearInterval(renderTimer);clearInterval(topRefreshTimer);clearInterval(pingTimer);clearTimeout(reconnectTimer);for(const w of wsList)try{w.close()}catch{}wsList=[];setStatus('Остановлен',false);render()}
function clearCards(){signals.clear();for(const st of states.values())st.candidate=false;$('cards').innerHTML='<div class="empty">Карточки очищены</div>';renderStats()}
$('startBtn').onclick=start;$('stopBtn').onclick=stop;$('clearBtn').onclick=clearCards;$('watchBtn').onclick=()=>{mode='watch';$('watchBtn').classList.add('active');$('entryBtn').classList.remove('active');render()};$('entryBtn').onclick=()=>{mode='entry';$('entryBtn').classList.add('active');$('watchBtn').classList.remove('active');render()};window.addEventListener('beforeunload',stop);renderStats();
</script>
</body>
