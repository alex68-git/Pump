<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bybit HTF OrderFlow — Русская версия</title>
<style>
:root{--bg:#07090c;--panel:#10141a;--panel2:#151a21;--text:#e8edf2;--muted:#8d98a5;--line:#252c35;--green:#35d07f;--red:#ff5d6c;--yellow:#f3c969;--blue:#66a7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:10px}.wrap{max-width:980px;margin:auto}.top{position:sticky;top:0;z-index:5;background:rgba(7,9,12,.96);padding-bottom:8px}.title{font-size:19px;font-weight:800;margin:4px 0}.sub{color:var(--muted);font-size:11px;margin-bottom:8px}.bar,.modes,.stats{display:flex;gap:6px;flex-wrap:wrap}.btn,.mode{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:9px 11px;font-weight:700}.btn:active,.mode.active{border-color:var(--blue);background:#17243a}.btn.stop{border-color:#5d2c33}.btn.clear{border-color:#51482d}.status{margin-top:7px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted)}.stats{margin-top:7px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:82px}.stat b{display:block;font-size:16px}.stat span{color:var(--muted);font-size:10px}.diag{margin-top:7px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);line-height:1.45}.cards{display:grid;gap:8px;margin-top:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}.card.long{border-left:4px solid var(--green)}.card.short{border-left:4px solid var(--red)}.head{display:flex;justify-content:space-between;gap:8px}.sym{font-size:16px;font-weight:900}.badge{font-weight:900;padding:4px 7px;border-radius:6px}.badge.long{color:var(--green);background:rgba(53,208,127,.1)}.badge.short{color:var(--red);background:rgba(255,93,108,.1)}.stage{color:var(--yellow);font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}.cell{background:var(--panel2);border-radius:7px;padding:7px}.cell span{display:block;color:var(--muted);font-size:10px}.cell b{font-size:12px}.meter{height:5px;background:#242a32;border-radius:9px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--blue)}.empty{margin-top:10px;padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}.small{font-size:10px;color:var(--muted);margin-top:7px}.good{color:var(--green)}.bad{color:var(--red)}@media(min-width:700px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body><div class="wrap">
<div class="top">
  <div class="title">Bybit HTF OrderFlow Scanner</div>
  <div class="sub">4H → 1H → 15M → стакан → агрессивный поток → поглощение → реакция</div>
  <div class="bar"><button class="btn" id="startBtn">▶ Старт</button><button class="btn stop" id="stopBtn">■ Стоп</button><button class="btn clear" id="clearBtn">✕ Очистить</button></div>
  <div class="modes" style="margin-top:6px"><button class="mode active" id="watchBtn">👁 Наблюдение</button><button class="mode" id="entryBtn">🎯 Вход</button></div>
  <div class="status" id="status">Остановлен</div>
  <div class="stats">
    <div class="stat"><b id="coins">0</b><span>Монеты</span></div><div class="stat"><b id="zones">0</b><span>Зоны</span></div><div class="stat"><b id="approach">0</b><span>У зоны</span></div><div class="stat"><b id="candidates">0</b><span>Кандидаты</span></div><div class="stat"><b id="signals">0</b><span>Сигналы</span></div><div class="stat"><b id="quality">0%</b><span>Данные</span></div>
  </div>
  <div class="diag" id="diag">Диагностика: ожидание запуска</div>
</div>
<div id="cards" class="cards"></div>
<div id="empty" class="empty">Нажми «Старт». Сканер ищет только сценарии вокруг зон 4H / 1H / 15M.</div>
</div>
<script>
'use strict';
const CFG={
  TOP:100, DEPTH:50, KLINES:120, ZONE_ATR:0.42, NEAR_ATR:0.85, FLOW_MS:20000,
  WALL_AGE_MS:3500, SIGNAL_COOLDOWN:90000, BOOK_STALE_MS:7000, PRICE_STALE_MS:5000,
  MAX_CARDS:30, SCAN_MS:500, RENDER_MS:1000, REST_BATCH:8
};
let running=false, mode='watch', sockets=[], pingTimer=null, scanTimer=null, renderTimer=null;
const books=new Map(), trades=new Map(), htf=new Map(), states=new Map(), signals=new Map(), metrics=new Map();
let symbols=[]; let lastRender=0;
const $=id=>document.getElementById(id); const now=()=>Date.now();
const fmt=n=>{n=Number(n)||0; if(Math.abs(n)>=1e6)return '$'+(n/1e6).toFixed(2)+'M'; if(Math.abs(n)>=1e3)return '$'+(n/1e3).toFixed(1)+'K'; return '$'+n.toFixed(2)};
const pct=n=>(Number(n)||0).toFixed(2)+'%';
function setStatus(t){$('status').textContent=t}
function setStats(){
  $('coins').textContent=symbols.length;
  $('zones').textContent=[...htf.values()].reduce((a,x)=>a+x.zones.length,0);
  $('approach').textContent=[...states.values()].filter(x=>x.stage==='ПОДХОД' || x.stage==='ТЕСТ').length;
  $('candidates').textContent=[...states.values()].filter(x=>x.candidate).length;
  $('signals').textContent=[...signals.values()].filter(x=>x.expires>now()).length;
  const arr=[...books.values()].filter(x=>x.ts&&now()-x.ts<CFG.BOOK_STALE_MS); $('quality').textContent=symbols.length?Math.round(arr.length/symbols.length*100)+'%':'0%';
  $('diag').innerHTML=`WebSocket: <b>${sockets.filter(x=>x.readyState===1).length}/${sockets.length}</b> · свежий стакан: <b>${arr.length}/${symbols.length}</b> · режим: <b>${mode==='watch'?'НАБЛЮДЕНИЕ':'ВХОД'}</b>`;
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function api(url){const t=performance.now(); const r=await fetch(url,{cache:'no-store'}); if(!r.ok)throw Error('HTTP '+r.status); const j=await r.json(); metrics.set('rest',Math.round(performance.now()-t)); if(j.retCode!==0)throw Error(j.retMsg||'Bybit error'); return j.result}
function candles(raw){return (raw||[]).map(x=>({t:+x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+x[5]})).sort((a,b)=>a.t-b.t).slice(0,-1)}
function atr(a,n=14){if(!a||a.length<n+1)return 0; let s=0; for(let i=a.length-n;i<a.length;i++)s+=Math.max(a[i].h-a[i].l,Math.abs(a[i].h-a[i-1].c),Math.abs(a[i].l-a[i-1].c));return s/n}
function swings(a){const out=[]; for(let i=2;i<a.length-2;i++){if(a[i].h>a[i-1].h&&a[i].h>a[i-2].h&&a[i].h>a[i+1].h&&a[i].h>a[i+2].h)out.push({p:a[i].h,type:'R',t:a[i].t}); if(a[i].l<a[i-1].l&&a[i].l<a[i-2].l&&a[i].l<a[i+1].l&&a[i].l<a[i+2].l)out.push({p:a[i].l,type:'S',t:a[i].t})} return out}
function buildZones(c4,c1,c15){const a4=atr(c4), a1=atr(c1), a15=atr(c15); const base=Math.max(a4*.18,a1*.28,a15*.45); const raw=[]; for(const x of swings(c4))raw.push({...x,tf:4,w:3}); for(const x of swings(c1))raw.push({...x,tf:1,w:2}); for(const x of swings(c15))raw.push({...x,tf:.25,w:1}); raw.sort((a,b)=>a.p-b.p); const z=[]; for(const x of raw){let q=z.find(v=>Math.abs(v.mid-x.p)<=base); if(!q){q={mid:x.p,lo:x.p,hi:x.p,score:0,tfs:new Set(),types:new Set(),latest:x.t};z.push(q)} q.lo=Math.min(q.lo,x.p);q.hi=Math.max(q.hi,x.p);q.score+=x.w;q.tfs.add(x.tf);q.types.add(x.type);q.latest=Math.max(q.latest,x.t)} return z.filter(x=>x.score>=3).sort((a,b)=>b.score-a.score).slice(0,30)}
async function loadSymbol(sym){const [a4,a1,a15]=await Promise.all([api(`https://api.bybit.com/v5/market/kline?category=linear&symbol=${sym}&interval=240&limit=${CFG.KLINES}`),api(`https://api.bybit.com/v5/market/kline?category=linear&symbol=${sym}&interval=60&limit=${CFG.KLINES}`),api(`https://api.bybit.com/v5/market/kline?category=linear&symbol=${sym}&interval=15&limit=${CFG.KLINES}`)]); const c4=candles(a4.list),c1=candles(a1.list),c15=candles(a15.list); htf.set(sym,{c4,c1,c15,atr4:atr(c4),atr1:atr(c1),atr15:atr(c15),zones:buildZones(c4,c1,c15)});}
function ensureBook(sym){if(!books.has(sym))books.set(sym,{bids:new Map(),asks:new Map(),price:0,ts:0,seq:0,wall:new Map()})}
function applyBook(sym,m){ensureBook(sym); const b=books.get(sym); if(m.type==='snapshot'){b.bids=new Map();b.asks=new Map()} const put=(arr,map)=>{for(const x of arr||[]){const p=+x[0],q=+x[1];if(!p)continue;if(q===0)map.delete(p);else map.set(p,q)}}; put(m.data?.b,b.bids);put(m.data?.a,b.asks); b.seq=m.data?.u||b.seq;b.ts=now(); if(m.data?.b?.length||m.data?.a?.length) updateWalls(sym)}
function updateWalls(sym){const b=books.get(sym), h=htf.get(sym); if(!b||!h||!b.price)return; const all=[...b.bids.entries()].map(([p,q])=>({p,q,side:'bid'})).concat([...b.asks.entries()].map(([p,q])=>({p,q,side:'ask'}))); const local=all.filter(x=>Math.abs(x.p-b.price)/b.price<.012); const vals=local.map(x=>x.p*x.q).sort((a,c)=>a-c); const med=vals.length?vals[Math.floor(vals.length/2)]:0; const turnover=metrics.get(sym)?.turn||1e6; const adaptive=Math.max(2500,turnover*0.0000015,med*3); const next=new Map(); for(const x of local){const usd=x.p*x.q;if(usd>=adaptive)next.set(x.side+':'+x.p,{...x,usd,seen:now(),age:(b.wall.get(x.side+':'+x.p)?.age||0)+1})} b.wall=next}
function addTrade(sym,t){if(!trades.has(sym))trades.set(sym,[]); const a=trades.get(sym); a.push(t); const cut=now()-CFG.FLOW_MS*2; while(a.length&&a[0].ts<cut)a.shift(); const b=books.get(sym); if(b){b.price=t.p;b.ts=now()}}
function flow(sym){const a=(trades.get(sym)||[]).filter(x=>x.ts>=now()-CFG.FLOW_MS);let buy=0,sell=0;for(const x of a){const usd=x.p*x.q;if(x.side==='Buy')buy+=usd;else sell+=usd}return {buy,sell,delta:buy-sell,total:buy+sell}}
function nearestZone(sym){const h=htf.get(sym),b=books.get(sym);if(!h||!b||!b.price)return null;let best=null;for(const z of h.zones){const atr4=h.atr4||b.price*.01;const d=Math.abs(b.price-z.mid);const limit=Math.max(atr4*CFG.NEAR_ATR,b.price*.004);if(d<=limit&&(!best||d<best.d))best={...z,d,dist:d/b.price}}return best}
function zoneWall(sym,z,side){const b=books.get(sym);if(!b||!z)return null;const h=htf.get(sym);const radius=Math.max((h?.atr15||b.price*.002)*1.2,b.price*.0015);let best=null;const map=side==='LONG'?b.bids:b.asks;for(const [p,q] of map){if(Math.abs(p-z.mid)>radius)continue;const usd=p*q;const key=(side==='LONG'?'bid':'ask')+':'+p;const w=b.wall.get(key);if(!w)continue;if(!best||usd>best.usd)best={p,q,usd,ageMs:Math.min(CFG.WALL_AGE_MS,w.age*80),ratio:1};}return best}
function evaluate(sym){const h=htf.get(sym),b=books.get(sym);if(!h||!b||!b.price||now()-b.ts>CFG.BOOK_STALE_MS)return; const z=nearestZone(sym); const st=states.get(sym)||{stage:'ОЖИДАНИЕ',candidate:false}; if(!z){st.stage='ОЖИДАНИЕ';st.candidate=false;states.set(sym,st);return} st.zone=z; st.stage='ПОДХОД'; const side=z.types.has('S')?'LONG':z.types.has('R')?'SHORT':null; if(!side){st.candidate=false;states.set(sym,st);return} const w=zoneWall(sym,z,side), f=flow(sym); st.side=side;st.wall=w;st.flow=f; const wallOk=!!w&&w.ageMs>=CFG.WALL_AGE_MS; const flowUsd=side==='LONG'?f.sell:f.buy; const opposite=side==='LONG'?f.buy:f.sell; const flowOk=flowUsd>=Math.max(1500,(w?.usd||0)*.12); const priceMove=(b.price-z.mid)/z.mid*100; const reaction=side==='LONG'?priceMove>-0.12:priceMove<0.12; st.stage=wallOk&&flowOk?'ТЕСТ':'ПОДХОД'; st.candidate=wallOk&&flowOk&&reaction; if(st.candidate&&mode==='entry'){const key=sym+side;const old=signals.get(key);if(!old||old.expires<now()){signals.set(key,{sym,side,z,w,f,reaction,created:now(),expires:now()+CFG.SIGNAL_COOLDOWN})}} states.set(sym,st)}
function card(x){const side=x.side, f=x.flow||x.f||{buy:0,sell:0,delta:0,total:0}, w=x.wall||x.w||null,z=x.zone||x.z;const age=w?Math.round(w.ageMs/1000):0;const flowUsd=side==='LONG'?f.sell:f.buy;const absorb=w?Math.min(100,flowUsd/w.usd*100):0;return `<div class="card ${side.toLowerCase()}"><div class="head"><div><div class="sym">${x.sym}</div><div class="stage">${x.stage||'🎯 ПОДТВЕРЖДЕНО'}</div></div><div class="badge ${side.toLowerCase()}">${side==='LONG'?'🟢 LONG':'🔴 SHORT'}</div></div><div class="grid"><div class="cell"><span>HTF-зона</span><b>${z?('$'+z.lo.toFixed(4)+' — $'+z.hi.toFixed(4)):'—'}</b></div><div class="cell"><span>Таймфреймы</span><b>${z?[...z.tfs].map(t=>t===4?'4H':t===1?'1H':'15M').join(' + '):'—'}</b></div><div class="cell"><span>Лимитная стена</span><b>${w?fmt(w.usd):'не найдена'}</b></div><div class="cell"><span>Возраст стены</span><b>${age?age+' сек':'—'}</b></div><div class="cell"><span>Агрессивный поток</span><b>${fmt(flowUsd)}</b></div><div class="cell"><span>Поглощение</span><b>${absorb.toFixed(0)}%</b><div class="meter"><i style="width:${Math.min(100,absorb)}%"></i></div></div><div class="cell"><span>Покупки</span><b>${fmt(f.buy)}</b></div><div class="cell"><span>Продажи</span><b>${fmt(f.sell)}</b></div></div><div class="small">Режим: ${mode==='watch'?'НАБЛЮДЕНИЕ — вход не выдаётся':'ВХОД — показан только подтверждённый сценарий'}</div></div>`}
function render(){const out=[]; if(mode==='entry'){for(const s of signals.values())if(s.expires>now())out.push(card({sym:s.sym,side:s.side,z:s.z,w:s.w,f:s.f,stage:'🟢 ПОДТВЕРЖДЁННЫЙ ВХОД'}))}else{for(const [sym,st] of states){if(st.candidate)out.push(card({...st,sym}))}} $('cards').innerHTML=out.slice(0,CFG.MAX_CARDS).join('');$('empty').style.display=out.length?'none':'block';setStats()}
function onMsg(e){try{const m=JSON.parse(e.data);if(m.op==='pong'||!m.topic)return; if(m.topic.startsWith('orderbook.50.'))applyBook(m);else if(m.topic.startsWith('publicTrade.')){for(const t of m.data||[])addTrade(t.s,{p:+t.p,q:+t.v,side:t.S,ts:+t.T||now()})}}catch(_){}}
function connect(){sockets.forEach(s=>{try{s.close()}catch(_){}});sockets=[];for(let i=0;i<symbols.length;i+=10){const list=symbols.slice(i,i+10);const ws=new WebSocket('wss://stream.bybit.com/v5/public/linear');ws.onopen=()=>{ws.send(JSON.stringify({op:'subscribe',args:list.flatMap(s=>['orderbook.50.'+s,'publicTrade.'+s])}))};ws.onmessage=onMsg;ws.onclose=()=>{};ws.onerror=()=>{};sockets.push(ws)}clearInterval(pingTimer);pingTimer=setInterval(()=>sockets.forEach(s=>{if(s.readyState===1)s.send(JSON.stringify({op:'ping'}))}),20000)}
async function start(){if(running)return;running=true;setStatus('Загрузка TOP-100…');try{const r=await api('https://api.bybit.com/v5/market/tickers?category=linear');symbols=r.list.filter(x=>x.symbol.endsWith('USDT')&&x.status==='Trading').sort((a,b)=>(+b.turnover24h)-(+a.turnover24h)).slice(0,CFG.TOP).map(x=>x.symbol);for(const x of r.list)if(symbols.includes(x.symbol))metrics.set(x.symbol,{turn:+x.turnover24h||0});for(let i=0;i<symbols.length;i+=CFG.REST_BATCH){await Promise.all(symbols.slice(i,i+CFG.REST_BATCH).map(s=>loadSymbol(s).catch(()=>{})));setStatus(`Загрузка зон: ${Math.min(i+CFG.REST_BATCH,symbols.length)}/${symbols.length}`)}symbols.forEach(ensureBook);connect();clearInterval(scanTimer);clearInterval(renderTimer);scanTimer=setInterval(()=>symbols.forEach(evaluate),CFG.SCAN_MS);renderTimer=setInterval(render,CFG.RENDER_MS);setStatus('Работаю — ищу зоны 4H/1H/15M и подтверждение Order Flow');render()}catch(e){running=false;setStatus('Ошибка запуска: '+e.message)}}
function stop(){running=false;clearInterval(scanTimer);clearInterval(renderTimer);clearInterval(pingTimer);sockets.forEach(s=>{try{s.close()}catch(_){}});sockets=[];setStatus('Остановлен');setStats()}
function clearAll(){signals.clear();states.clear();$('cards').innerHTML='';$('empty').style.display='block';setStats()}
function setMode(m){mode=m;$('watchBtn').classList.toggle('active',m==='watch');$('entryBtn').classList.toggle('active',m==='entry');render()}
$('startBtn').onclick=start;$('stopBtn').onclick=stop;$('clearBtn').onclick=clearAll;$('watchBtn').onclick=()=>setMode('watch');$('entryBtn').onclick=()=>setMode('entry');
setStats();
</script></body></html>
