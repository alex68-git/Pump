<style>
*{box-sizing:border-box}body{margin:0;background:#07090d;color:#eef2f7;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}button,select{font:inherit}header{position:sticky;top:0;z-index:5;background:#0c1016;border-bottom:1px solid #202733;padding:10px}.title{font-weight:800;font-size:16px}.sub{color:#8994a3;font-size:11px;margin-top:3px}.bar{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.btn{border:1px solid #2b3544;background:#121822;color:#e9edf3;border-radius:8px;padding:8px 11px}.btn.on{background:#173c29;border-color:#2c8a55}.btn.stop{background:#32191c}.mode{display:flex;gap:5px;margin-top:8px}.mode .btn.active{background:#283a55;border-color:#4f82c5}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:9px 0}.stat{background:#0e131b;border:1px solid #202733;border-radius:8px;padding:7px;text-align:center}.stat b{display:block;font-size:15px}.stat span{color:#7f8998;font-size:10px}.status{padding:7px 9px;background:#0d1219;border:1px solid #202733;border-radius:8px;color:#9aa5b4;margin-bottom:8px}.status.good{border-color:#285b3d;color:#9ee0b6}.status.bad{border-color:#68333a;color:#ffadb5}.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}.filters label{background:#0e131b;border:1px solid #202733;border-radius:8px;padding:6px;color:#8f99a8}.filters select{display:block;width:100%;margin-top:4px;background:#121822;color:#fff;border:1px solid #293341;border-radius:6px;padding:6px}.section{padding:8px 0;color:#7f8998;font-weight:700}.card{background:#0d131b;border:1px solid #27303d;border-radius:10px;margin:7px 0;padding:10px}.card.long{border-left:4px solid #35c477}.card.short{border-left:4px solid #ef6672}.head{display:flex;justify-content:space-between;align-items:center}.sym{font-size:16px;font-weight:800}.side{font-weight:900}.side.long{color:#4fe08d}.side.short{color:#ff737e}.badge{padding:4px 7px;border-radius:6px;background:#171e28;color:#b7c0cc;font-size:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}.kv{background:#111821;border-radius:6px;padding:6px}.kv small{display:block;color:#778293;font-size:10px}.kv b{font-size:12px}.flow{margin-top:8px;padding:7px;background:#111821;border-radius:7px}.barflow{height:6px;background:#252d38;border-radius:4px;overflow:hidden;margin-top:5px}.barflow i{display:block;height:100%;background:#e06a75}.barflow.buy i{background:#49ca82}.stages{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px}.stage{padding:4px 6px;background:#151c25;border-radius:5px;color:#778293;font-size:10px}.stage.ok{color:#9ee0b6;background:#143020}.stage.warn{color:#f2cf82;background:#302812}.foot{margin-top:8px;color:#7d8795;font-size:10px}.empty{padding:25px;text-align:center;color:#687384}.diag{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;line-height:1.5;white-space:pre-wrap;background:#080b10;border:1px solid #1c232d;border-radius:8px;padding:8px;color:#8995a5}.danger{color:#ff8e99}.oktxt{color:#8ce0ad}@media(min-width:800px){main{max-width:1100px;margin:auto}.grid{grid-template-columns:repeat(4,1fr)}}

<body>
<header>
<div class="title">Bybit HTF OrderFlow PRO</div>
<div class="sub">4H → 1H → 15M → стакан → поток → поглощение → реакция</div>
<div class="bar">
<button id="startBtn" class="btn on">▶ Старт</button><button id="stopBtn" class="btn stop">■ Стоп</button><button id="clearBtn" class="btn">Очистить</button>
</div>
<div class="mode"><button id="watchBtn" class="btn active">👁 Наблюдение</button><button id="entryBtn" class="btn">🎯 Вход</button></div>
<div class="filters">
<label>Минимум качества<select id="quality"><option value="78">78 — строго</option><option value="84" selected>84 — очень строго</option><option value="90">90 — только лучшие</option></select></label>
<label>Окно потока<select id="flowWindow"><option value="10000">10 сек</option><option value="20000" selected>20 сек</option><option value="30000">30 сек</option></select></label>
</div>
<div id="stats" class="stats"></div><div id="status" class="status">Остановлен</div>
</header>
<main>
<div class="section">Сигналы и наблюдение</div><div id="cards"><div class="empty">Нажми «Старт»</div></div>
<div class="section">Диагностика</div><div id="diag" class="diag">Нет данных</div>
</main>
<script>
'use strict';
const API='https://api.bybit.com';
const WS_URL='wss://stream.bybit.com/v5/public/linear';
const CFG={TOP:100,DEPTH:50,ZONE_LOOKBACK:120,SWING:3,MAX_WALL_DIST:0.004,ZONE_PAD:0.0018,MIN_ZONE_SCORE:58,MAX_CARDS:8,ENTRY_TTL:1800000,WATCH_TTL:300000,COOLDOWN:1200000,BOOK_STALE:4000,WALL_MIN_AGE:8000,REACTION_WINDOW:20000,PRICE_HISTORY:60000,MIN_TF_ALIGN:3,WALL_RATIO:3.0,ABSORB_RATIO:0.25,REACTION_ATR:0.18,MIN_RR:2.0};
let running=false,mode='watch',wsList=[],reconnectTimer=null,pingTimer=null,scanTimer=null,renderTimer=null;
const coins=new Map(),books=new Map(),trades=new Map(),zones=new Map(),states=new Map(),signals=new Map(),metrics=new Map();
const $=id=>document.getElementById(id), now=()=>Date.now(), num=x=>Number(x)||0, clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const fmt=n=>{n=num(n); if(!n)return '$0'; const a=Math.abs(n); if(a>=1e6)return '$'+(n/1e6).toFixed(2)+'M'; if(a>=1e3)return '$'+(n/1e3).toFixed(1)+'K'; if(a>=1)return '$'+n.toFixed(0); return '$'+n.toFixed(2)};
const pct=x=>(num(x)*100).toFixed(2)+'%';
function setStatus(t,good=true){$('status').textContent=t;$('status').className='status '+(good?'good':'bad')}
function stat(label,val){return '<div class="stat"><b>'+val+'</b><span>'+label+'</span></div>'}
function renderStats(){let ws=wsList.filter(x=>x.readyState===1).length, wall=0,cand=0,sig=0,good=0; for(const s of coins.keys()){const b=books.get(s);if(b?.valid)good++; if(states.get(s)?.wall)wall++; if(states.get(s)?.candidate)cand++} for(const x of signals.values())if(x.expires>now())sig++; $('stats').innerHTML=stat('МОНЕТЫ',coins.size)+stat('СТЕНЫ',wall)+stat('КАНДИДАТЫ',cand)+stat('СИГНАЛЫ',sig)+stat('WS',ws);}
function clean(arr,maxAge){const t=now()-maxAge; while(arr.length&&arr[0].ts<t)arr.shift()}
function median(a){if(!a.length)return 0; const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2}
async function getJSON(path,params){const u=new URL(API+path);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));const t=performance.now();const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(j.retCode!==0)throw Error(j.retMsg||'Bybit error');metrics.set('restLatency',Math.round(performance.now()-t));return j.result}
async function loadCoins(){const r=await getJSON('/v5/market/tickers',{category:'linear'});const a=(r.list||[]).filter(x=>x.symbol.endsWith('USDT')&&num(x.turnover24h)>0).sort((a,b)=>num(b.turnover24h)-num(a.turnover24h)).slice(0,CFG.TOP);coins.clear();for(let i=0;i<a.length;i++)coins.set(a[i].symbol,{rank:i+1,turn:num(a[i].turnover24h),price:num(a[i].lastPrice)});}
function candlesToObj(list){return [...list].reverse().map(x=>({ts:num(x[0]),o:num(x[1]),h:num(x[2]),l:num(x[3]),c:num(x[4]),v:num(x[5]),q:num(x[6])})).filter(x=>x.o&&x.h&&x.l&&x.c)}
async function loadTF(sym,interval){const r=await getJSON('/v5/market/kline',{category:'linear',symbol:sym,interval,limit:CFG.ZONE_LOOKBACK});return candlesToObj(r.list||[]).filter(x=>x.ts<now()-60000)}
function swings(c){const out=[];for(let i=CFG.SWING;i<c.length-CFG.SWING;i++){let hi=true,lo=true;for(let j=1;j<=CFG.SWING;j++){if(c[i].h<=c[i-j].h||c[i].h<c[i+j].h)hi=false;if(c[i].l>=c[i-j].l||c[i].l>c[i+j].l)lo=false}if(hi)out.push({p:c[i].h,kind:'SHORT',ts:c[i].ts});if(lo)out.push({p:c[i].l,kind:'LONG',ts:c[i].ts})}return out}
function atr(c){if(c.length<15)return 0;let a=[];for(let i=1;i<c.length;i++)a.push(Math.max(c[i].h-c[i].l,Math.abs(c[i].h-c[i-1].c),Math.abs(c[i].l-c[i-1].c)));return median(a.slice(-40))}
function buildZones(sym,tf4,tf1,tf15){const all=[];for(const z of swings(tf4))all.push({...z,tf:'4H',w:5});for(const z of swings(tf1))all.push({...z,tf:'1H',w:3});for(const z of swings(tf15))all.push({...z,tf:'15M',w:1.5});all.sort((a,b)=>a.p-b.p);const ar=atr(tf1)||tf1.at(-1).c*.003;const tol=Math.max(ar*.75,tf1.at(-1).c*CFG.ZONE_PAD);const zs=[];for(const z of all){let g=zs.find(x=>Math.abs(x.p-z.p)<=tol);if(!g){g={p:z.p,lo:z.p,hi:z.p,score:0,tfs:new Set(),long:0,short:0,last:z.ts,count:0};zs.push(g)}g.p=(g.p*g.count+z.p)/(g.count+1);g.lo=Math.min(g.lo,z.p);g.hi=Math.max(g.hi,z.p);g.score+=z.w;g.tfs.add(z.tf);g[z.kind==='LONG'?'long':'short']+=z.w;g.last=Math.max(g.last,z.ts);g.count++}for(const g of zs){const ageH=(now()-g.last)/3600000;g.score+=Math.max(0,8-ageH*.5);g.tfsScore=g.tfs.has('4H')?30:0;if(g.tfs.has('1H'))g.tfsScore+=18;if(g.tfs.has('15M'))g.tfsScore+=8;g.score+=g.tfsScore}return zs.filter(z=>z.score>=CFG.MIN_ZONE_SCORE/2).sort((a,b)=>b.score-a.score).slice(0,18)}
async function loadAllHTF(){let i=0;for(const s of coins.keys()){try{const [h4,h1,m15]=await Promise.all([loadTF(s,'240'),loadTF(s,'60'),loadTF(s,'15')]);zones.set(s,buildZones(s,h4,h1,m15));metrics.set(s,{atr1:atr(h1),atr15:atr(m15)})}catch(e){metrics.set(s,{error:e.message})}i++;$('diag').textContent='Загрузка HTF: '+i+'/'+coins.size+'\nREST: '+(metrics.get('restLatency')||'?')+' ms'}}
function ensureBook(s){if(!books.has(s))books.set(s,{bids:new Map(),asks:new Map(),valid:false,last:0,u:0,seq:0,wallHist:new Map()});return books.get(s)}
function applyBook(d){const s=d.s,b=ensureBook(s),type=d.type;if(type==='snapshot'){b.bids.clear();b.asks.clear();for(const [p,q] of d.b||[])b.bids.set(num(p),num(q));for(const [p,q] of d.a||[])b.asks.set(num(p),num(q));b.valid=true}else if(type==='delta'&&b.valid){for(const [p,q] of d.b||[]){q=num(q);q?b.bids.set(num(p),q):b.bids.delete(num(p))}for(const [p,q] of d.a||[]){q=num(q);q?b.asks.set(num(p),q):b.asks.delete(num(p))}}b.last=now();b.u=num(d.u);b.seq=num(d.seq);}
function addTrade(d){const s=d.s;if(!coins.has(s))return;let a=trades.get(s);if(!a)trades.set(s,a=[]);const p=num(d.p),q=num(d.v),side=d.S==='Buy'?'BUY':'SELL';a.push({ts:num(d.T)||now(),p,q,side,usd:p*q});clean(a,CFG.PRICE_HISTORY);const c=coins.get(s);if(c)c.price=p}
function subscribe(ws,symbols){const args=[];for(const s of symbols){args.push('orderbook.50.'+s,'publicTrade.'+s)}ws.send(JSON.stringify({op:'subscribe',args}));}
function connect(){for(const w of wsList)try{w.close()}catch{}wsList=[];clearTimeout(reconnectTimer);const arr=[...coins.keys()];for(let i=0;i<arr.length;i+=20){const chunk=arr.slice(i,i+20);const w=new WebSocket(WS_URL);wsList.push(w);w.onopen=()=>{subscribe(w,chunk);setStatus('WebSocket подключён: '+wsList.filter(x=>x.readyState===1).length+'/'+Math.ceil(arr.length/20));};w.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.topic?.startsWith('orderbook.50.'))applyBook(m.data);else if(m.topic?.startsWith('publicTrade.'))for(const t of m.data||[])addTrade(t)}catch(err){}};w.onclose=()=>{if(running){setStatus('WebSocket переподключается…',false);clearTimeout(reconnectTimer);reconnectTimer=setTimeout(connect,1500)}};w.onerror=()=>{try{w.close()}catch{}}}pingTimer=setInterval(()=>wsList.forEach(w=>{if(w.readyState===1)w.send(JSON.stringify({op:'ping'}))}),20000)}
function localLiquidity(book,price){const vals=[];for(const [p,q] of book.bids){if(Math.abs(p-price)/price<.003)vals.push(p*q)}for(const [p,q] of book.asks){if(Math.abs(p-price)/price<.003)vals.push(p*q)}return median(vals)}
function adaptiveWallMin(s,liq){const turn=coins.get(s)?.turn||0;return Math.max(1200,liq*1.8,(turn/86400)*8)}
function bestWall(s,zone,side,price){const b=books.get(s);if(!b?.valid||now()-b.last>CFG.BOOK_STALE)return null;const map=side==='LONG'?b.bids:b.asks;const candidates=[];for(const [p,q] of map){if(Math.abs(p-zone.p)/zone.p>CFG.MAX_WALL_DIST)continue;if(side==='LONG'&&p>price*1.001)return null;const usd=p*q;if(usd<=0)continue;candidates.push({p,q,usd})}if(!candidates.length)return null;candidates.sort((a,b)=>b.usd-a.usd);const liq=localLiquidity(b,price);const min=adaptiveWallMin(s,liq);const w=candidates[0];if(w.usd<min)return null;const key=side+'@'+w.p.toFixed(8),h=b.wallHist.get(key)||{first:now(),last:now(),max:0};h.last=now();h.max=Math.max(h.max,w.usd);b.wallHist.set(key,h);return {...w,age:now()-h.first,liq,min,ratio:liq?w.usd/liq:0}}
function flowStats(s,price,window){const a=trades.get(s)||[],t=now()-window;let buy=0,sell=0,near=0;for(const x of a){if(x.ts<t)continue;const nearPrice=Math.abs(x.p-price)/price<.002;if(nearPrice){near++;if(x.side==='BUY')buy+=x.usd;else sell+=x.usd}}return{buy,sell,delta:buy-sell,total:buy+sell,near}}
function reaction(s,side,zone){const a=trades.get(s)||[];if(a.length<2)return{score:0,move:0};const t=now()-CFG.REACTION_WINDOW,arr=a.filter(x=>x.ts>=t);if(arr.length<3)return{score:0,move:0};const first=arr[0].p,last=arr.at(-1).p,move=(last-first)/first;const dir=side==='LONG'?move:-move;const score=clamp(dir/.0015*35,0,35);return{score,move}}
function stateFor(s){if(!states.has(s))states.set(s,{stage:'ОЖИДАНИЕ',side:null,zone:null,wall:null,candidate:false,quality:0,updated:0});return states.get(s)}
function evaluate(s){
 const st=stateFor(s),c=coins.get(s),zs=zones.get(s)||[],b=books.get(s);
 st.candidate=false; st.wall=null; st.quality=0;
 if(!c||!b?.valid||now()-b.last>CFG.BOOK_STALE){st.stage='НЕТ ДАННЫХ';return}
 const price=c.price; let best=null;
 for(const z of zs){
   const dist=Math.abs(price-z.p)/price; if(dist>CFG.MAX_WALL_DIST)continue;
   // Для ВХОДА обязательна полная HTF-согласованность: 4H + 1H + 15M.
   if(!z.tfs.has('4H')||!z.tfs.has('1H')||!z.tfs.has('15M'))continue;
   const atr1=metrics.get(s)?.atr1||price*.002;
   for(const side of ['LONG','SHORT']){
     const directional=side==='LONG'?z.long>=z.short*1.5:z.short>=z.long*1.5;
     if(!directional)continue;
     const wall=bestWall(s,z,side,price);
     if(!wall||wall.age<CFG.WALL_MIN_AGE||wall.ratio<CFG.WALL_RATIO)continue;
     const f=flowStats(s,price,Number($('flowWindow').value));
     const opp=side==='LONG'?f.sell:f.buy;
     const flowRatio=wall.usd?opp/wall.usd:0;
     if(flowRatio<CFG.ABSORB_RATIO)continue;
     // Реальное поглощение: встречный агрессивный поток есть, но цена не продолжает движение против идеи.
     const react=reaction(s,side,z);
     if(react.score<18)continue;
     if(side==='LONG' && price<z.lo)continue;
     if(side==='SHORT' && price>z.hi)continue;
     const zoneWidth=Math.max(z.hi-z.lo,atr1*.35);
     const stop=side==='LONG'?z.lo-atr1*.12:z.hi+atr1*.12;
     const risk=Math.abs(price-stop);
     const target=side==='LONG'?price+Math.max(risk*2.2,atr1*.8):price-Math.max(risk*2.2,atr1*.8);
     const rr=Math.abs(target-price)/Math.max(risk,1e-12);
     if(rr<CFG.MIN_RR)continue;
     // Не брать сигнал, если цена уже убежала далеко от зоны.
     const maxChase=atr1*.55;
     if(side==='LONG'&&price>z.hi+maxChase)continue;
     if(side==='SHORT'&&price<z.lo-maxChase)continue;
     const x={side,zone:z,wall,flow:f,opp,react,price,entry:price,stop,target,rr,flowRatio};
     if(!best||x.react.score>best.react.score)best=x;
   }
 }
 if(!best){st.stage='ОЖИДАНИЕ';return}
 st.side=best.side;st.zone=best.zone;st.wall=best.wall;st.quality=100;st.candidate=true;st.updated=now();st.stage='ПОДТВЕРЖДЁН';
 createSignal(s,best);
}
function createSignal(s,x){
 const old=signals.get(s);
 if(old&&old.expires>now())return;
 if(old&&now()-old.ts<CFG.COOLDOWN)return;
 signals.set(s,{symbol:s,side:x.side,price:x.price,entry:x.entry,stop:x.stop,target:x.target,rr:x.rr,ts:now(),expires:now()+CFG.ENTRY_TTL});
}
function render(){
 const list=[...signals.values()].filter(x=>x.expires>now()).sort((a,b)=>b.ts-a.ts);
 $('cards').innerHTML=list.length?list.slice(0,CFG.MAX_CARDS).map(cardSignal).join(''):'<div class="empty">Нет подтверждённых входов. Это нормально: качество важнее количества.</div>';
 renderStats();renderDiag();
}
function stages(side,x){const flowOpp=side==='LONG'?x.flow.sell:x.flow.buy;return '<div class="stages"><span class="stage ok">4H ✓</span><span class="stage '+(x.zone.tfs.has('1H')?'ok':'warn')+'">1H '+(x.zone.tfs.has('1H')?'✓':'наблюдение')+'</span><span class="stage '+(x.zone.tfs.has('15M')?'ok':'warn')+'">15M '+(x.zone.tfs.has('15M')?'✓':'уточнение')+'</span><span class="stage ok">Стена ✓</span><span class="stage '+(flowOpp>0?'ok':'warn')+'">Поток '+fmt(flowOpp)+'</span><span class="stage '+(x.abs>=10?'ok':'warn')+'">Поглощение '+x.abs.toFixed(0)+'%</span><span class="stage '+((x.react?.score||0)>=10?'ok':'warn')+'">Реакция '+((x.react?.score||0).toFixed(0))+'</span></div>'}
function fmtPrice(v){if(!Number.isFinite(v))return '-'; if(v>=100)return v.toFixed(2); if(v>=1)return v.toFixed(4); if(v>=0.01)return v.toFixed(6); return v.toFixed(8)}
function cardSignal(x){
 const cls=x.side==='LONG'?'long':'short';
 return '<div class="card '+cls+'"><div class="head"><div><span class="sym">'+x.symbol+'</span> <span class="side '+cls+'">'+(x.side==='LONG'?'LONG':'SHORT')+'</span></div></div><div class="grid"><div class="kv"><small>ВХОД</small><b>'+fmtPrice(x.entry)+'</b></div><div class="kv"><small>СТОП</small><b>'+fmtPrice(x.stop)+'</b></div><div class="kv"><small>ТЕЙК</small><b>'+fmtPrice(x.target)+'</b></div><div class="kv"><small>RR</small><b>'+x.rr.toFixed(1)+'</b></div></div></div>';
}
function renderDiag(){let stale=0,valid=0;for(const b of books.values()){if(b.valid)valid++;if(now()-b.last>CFG.BOOK_STALE)stale++}let errors=[...metrics.values()].filter(x=>x.error).length;$('diag').textContent='Режим: '+(mode==='watch'?'НАБЛЮДЕНИЕ':'ВХОД')+'\nМонет: '+coins.size+' | Стаканов: '+valid+' | Устарели: '+stale+' | REST errors: '+errors+'\nREST latency: '+(metrics.get('restLatency')??'?')+' ms\nЛогика входа: все обязательные условия HTF + стена + поток + поглощение + реакция + RR + антиспам\nВажно: отсутствие сигнала означает, что фильтры не подтверждены.'}
function startLoops(){clearInterval(scanTimer);clearInterval(renderTimer);scanTimer=setInterval(()=>{if(!running)return;for(const s of coins.keys())evaluate(s)},250);renderTimer=setInterval(render,700)}
async function start(){if(running)return;running=true;$('startBtn').classList.add('on');setStatus('Загрузка TOP-100 и HTF-зон…');try{await loadCoins();await loadAllHTF();connect();startLoops();setStatus('Сканер запущен: строгая модель HTF + Order Flow');render()}catch(e){running=false;setStatus('Ошибка запуска: '+e.message,false);$('diag').textContent=e.stack||e.message}}
function stop(){running=false;clearInterval(scanTimer);clearInterval(renderTimer);clearInterval(pingTimer);for(const w of wsList)try{w.close()}catch{}wsList=[];setStatus('Остановлен',false);render()}
function clearCards(){signals.clear();for(const st of states.values())st.candidate=false;$('cards').innerHTML='<div class="empty">Карточки очищены</div>';renderStats()}
$('startBtn').onclick=start;$('stopBtn').onclick=stop;$('clearBtn').onclick=clearCards;$('watchBtn').onclick=()=>{mode='watch';$('watchBtn').classList.add('active');$('entryBtn').classList.remove('active');render()};$('entryBtn').onclick=()=>{mode='entry';$('entryBtn').classList.add('active');$('watchBtn').classList.remove('active');render()};
window.addEventListener('beforeunload',stop);renderStats();
</script>
</body>
</html>
