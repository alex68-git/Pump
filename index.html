<script>
'use strict';
const API='https://api.bybit.com';
const WS_URL='wss://stream.bybit.com/v5/public/linear';
const CFG={
 TOP:200,DEPTH:50,ZONE_LOOKBACK:120,SWING:3,MAX_WALL_DIST:.004,ZONE_PAD:.0018,MIN_ZONE_SCORE:58,
 MAX_CARDS:8,ENTRY_TTL:1800000,WATCH_TTL:300000,COOLDOWN:1200000,BOOK_STALE:5000,WALL_MIN_AGE:15000,
 WALL_RETENTION:.60,MAX_WALL_DRIFT:.0015,REACTION_WINDOW:20000,PRICE_HISTORY:60000,MIN_TF_ALIGN:3,WALL_RATIO:3,
 ABSORB_RATIO:.25,REACTION_ATR:.18,MIN_RR:2,RETEST_WINDOW:90000,BOUNCE_MIN_ATR:.10,RETEST_TOL_ATR:.16,
 SWEEP_LOOKBACK:90000,SWEEP_RECLAIM_MS:15000,VOL_SPIKE_MIN:1.5,VOL_LOOKBACK:20,ONE_MIN_CONFIRM:true,
 WS_SYMBOLS_PER_CONN:20,WS_MAX:10,HTF_BATCH:8,TOP_REFRESH:900000,ANALYSIS_BASE:350,ANALYSIS_MAX:1600,
 REST_MIN_GAP:80,REST_MAX_RETRIES:5,ICEBERG_MIN_RELOADS:2,ICEBERG_WINDOW:120000,ICEBERG_MIN_VOLUME:100000,
 STACK_LEVELS:3,STACK_DIST:.0005,STACK_MAX_DIST:.0018,STACK_MIN_USD:25000,
 // V5 — TTL для состояний FSM (ms)
 TTL:{
   HTF_OK:600000,
   LEVEL_TOUCHED:180000,
   SWEPT:25000,
   RECLAIMED:300000,
   RETEST_PENDING:90000,
   RETEST_HELD:60000,
   FLOW_OK:45000
 },
 // V5 — пороги переходов
 FLOW_DOM_MIN:5000,           // мин $ агрессивного потока в сторону
 FLOW_DOM_RATIO:1.3,          // доминанта над противоположным
 RVOL_MIN:1.5,                // RVOL при входе
 MAX_SETUPS_PER_SYMBOL:4,
 POSITION_TTL:4*3600000,      // макс. время слежения за исходом
 LOG_MAX:500
};
const NEWS_LOCK_MIN=12;
const NEWS_EVENTS=[];
// ---- V5 state machine ------------------------------------------------
const ST={IDLE:'IDLE',HTF_OK:'HTF_OK',LEVEL_TOUCHED:'LEVEL_TOUCHED',SWEPT:'SWEPT',RECLAIMED:'RECLAIMED',
  RETEST_PENDING:'RETEST_PENDING',RETEST_HELD:'RETEST_HELD',FLOW_OK:'FLOW_OK',
  FIRED:'FIRED',EXPIRED:'EXPIRED',INVALIDATED:'INVALIDATED'};
const STATE_RANK={IDLE:0,HTF_OK:1,LEVEL_TOUCHED:2,SWEPT:3,RECLAIMED:4,RETEST_PENDING:5,RETEST_HELD:6,FLOW_OK:7,FIRED:8,EXPIRED:9,INVALIDATED:9};
let ENGINE='V5';
let running=false,mode='watch',wsList=[],reconnectTimer=null,pingTimer=null,scanTimer=null,renderTimer=null,topRefreshTimer=null;
let restBusy=false,lastRestAt=0;
const coins=new Map(),books=new Map(),trades=new Map(),zones=new Map(),states=new Map(),signals=new Map(),metrics=new Map();
const setups=new Map();       // key -> setup
const openPositions=[];       // fired, tracked for outcome
const setupLog=[];            // closed setups
const funnel={created:0,htf_ok:0,level_touched:0,swept:0,reclaimed:0,retest_pending:0,retest_held:0,flow_ok:0,fired:0,expired:0,invalidated:0,veto:{wall:0,rvol:0,rr:0,news:0,break:0}};
const priority={high:new Set(),mid:new Set(),low:new Set()};
const $=id=>document.getElementById(id),now=()=>Date.now(),num=x=>Number(x)||0,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const fmt=n=>{n=num(n);if(!n)return '$0';const a=Math.abs(n);if(a>=1e6)return '$'+(n/1e6).toFixed(2)+'M';if(a>=1e3)return '$'+(n/1e3).toFixed(1)+'K';if(a>=1)return '$'+n.toFixed(0);return '$'+n.toFixed(2)};
function setStatus(t,good=true){$('status').textContent=t;$('status').className='status '+(good?'good':'bad')}
function stat(label,val){return '<div class="stat"><b>'+val+'</b><span>'+label+'</span></div>'}
function renderStats(){let ws=wsList.filter(x=>x?.readyState===1).length,wall=0,cand=0,sig=0;for(const s of coins.keys()){const b=books.get(s);if(states.get(s)?.wall)wall++;if(states.get(s)?.candidate)cand}for(const x of signals.values())if(x.expires>now())sig;$('stats').innerHTML=stat('МОНЕТЫ',coins.size)+stat('СТЕНЫ',wall)+stat('КАНДИДАТЫ',cand)+stat('СИГНАЛЫ',sig)+stat('WS',ws);}
function clean(arr,maxAge){const t=now()-maxAge;while(arr.length&&arr[0].ts<t)arr.shift()}
function median(a){if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2}
async function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function getJSON(path,params,attempt=0){const wait=Math.max(0,CFG.REST_MIN_GAP-(performance.now()-lastRestAt));if(wait)await sleep(wait);lastRestAt=performance.now();const u=new URL(API+path);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));try{const r=await fetch(u,{cache:'no-store'});if(r.status===429){if(attempt>=CFG.REST_MAX_RETRIES)throw Error('HTTP 429: лимит REST');await sleep(Math.min(8000,500*Math.pow(2,attempt)));return getJSON(path,params,attempt+1)}if(!r.ok){if(attempt<CFG.REST_MAX_RETRIES&&r.status>=500){await sleep(500*Math.pow(2,attempt));return getJSON(path,params,attempt+1)}throw Error('HTTP '+r.status)}const j=await r.json();if(j.retCode!==0){if(attempt<CFG.REST_MAX_RETRIES&&[10006,10016].includes(j.retCode)){await sleep(Math.min(8000,500*Math.pow(2,attempt)));return getJSON(path,params,attempt+1)}throw Error(j.retMsg||'Bybit error')}metrics.set('restLatency',Math.round(performance.now()-lastRestAt));return j.result}catch(e){if(attempt<CFG.REST_MAX_RETRIES&&/Failed to fetch|NetworkError|network/i.test(e.message)){await sleep(500*Math.pow(2,attempt));return getJSON(path,params,attempt+1)}throw e}}
async function loadCoins(){const r=await getJSON('/v5/market/tickers',{category:'linear'});const a=(r.list||[]).filter(x=>x.symbol.endsWith('USDT')&&num(x.turnover24h)>0).sort((a,b)=>num(b.turnover24h)-num(a.turnover24h)).slice(0,CFG.TOP);const old=new Set(coins.keys());coins.clear();for(let i=0;i<a.length;i++)coins.set(a[i].symbol,{rank:i+1,turn:num(a[i].turnover24h),price:num(a[i].lastPrice)});return{added:[...coins.keys()].filter(s=>!old.has(s)),removed:[...old].filter(s=>!coins.has(s))}}
function candlesToObj(list){return [...list].reverse().map(x=>({ts:num(x[0]),o:num(x[1]),h:num(x[2]),l:num(x[3]),c:num(x[4]),v:num(x[5]),q:num(x[6])})).filter(x=>x.o&&x.h&&x.l&&x.c)}
async function loadTF(sym,interval){const r=await getJSON('/v5/market/kline',{category:'linear',symbol:sym,interval,limit:CFG.ZONE_LOOKBACK});return candlesToObj(r.list||[]).filter(x=>x.ts<now()-60000)}
function swings(c){const out=[];for(let i=CFG.SWING;i<c.length-CFG.SWING;i++){let hi=true,lo=true;for(let j=1;j<=CFG.SWING;j++){if(c[i].h<=c[i-j].h||c[i].h<c[i+j].h)hi=false;if(c[i].l>=c[i-j].l||c[i].l>c[i+j].l)lo=false}if(hi)out.push({p:c[i].h,kind:'SHORT',ts:c[i].ts});if(lo)out.push({p:c[i].l,kind:'LONG',ts:c[i].ts})}return out}
function atr(c){if(c.length<15)return 0;const a=[];for(let i=1;i<c.length;i++)a.push(Math.max(c[i].h-c[i].l,Math.abs(c[i].h-c[i-1].c),Math.abs(c[i].l-c[i-1].c)));return median(a.slice(-40))}
function buildZones(sym,tf4,tf1,tf15){const all=[];for(const z of swings(tf4))all.push({...z,tf:'4H',w:5});for(const z of swings(tf1))all.push({...z,tf:'1H',w:3});for(const z of swings(tf15))all.push({...z,tf:'15M',w:1.5});all.sort((a,b)=>a.p-b.p);const lastPrice=tf1.at(-1)?.c||tf4.at(-1)?.c||0,ar=atr(tf1)||(lastPrice*.003),tol=Math.max(ar*.75,lastPrice*CFG.ZONE_PAD),zs=[];for(const z of all){let g=zs.find(x=>Math.abs(x.p-z.p)<=tol);if(!g){g={p:z.p,lo:z.p,hi:z.p,score:0,tfs:new Set(),long:0,short:0,last:z.ts,count:0};zs.push(g)}g.p=(g.p*g.count+z.p)/(g.count+1);g.lo=Math.min(g.lo,z.p);g.hi=Math.max(g.hi,z.p);g.score+=z.w;g.tfs.add(z.tf);g[z.kind==='LONG'?'long':'short']+=z.w;g.last=Math.max(g.last,z.ts);g.count++}for(const g of zs){const ageH=(now()-g.last)/3600000;g.score+=Math.max(0,8-ageH*.5);g.tfsScore=g.tfs.has('4H')?30:0;if(g.tfs.has('1H'))g.tfsScore+=18;if(g.tfs.has('15M'))g.tfsScore+=8;g.score+=g.tfsScore}return zs.filter(z=>z.score>=CFG.MIN_ZONE_SCORE/2).sort((a,b)=>b.score-a.score).slice(0,18)}
async function loadAllHTF(){const syms=[...coins.keys()];let done=0;for(let c=0;c<syms.length;c+=CFG.HTF_BATCH){if(!running)break;const chunk=syms.slice(c,c+CFG.HTF_BATCH);await Promise.all(chunk.map(async s=>{try{const [h4,h1,m15]=await Promise.all([loadTF(s,'240'),loadTF(s,'60'),loadTF(s,'15')]);zones.set(s,buildZones(s,h4,h1,m15));metrics.set(s,{...(metrics.get(s)||{}),atr1:atr(h1),atr15:atr(m15),htfAt:now()})}catch(e){metrics.set(s,{...(metrics.get(s)||{}),error:e.message})}done++}));$('diag').textContent='Загрузка HTF: '+done+'/'+syms.length+'\nBatch: '+CFG.HTF_BATCH+' | REST: '+(metrics.get('restLatency')?.toString()||'?')+' ms';await sleep(100)}}
function ensureBook(s){if(!books.has(s))books.set(s,{bids:new Map(),asks:new Map(),valid:false,last:0,u:0,seq:0,wallHist:new Map(),wallSnapshots:[]});return books.get(s)}
function applyBook(d,type){const s=d.s;if(!coins.has(s))return;const b=ensureBook(s);type=type||d.type;if(type==='snapshot'){b.bids.clear();b.asks.clear();for(const [p,q] of d.b||[])b.bids.set(num(p),num(q));for(const [p,q] of d.a||[])b.asks.set(num(p),num(q));b.valid=true}else if(type==='delta'&&b.valid){for(const [p,q] of d.b||[]){const qty=num(q),price=num(p);qty?b.bids.set(price,qty):b.bids.delete(price)}for(const [p,q] of d.a||[]){const qty=num(q),price=num(p);qty?b.asks.set(price,qty):b.asks.delete(price)}}b.last=now();b.u=num(d.u);b.seq=num(d.seq);recordWallSnapshot(s)}
function recordWallSnapshot(s){const b=books.get(s);if(!b?.valid)return;const t=now(),c=coins.get(s),price=c?.price;if(!price)return;const capture=(map,side)=>{const arr=[];for(const [p,q] of map){const dist=Math.abs(p-price)/price;if(dist<=CFG.MAX_WALL_DIST){const usd=p*q;if(usd>0)arr.push({p,q,usd,side})}}arr.sort((a,b)=>b.usd-a.usd);return arr.slice(0,12)};b.wallSnapshots.push({ts:t,price,bids:capture(b.bids,'LONG'),asks:capture(b.asks,'SHORT')});while(b.wallSnapshots.length&&b.wallSnapshots[0].ts<t-CFG.ICEBERG_WINDOW)b.wallSnapshots.shift()}
function addTrade(d){const s=d.s;if(!coins.has(s))return;let a=trades.get(s);if(!a)trades.set(s,a=[]);const p=num(d.p),q=num(d.v),side=d.S==='Buy'?'BUY':'SELL';a.push({ts:num(d.T)||now(),p,q,side,usd:p*q});clean(a,Math.max(CFG.PRICE_HISTORY,300000));const c=coins.get(s);if(c)c.price=p}
const wsDiag={expected:0,opened:0,subscribed:0,subErrors:0,snapshots:0,deltas:0,trades:0,messages:0,parseErrors:0,errors:0,reconnects:0,lastError:'',lastSubError:'',lastClose:'',lastMessageAt:0,lastSnapshotAt:0,sockets:new Map()};
let wsGeneration=0;
function wsMeta(id,chunk){return{id,chunk,ws:null,opened:false,subscribed:false,messages:0,snapshots:0,deltas:0,trades:0,errors:0,lastMessageAt:0,lastCloseCode:'',lastCloseReason:'',retryTimer:null}}
function subscribe(ws,symbols,id){const args=[];for(const s of symbols)args.push('orderbook.'+CFG.DEPTH+'.'+s,'publicTrade.'+s);try{ws.send(JSON.stringify({op:'subscribe',req_id:'sub_'+id+'_'+Date.now(),args}))}catch(e){wsDiag.errors++;wsDiag.lastError='SUB send #'+id+': '+(e.message||String(e))}}
function closeSockets(){wsGeneration++;clearTimeout(reconnectTimer);reconnectTimer=null;for(const meta of wsDiag.sockets.values()){if(meta.retryTimer)clearTimeout(meta.retryTimer);try{meta.ws?.close()}catch{}}wsDiag.sockets.clear();wsList=[]}
function scheduleSocketReconnect(id,chunk,generation){const meta=wsDiag.sockets.get(id);if(!running||generation!==wsGeneration||!meta||meta.retryTimer)return;meta.retryTimer=setTimeout(()=>{meta.retryTimer=null;if(running&&generation===wsGeneration)createSocket(id,chunk,generation,true)},2000)}
function createSocket(id,chunk,generation,isReconnect=false){if(!running||generation!==wsGeneration)return;const old=wsDiag.sockets.get(id);if(old?.retryTimer)clearTimeout(old.retryTimer);const meta=wsMeta(id,chunk);wsDiag.sockets.set(id,meta);const w=new WebSocket(WS_URL);meta.ws=w;wsList[id]=w;if(isReconnect)wsDiag.reconnects++;w.onopen=()=>{if(generation!==wsGeneration){try{w.close()}catch{};return}meta.opened=true;wsDiag.opened=[...wsDiag.sockets.values()].filter(x=>x.opened&&x.ws?.readyState===1).length;subscribe(w,chunk,id);setStatus('WebSocket: '+wsDiag.opened+'/'+wsDiag.expected+' | ждём snapshot…')};w.onmessage=e=>{if(generation!==wsGeneration)return;wsDiag.messages++;wsDiag.lastMessageAt=now();meta.messages++;meta.lastMessageAt=now();let m;try{m=JSON.parse(e.data)}catch(err){wsDiag.parseErrors++;wsDiag.lastError='JSON #'+id+': '+(err.message||String(err));return}if(m.op==='subscribe'){if(m.success===true){if(!meta.subscribed){meta.subscribed=true;wsDiag.subscribed++}}else{wsDiag.subErrors++;const msg=m.ret_msg||m.retMsg||m.retCode||'неизвестная ошибка подписки';wsDiag.lastSubError='#'+id+' '+String(msg)+(m.failTopics?' | '+JSON.stringify(m.failTopics):'')}return}if(m.op==='pong'||m.ret_msg==='pong')return;if(typeof m.topic!=='string')return;if(m.topic.startsWith('orderbook.'+CFG.DEPTH+'.')){if(m.type==='snapshot'){wsDiag.snapshots++;meta.snapshots++;wsDiag.lastSnapshotAt=now()}else if(m.type==='delta'){wsDiag.deltas++;meta.deltas++}if(m.data)applyBook(m.data,m.type)}else if(m.topic.startsWith('publicTrade.')){const arr=m.data||[];wsDiag.trades+=arr.length;meta.trades+=arr.length;for(const t of arr)addTrade(t)}};w.onerror=()=>{wsDiag.errors++;meta.errors++;wsDiag.lastError='#'+id+' WebSocket error';try{w.close()}catch{}};w.onclose=e=>{meta.opened=false;meta.lastCloseCode=e.code;meta.lastCloseReason=e.reason||'';wsDiag.lastClose='#'+id+' code='+e.code+(e.reason?' reason='+e.reason:'');wsDiag.opened=[...wsDiag.sockets.values()].filter(x=>x.opened&&x.ws?.ready       s.veto='broke-sweep-low';
      funnel.veto.break++;
      transition(s,ST.INVALIDATED,'sweep low broken');
      logSetup(s);
    } else if(s.side==='SHORT'&&price>s.sweepExtreme){
      s.veto='broke-sweep-high';
      funnel.veto.break++;
      transition(s,ST.INVALIDATED,'sweep high broken');
      logSetup(s);
    }
    return;
  }

  if(state===ST.RETEST_PENDING){
    // если цена пробила экстремум sweep — мёртв
    if(s.side==='LONG'&&price<s.sweepExtreme){
      s.veto='broke-sweep-low-at-retest';
      funnel.veto.break++;
      transition(s,ST.INVALIDATED,'sweep low broken during retest');
      logSetup(s);
      return;
    }
    if(s.side==='SHORT'&&price>s.sweepExtreme){
      s.veto='broke-sweep-high-at-retest';
      funnel.veto.break++;
      transition(s,ST.INVALIDATED,'sweep high broken during retest');
      logSetup(s);
      return;
    }
    // ищем возврат к зоне
    if(Math.abs(price-s.zoneP)<=tol){
      s.retestTs=now();
      transition(s,ST.RETEST_HELD,'retest held @ '+price.toFixed(8));
      advanceSetup(s,ctx);
    }
    return;
  }

  if(state===ST.RETEST_HELD){
    // ищем агрессивный поток в сторону
    const f=flowStats(s.sym,price,Number($('flowWindow').value));
    const dom=s.side==='LONG'?f.buy:f.sell;
    const opp=s.side==='LONG'?f.sell:f.buy;
    const wallUsd=s.wall?.usd||10000;
    const flowMin=Math.max(CFG.FLOW_DOM_MIN,wallUsd*0.15);
    if(dom>=flowMin&&dom>opp*CFG.FLOW_DOM_RATIO){
      s.flowTs=now();s.flowSnapshot=f;
      transition(s,ST.FLOW_OK,'dom flow '+fmt(dom)+' vs opp '+fmt(opp));
      advanceSetup(s,ctx);
    }
    return;
  }

  if(state===ST.FLOW_OK){
    // финальный контекст-чек + вход
    const news=newsLock();
    if(news){
      s.veto='news:'+(news.name||'event');
      funnel.veto.news++;
      transition(s,ST.INVALIDATED,'news lock');
      logSetup(s);return;
    }
    const wall=bestWall(s.sym,s.zone,s.side,price);
    s.wall=wall;
    if(!wall||wall.age<CFG.WALL_MIN_AGE||wall.retained<CFG.WALL_RETENTION||wall.ratio<CFG.WALL_RATIO){
      s.veto='wall';
      funnel.veto.wall++;
      transition(s,ST.INVALIDATED,'wall invalid at entry');
      logSetup(s);return;
    }
    const spike=volumeSpike(s.sym);
    if(spike.ratio<CFG.RVOL_MIN){
      s.veto='rvol:'+spike.ratio.toFixed(2);
      funnel.veto.rvol++;
      transition(s,ST.INVALIDATED,'rvol '+spike.ratio.toFixed(2)+' < '+CFG.RVOL_MIN);
      logSetup(s);return;
    }
    const regime=marketRegime(s.sym);
    // SL — за реальный экстремум sweep
    const stopBase=s.side==='LONG'?s.sweepExtreme-atr1*0.12:s.sweepExtreme+atr1*0.12;
    const stop=s.side==='LONG'?stopBase-(regime.stopMult-1)*atr1*0.15:stopBase+(regime.stopMult-1)*atr1*0.15;
    const risk=Math.abs(price-stop);
    if(risk<1e-12||risk/price>0.05){
      s.veto='stop-too-wide';
      transition(s,ST.INVALIDATED,'risk out of range');
      logSetup(s);return;
    }
    // TP — ближайшая значимая ликвидность в направлении; fallback на RR
    const nextLiq=nextLiquidityTarget(s.sym,s.side,price,atr1);
    let target=s.side==='LONG'?price+Math.max(risk*2.2,atr1*0.8):price-Math.max(risk*2.2,atr1*0.8);
    if(nextLiq){
      const distRR=Math.abs(nextLiq-price)/risk;
      if(distRR>=CFG.MIN_RR)target=nextLiq;
    }
    const rr=Math.abs(target-price)/risk;
    if(rr<CFG.MIN_RR){
      s.veto='rr:'+rr.toFixed(2);
      funnel.veto.rr++;
      transition(s,ST.INVALIDATED,'rr '+rr.toFixed(2));
      logSetup(s);return;
    }
    // Confidence
    const htfPts=Math.min(20,Math.round(s.zone.score*0.22));
    const wallPts=5;
    const sweepPts=15;
    const retestPts=20;
    const flowPts=clamp(Math.round((Math.max(funnel.flow_ok,1))*0+10),0,15);
    const rvolPts=clamp(Math.round((spike.ratio-CFG.RVOL_MIN)*6),0,18);
    let conf=htfPts+wallPts+sweepPts+retestPts+flowPts+rvolPts;
    conf=Math.min(100,conf);
    const minConfidence=Number($('quality').value)||84;
    if(conf<minConfidence){
      s.veto='conf:'+conf+'<'+minConfidence;
      transition(s,ST.INVALIDATED,'confidence below threshold');
      logSetup(s);return;
    }
    // FIRED
    s.entryPrice=price;s.entryTs=now();s.stop=stop;s.target=target;s.rr=rr;s.confidence=conf;
    s.context={
      htf:{has4H:s.zone.tfs.has('4H'),has1H:s.zone.tfs.has('1H'),has15M:s.zone.tfs.has('15M'),score:Math.round(s.zone.score)},
      wall:{usd:Math.round(wall.usd),ageMs:wall.age,retention:+wall.retained.toFixed(3),ratio:+wall.ratio.toFixed(2)},
      rvol:+spike.ratio.toFixed(2),
      flow:{buy:Math.round(s.flowSnapshot?.buy||0),sell:Math.round(s.flowSnapshot?.sell||0)},
      regime:regime.type,
      sweepExtreme:s.sweepExtreme,
      nextLiq:nextLiq||null
    };
    transition(s,ST.FIRED,'entry '+price.toFixed(8)+' sl '+stop.toFixed(8)+' tp '+target.toFixed(8)+' rr '+rr.toFixed(2));
    // Создаём сигнал-карточку
    pushSignalFromSetup(s,spike,regime);
    // Кладём в трекинг исхода
    openPositions.push(s);
    // Лог сразу (перезапишем при закрытии)
    logSetup(s);
  }
}
function nextLiquidityTarget(sym,side,price,atr1){
  const zs=zones.get(sym)||[];
  const minGap=atr1*0.5;
  const candidates=zs.filter(z=>side==='LONG'?z.p>price+minGap:z.p<price-minGap);
  if(!candidates.length)return null;
  candidates.sort((a,b)=>Math.abs(a.p-price)-Math.abs(b.p-price));
  const significant=candidates.find(z=>z.score>=CFG.MIN_ZONE_SCORE);
  return significant?significant.p:null;
}
function pushSignalFromSetup(s,spike,regime){
  const old=signals.get(s.sym);
  if(old&&old.expires>now())return;
  if(old&&now()-old.ts<CFG.COOLDOWN)return;
  signals.set(s.sym,{
    symbol:s.sym,side:s.side,
    price:s.entryPrice,entry:s.entryPrice,stop:s.stop,target:s.target,rr:s.rr,
    ts:s.entryTs,expires:s.entryTs+CFG.ENTRY_TTL,
    zone:s.zone,flow:s.flowSnapshot,abs:0,
    react:null,confidence:s.confidence,
    ice:null,
    sweep:{hit:true,reclaimed:true,extreme:s.sweepExtreme},
    ret:{retest:true,retestTs:s.retestTs},
    spike:{ratio:spike.ratio},
    stack:null,regime:regime.type,
    setupId:s.id,transitions:s.transitions.slice()
  });
}
function trackPositions(){
  const t=now();
  for(let i=openPositions.length-1;i>=0;i--){
    const p=openPositions[i];
    const c=coins.get(p.sym);if(!c)continue;
    const price=c.price;
    if(p.side==='LONG'){
      p.mfe=Math.max(p.mfe??price,price);
      p.mae=Math.min(p.mae??price,price);
    } else {
      p.mfe=Math.min(p.mfe??price,price);
      p.mae=Math.max(p.mae??price,price);
    }
    let hit=null;
    if(p.side==='LONG'){
      if(price>=p.target)hit='TP';
      else if(price<=p.stop)hit='SL';
    } else {
      if(price<=p.target)hit='TP';
      else if(price>=p.stop)hit='SL';
    }
    if(!hit&&t-p.entryTs>CFG.POSITION_TTL)hit='EXPIRED';
    if(hit){
      p.result=hit;p.exitTs=t;p.exitPrice=price;
      logSetup(p);
      openPositions.splice(i,1);
    }
  }
}
function logSetup(s){
  // обновляем или добавляем запись по id
  const idx=setupLog.findIndex(x=>x.id===s.id);
  const rec={
    id:s.id,sym:s.sym,side:s.side,createdAt:s.createdAt,entryTs:s.entryTs,
    entryPrice:s.entryPrice,stop:s.stop,target:s.target,rr:s.rr,
    result:s.result,exitTs:s.exitTs,exitPrice:s.exitPrice,mfe:s.mfe,mae:s.mae,
    confidence:s.confidence,
    htf4:s.zone?.tfs?.has('4H')?1:0,htf1:s.zone?.tfs?.has('1H')?1:0,htf15:s.zone?.tfs?.has('15M')?1:0,
    wall:s.context?.wall||null,rvol:s.context?.rvol||null,regime:s.context?.regime||null,
    veto:s.veto,state:s.state,
    transitions:s.transitions.map(t=>t.state).join('>')
  };
  if(idx>=0)setupLog[idx]=rec;else setupLog.push(rec);
  if(setupLog.length>CFG.LOG_MAX)setupLog.splice(0,setupLog.length-CFG.LOG_MAX);
  renderLog();
}
function renderLog(){
  const recent=setupLog.slice(-12).reverse();
  if(!recent.length){$('logbox').textContent='—';return}
  $('logbox').textContent=recent.map(r=>{
    const res=r.result?' → '+r.result:' → '+r.state;
    const veto=r.veto?' | veto '+r.veto:'';
    return r.sym.padEnd(12)+' '+r.side.padEnd(5)+' ['+r.transitions+']'+res+veto;
  }).join('\n');
}
function renderFunnel(){
  const f=funnel;
  const cells=[
    ['created',f.created],['HTF_OK',f.htf_ok],['TOUCH',f.level_touched],['SWEPT',f.swept],
    ['RECLAIM',f.reclaimed],['RETEST_P',f.retest_pending],['RETEST_H',f.retest_held],
    ['FLOW_OK',f.flow_ok],['FIRED',f.fired],['EXPIRED',f.expired],
    ['INVALID',f.invalidated],['veto wall',f.veto.wall],['veto rvol',f.veto.rvol],
    ['veto rr',f.veto.rr],['veto break',f.veto.break]
  ];
  $('funnel').innerHTML=cells.map(([k,v])=>'<div class="fn"><b>'+v+'</b><span>'+k+'</span></div>').join('');
}
function exportCSV(){
  const head=['id','sym','side','createdAt','entryTs','entryPrice','stop','target','rr','result','exitTs','exitPrice','mfe','mae','confidence','htf4','htf1','htf15','wall_usd','wall_retention','wall_ratio','rvol','regime','veto','state','transitions'];
  const rows=[head];
  for(const r of setupLog){
    rows.push([
      r.id,r.sym,r.side,r.createdAt||'',r.entryTs||'',
      r.entryPrice||'',r.stop||'',r.target||'',r.rr||'',
      r.result||'',r.exitTs||'',r.exitPrice||'',r.mfe||'',r.mae||'',
      r.confidence||'',r.htf4,r.htf1,r.htf15,
      r.wall?.usd||'',r.wall?.retention||'',r.wall?.ratio||'',
      r.rvol||'',r.regime||'',r.veto||'',r.state||'',r.transitions||''
    ]);
  }
  const csv=rows.map(r=>r.map(v=>{
    const s=String(v==null?'':v);
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  }).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='orderflow_v5_'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.csv';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* =================== EVALUATE dispatcher =================== */
function evaluateV5(s){
  const st=stateFor(s),c=coins.get(s),b=books.get(s);
  st.candidate=false;st.wall=null;st.confidence=0;st.setup=null;
  if(!c||!b?.valid||now()-b.last>CFG.BOOK_STALE){st.stage=ST.IDLE;return}
  const price=c.price;
  const atr1=metrics.get(s)?.atr1||price*0.002;
  const ctx={price,atr1};
  discoverSetups(s,price,atr1);
  // прогоняем все активные сетапы этого символа
  for(const s2 of setups.values()){
    if(s2.sym!==s)continue;
    if([ST.FIRED,ST.EXPIRED,ST.INVALIDATED].includes(s2.state))continue;
    advanceSetup(s2,ctx);
  }
  // для UI — берём самый продвинутый активный сетап
  let bestState=ST.IDLE,bestConf=0,bestSetup=null;
  for(const s2 of setups.values()){
    if(s2.sym!==s)continue;
    if([ST.EXPIRED,ST.INVALIDATED].includes(s2.state))continue;
    if(STATE_RANK[s2.state]>STATE_RANK[bestState]){
      bestState=s2.state;bestConf=s2.confidence||0;bestSetup=s2;
    }
  }
  st.stage=bestState;st.confidence=bestConf;st.setup=bestSetup;
  if(bestSetup){
    st.wall=bestSetup.wall||null;
    st.side=bestSetup.side;st.zone=bestSetup.zone;
    st.candidate=bestState===ST.FIRED;
  }
}
function scanPriority(){if(!running)return;rebuildPriority();const q=nextQueue(),t=now();let budget=0;for(const s of q){const st=stateFor(s),age=t-st.lastEval,interval=priority.high.has(s)?CFG.ANALYSIS_BASE:priority.mid.has(s)?700:CFG.ANALYSIS_MAX;if(age>=interval){if(ENGINE==='V5')evaluateV5(s);else evaluateV4(s);st.lastEval=t;budget++;if(budget>=45)break}}if(ENGINE==='V5')trackPositions()}
function stages(x){const flowOpp=x.side==='LONG'?x.flow?.sell||0:x.flow?.buy||0;return '<div class="stages"><span class="stage ok">4H ✓</span><span class="stage '+(x.zone?.tfs?.has('1H')?'ok':'warn')+'">1H '+(x.zone?.tfs?.has('1H')?'✓':'наблюдение')+'</span><span class="stage '+(x.zone?.tfs?.has('15M')?'ok':'warn')+'">15M '+(x.zone?.tfs?.has('15M')?'✓':'уточнение')+'</span><span class="stage ok">Wall 15s ✓</span><span class="stage '+(x.ret?.retest?'ok':'warn')+'">Retest '+(x.ret?.retest?'✓':'—')+'</span><span class="stage '+(x.sweep?.reclaimed?'ok':'warn')+'">Sweep '+(x.sweep?.reclaimed?'✓':'—')+'</span><span class="stage '+(x.ice?.hit?'ok':'warn')+'">Iceberg '+(x.ice?.hit?'✓':'—')+'</span><span class="stage '+((x.spike?.ratio||0)>=2?'ok':'warn')+'">RVOL '+(x.spike?.ratio||0).toFixed(1)+'x</span><span class="stage '+(flowOpp>0?'ok':'warn')+'">Поток '+fmt(flowOpp)+'</span><span class="stage '+((x.abs||0)>=10?'ok':'warn')+'">Абсорбция '+((x.abs||0).toFixed(0))+'%</span></div>'}
function fmtPrice(v){if(!Number.isFinite(v))return '-';if(v>=100)return v.toFixed(2);if(v>=1)return v.toFixed(4);if(v>=.01)return v.toFixed(6);return v.toFixed(8)}
function cardSignal(x){const cls=x.side==='LONG'?'long':'short';const seq=x.transitions?x.transitions.map(t=>t.state).join(' → '):'';return '<div class="card '+cls+'"><div class="head"><div><span class="sym">'+x.symbol+'</span> <span class="side '+cls+'">'+x.side+'</span></div><span class="badge">Confidence: '+x.confidence+'/100</span></div><div class="grid"><div class="kv"><small>ВХОД</small><b>'+fmtPrice(x.entry)+'</b></div><div class="kv"><small>СТОП (за sweep)</small><b>'+fmtPrice(x.stop)+'</b></div><div class="kv"><small>ТЕЙК</small><b>'+fmtPrice(x.target)+'</b></div><div class="kv"><small>RR</small><b>'+x.rr.toFixed(1)+'</b></div></div>'+stages(x)+(seq?'<div class="foot">FSM: '+seq+'</div>':'')+'<div class="foot">Regime: '+(x.regime?.type||x.regime||'—')+' | Sweep extr: '+fmtPrice(x.sweep?.extreme)+'</div></div>'}
function render(){const list=[...signals.values()].filter(x=>x.expires>now()).sort((a,b)=>b.ts-a.ts);$('cards').innerHTML=list.length?list.slice(0,CFG.MAX_CARDS).map(cardSignal).join(''):'<div class="empty">Нет сигналов. V5 ждёт полную цепочку: HTF → Level → Sweep → Reclaim → Retest → Flow.</div>';renderStats();renderFunnel();renderDiag()}
function renderDiag(){let stale=0,valid=0;for(const b of books.values()){if(b.valid)valid++;if(b.valid&&now()-b.last>CFG.BOOK_STALE)stale++}const errors=[...metrics.values()].filter(x=>x.error).length,hi=priority.high.size,mi=priority.mid.size,lo=priority.low.size,open=[...wsDiag.sockets.values()].filter(x=>x.ws?.readyState===1).length,age=wsDiag.lastMessageAt?Math.max(0,(now()-wsDiag.lastMessageAt)/1000):null,lock=newsLock(),active=[...setups.values()].filter(x=>![ST.FIRED,ST.EXPIRED,ST.INVALIDATED].includes(x.state)).length,lines=[];for(const m of wsDiag.sockets.values())lines.push('#'+(m.id+1)+' '+(m.ws?.readyState===1?'OPEN':'CLOSED')+' | SUB '+(m.subscribed?'OK':'…')+' | SNAP '+m.snapshots+' | Δ '+m.deltas+' | TR '+m.trades);$('diag').textContent='Режим: '+(mode==='watch'?'НАБЛЮДЕНИЕ':'ВХОД')+' | Движок: '+ENGINE+'\nМонет: '+coins.size+' | Стаканов: '+valid+' | Устарели: '+stale+' | REST errors: '+errors+'\nСетапы активных: '+active+' | Всего создано: '+funnel.created+' | Открытых позиций: '+openPositions.length+' | Лог: '+setupLog.length+'\nОчередь: HIGH '+hi+' | MID '+mi+' | LOW '+lo+'\nWS OPEN: '+open+'/'+wsDiag.expected+' | SUB OK: '+wsDiag.subscribed+' | SUB ERR: '+wsDiag.subErrors+'\nSNAPSHOT: '+wsDiag.snapshots+' | DELTA: '+wsDiag.deltas+' | TRADES: '+wsDiag.trades+' | MSG: '+wsDiag.messages+'\nWS ERR: '+wsDiag.errors+' | JSON ERR: '+wsDiag.parseErrors+' | RECONNECT: '+wsDiag.reconnects+(age===null?'':' | last data '+age.toFixed(1)+'s ago')+'\nFSM V5: HTF_OK → LEVEL_TOUCHED → SWEPT → RECLAIMED → RETEST_PENDING → RETEST_HELD → FLOW_OK → FIRED\nSL — за экстремум sweep | TP — следующая значимая ликвидность | TTL на каждое состояние\nNews Lock: '+(lock?lock.name:'OFF')+'\n'+(wsDiag.lastSubError?'Last SUB error: '+wsDiag.lastSubError+'\n':'')+(wsDiag.lastError?'Last WS error: '+wsDiag.lastError+'\n':'')+(wsDiag.lastClose?'Last close: '+wsDiag.lastClose+'\n':'')+'--- СОКЕТЫ ---\n'+lines.join('\n')}
async function refreshTop(){if(!running)return;try{const ch=await loadCoins();const changed=ch.added.length||ch.removed.length;if(changed){for(const s of ch.removed){books.delete(s);trades.delete(s);zones.delete(s);states.delete(s);signals.delete(s);for(const[k,v]of setups)if(v.sym===s)setups.delete(k)}connect();await loadAllHTF()}$('diag').textContent='TOP обновлён: '+new Date().toLocaleTimeString('ru-RU')+'\nTOP-200 | новых: '+ch.added.length+' | удалено: '+ch.removed.length;setStatus('TOP-200 обновлён | WebSocket и HTF синхронизированы')}catch(e){setStatus('Ошибка обновления TOP: '+e.message,false)}}
function startLoops(){clearInterval(scanTimer);clearInterval(renderTimer);clearInterval(topRefreshTimer);scanTimer=setInterval(scanPriority,150);renderTimer=setInterval(render,900);topRefreshTimer=setInterval(refreshTop,CFG.TOP_REFRESH)}
async function start(){if(running)return;running=true;$('startBtn').classList.add('on');setStatus('Загрузка TOP-200 и HTF-зон…');try{await loadCoins();await loadAllHTF();connect();startLoops();rebuildPriority();setStatus('V5 запущен: FSM + журнал + воронка. Движок: '+ENGINE);render()}catch(e){running=false;setStatus('Ошибка запуска: '+e.message,false);$('diag').textContent=e.stack||e.message}}
function stop(){running=false;clearInterval(scanTimer);clearInterval(renderTimer);clearInterval(topRefreshTimer);clearInterval(pingTimer);clearTimeout(reconnectTimer);closeSockets();setStatus('Остановлен',false);render()}
function clearCards(){signals.clear();for(const st of states.values()){st.candidate=false;st.stage=ST.IDLE}$('cards').innerHTML='<div class="empty">Карточки очищены</div>';renderStats()}
function resetFunnel(){funnel.created=funnel.htf_ok=funnel.level_touched=funnel.swept=funnel.reclaimed=funnel.retest_pending=funnel.retest_held=funnel.flow_ok=funnel.fired=funnel.expired=funnel.invalidated=0;funnel.veto={wall:0,rvol:0,rr:0,news:0,break:0};for(const k of Object.keys(funnel.veto))funnel.veto[k]=0;renderFunnel()}
$('startBtn').onclick=start;$('stopBtn').onclick=stop;$('clearBtn').onclick=clearCards;$('exportBtn').onclick=exportCSV;$('funnelBtn').onclick=resetFunnel;
$('watchBtn').onclick=()=>{mode='watch';$('watchBtn').classList.add('active');$('entryBtn').classList.remove('active');render()};
$('entryBtn').onclick=()=>{mode='entry';$('entryBtn').classList.add('active');$('watchBtn').classList.remove('active');render()};
$('engineV4').onclick=()=>{ENGINE='V4';$('engineV4').classList.add('active');$('engineV5').classList.remove('active');setStatus('Движок переключён на V4');render()};
$('engineV5').onclick=()=>{ENGINE='V5';$('engineV5').classList.add('active');$('engineV4').classList.remove('active');setStatus('Движок переключён на V5 (FSM)');render()};
window.addEventListener('beforeunload',stop);renderStats();renderFunnel();
</script>
