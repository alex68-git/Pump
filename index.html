<script>
'use strict';
const API='https://api.bybit.com';
const WS_URL='wss://stream.bybit.com/v5/public/linear';
const CFG={
 TOP:200,DEPTH:50,ZONE_LOOKBACK:120,SWING:3,MAX_WALL_DIST:.004,ZONE_PAD:.0018,MIN_ZONE_SCORE:58,
 MAX_CARDS:8,ENTRY_TTL:1800000,WATCH_TTL:300000,COOLDOWN:1200000,BOOK_STALE:5000,WALL_MIN_AGE:15000,
 WALL_RETENTION:.60,MAX_WALL_DRIFT:.0015,REACTION_WINDOW:20000,PRICE_HISTORY:60000,MIN_TF_ALIGN:3,WALL_RATIO:3,
 ABSORB_RATIO:.25,REACTION_ATR:.18,MIN_RR:2,RETEST_WINDOW:90000,BOUNCE_MIN_ATR:.10,RETEST_TOL_ATR:.16,
 SWEEP_LOOKBACK:90000,SWEEP_RECLAIM_MS:15000,VOL_SPIKE_MIN:1.5,VOL_LOOKBACK:20,ONE_MIN_CONFIRM:true,
 WS_SYMBOLS_PER_CONN:20,WS_MAX:10,HTF_BATCH:8,TOP_REFRESH:900000,ANALYSIS_BASE:350,ANALYSIS_MAX:1600,
 REST_MIN_GAP:80,REST_MAX_RETRIES:5,ICEBERG_MIN_RELOADS:2,ICEBERG_WINDOW:120000,ICEBERG_MIN_VOLUME:100000,
 STACK_LEVELS:3,STACK_DIST:.0005,STACK_MAX_DIST:.0018,STACK_MIN_USD:25000
};
/* News Lock: automatic calendar feeds are intentionally not hard-coded because public calendar endpoints
   change frequently and may be blocked by CORS. Add UTC event timestamps here when desired:
   {ts: Date.parse('2026-10-07T12:30:00Z'),name:'CPI'} . Lock is +/- NEWS_LOCK_MIN around each event. */
const NEWS_LOCK_MIN=12;
const NEWS_EVENTS=[];
let running=false,mode='watch',wsList=[],reconnectTimer=null,pingTimer=null,scanTimer=null,renderTimer=null,topRefreshTimer=null;
let restBusy=false,lastRestAt=0;
const coins=new Map(),books=new Map(),trades=new Map(),zones=new Map(),states=new Map(),signals=new Map(),metrics=new Map();
const priority={high:new Set(),mid:new Set(),low:new Set()};
const $=id=>document.getElementById(id),now=()=>Date.now(),num=x=>Number(x)||0,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const fmt=n=>{n=num(n);if(!n)return '$0';const a=Math.abs(n);if(a>=1e6)return '$'+(n/1e6).toFixed(2)+'M';if(a>=1e3)return '$'+(n/1e3).toFixed(1)+'K';if(a>=1)return '$'+n.toFixed(0);return '$'+n.toFixed(2)};
function setStatus(t,good=true){$('status').textContent=t;$('status').className='status '+(good?'good':'bad')}
function stat(label,val){return '<div class="stat"><b>'+val+'</b><span>'+label+'</span></div>'}
function renderStats(){let ws=wsList.filter(x=>x?.readyState===1).length,wall=0,cand=0,sig=0;for(const s of coins.keys()){const b=books.get(s);if(states.get(s)?.wall)wall++;if(states.get(s)?.candidate)cand}for(const x of signals.values())if(x.expires>now())sig;$('stats').innerHTML=stat('МОНЕТЫ',coins.size)+stat('СТЕНЫ',wall)+stat('КАНДИДАТЫ',cand)+stat('СИГНАЛЫ',sig)+stat('WS',ws);}
function clean(arr,maxAge){const t=now()-maxAge;while(arr.length&&arr[0].ts<t)arr.shift()}
function median(a){if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2}
async function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function getJSON(path,params,attempt=0){const wait=Math.max(0,CFG.REST_MIN_GAP-(performance.now()-lastRestAt));if(wait)await sleep(wait);lastRestAt=performance.now();const u=new URL(API+path);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));try{const r=await fetch(u,{cache:'no-store'});if(r.status===429){if(attempt>=CFG.REST_MAX_RETRIES)throw Error('HTTP 429: лимит REST');await sleep(Math.min(8000,500*Math.pow(2,attempt)));return getJSON(path,params,attempt+1)}if(!r.ok){if(attempt<CFG.REST_MAX_RETRIES&&r.status>=500){await sleep(500*Math.pow(2,attempt));return getJSON(path,params,attempt+1)}throw Error('HTTP '+r.status)}const j=await r.json();if(j.retCode!==0){if(attempt<CFG.REST_MAX_RETRIES&&[10006,10016].includes(j.retCode)){await sleep(Math.min(8000,500*Math.pow(2,attempt)));return getJSON(path,params,attempt+1)}throw Error(j.retMsg||'Bybit error')}metrics.set('restLatency',Math.round(performance.now()-lastRestAt));return j.result}catch(e){if(attempt<CFG.REST_MAX_RETRIES&&/Failed to fetch|NetworkError|network/i.test(e.message)){await sleep(500*Math.pow(2,attempt));return getJSON(path,params,attempt+1)}throw e}}
async function loadCoins(){const r=await getJSON('/v5/market/tickers',{category:'linear'});const a=(r.list||[]).filter(x=>x.symbol.endsWith('USDT')&&num(x.turnover24h)>0).sort((a,b)=>num(b.turnover24h)-num(a.turnover24h)).slice(0,CFG.TOP);const old=new Set(coins.keys());coins.clear();for(let i=0;i<a.length;i++)coins.set(a[i].symbol,{rank:i+1,turn:num(a[i].turnover24h),price:num(a[i].lastPrice)});return{added:[...coins.keys()].filter(s=>!old.has(s)),removed:[...old].filter(s=>!coins.has(s))}}
function candlesToObj(list){return [...list].reverse().map(x=>({ts:num(x[0]),o:num(x[1]),h:num(x[2]),l:num(x[3]),c:num(x[4]),v:num(x[5]),q:num(x[6])})).filter(x=>x.o&&x.h&&x.l&&x.c)}
async function loadTF(sym,interval){const r=await getJSON('/v5/market/kline',{category:'linear',symbol:sym,interval,limit:CFG.ZONE_LOOKBACK});return candlesToObj(r.list||[]).filter(x=>x.ts<now()-60000)}
function swings(c){const out=[];for(let i=CFG.SWING;i<c.length-CFG.SWING;i++){let hi=true,lo=true;for(let j=1;j<=CFG.SWING;j++){if(c[i].h<=c[i-j].h||c[i].h<c[i+j].h)hi=false;if(c[i].l>=c[i-j].l||c[i].l>c[i+j].l)lo=false}if(hi)out.push({p:c[i].h,kind:'SHORT',ts:c[i].ts});if(lo)out.push({p:c[i].l,kind:'LONG',ts:c[i].ts})}return out}
function atr(c){if(c.length<15)return 0;const a=[];for(let i=1;i<c.length;i++)a.push(Math.max(c[i].h-c[i].l,Math.abs(c[i].h-c[i-1].c),Math.abs(c[i].l-c[i-1].c)));return median(a.slice(-40))}
function buildZones(sym,tf4,tf1,tf15){const all=[];for(const z of swings(tf4))all.push({...z,tf:'4H',w:5});for(const z of swings(tf1))all.push({...z,tf:'1H',w:3});for(const z of swings(tf15))all.push({...z,tf:'15M',w:1.5});all.sort((a,b)=>a.p-b.p);const lastPrice=tf1.at(-1)?.c||tf4.at(-1)?.c||0,ar=atr(tf1)||(lastPrice*.003),tol=Math.max(ar*.75,lastPrice*CFG.ZONE_PAD),zs=[];for(const z of all){let g=zs.find(x=>Math.abs(x.p-z.p)<=tol);if(!g){g={p:z.p,lo:z.p,hi:z.p,score:0,tfs:new Set(),long:0,short:0,last:z.ts,count:0};zs.push(g)}g.p=(g.p*g.count+z.p)/(g.count+1);g.lo=Math.min(g.lo,z.p);g.hi=Math.max(g.hi,z.p);g.score+=z.w;g.tfs.add(z.tf);g[z.kind==='LONG'?'long':'short']+=z.w;g.last=Math.max(g.last,z.ts);g.count++}for(const g of zs){const ageH=(now()-g.last)/3600000;g.score+=Math.max(0,8-ageH*.5);g.tfsScore=g.tfs.has('4H')?30:0;if(g.tfs.has('1H'))g.tfsScore+=18;if(g.tfs.has('15M'))g.tfsScore+=8;g.score+=g.tfsScore}return zs.filter(z=>z.score>=CFG.MIN_ZONE_SCORE/2).sort((a,b)=>b.score-a.score).slice(0,18)}
async function loadAllHTF(){const syms=[...coins.keys()];let done=0;for(let c=0;c<syms.length;c+=CFG.HTF_BATCH){if(!running)break;const chunk=syms.slice(c,c+CFG.HTF_BATCH);await Promise.all(chunk.map(async s=>{try{const [h4,h1,m15]=await Promise.all([loadTF(s,'240'),loadTF(s,'60'),loadTF(s,'15')]);zones.set(s,buildZones(s,h4,h1,m15));metrics.set(s,{...(metrics.get(s)||{}),atr1:atr(h1),atr15:atr(m15),htfAt:now()})}catch(e){metrics.set(s,{...(metrics.get(s)||{}),error:e.message})}done++}));$('diag').textContent='Загрузка HTF: '+done+'/'+syms.length+'\nBatch: '+CFG.HTF_BATCH+' | REST: '+(metrics.get('restLatency')?.toString()||'?')+' ms';await sleep(100)}}
function ensureBook(s){if(!books.has(s))books.set(s,{bids:new Map(),asks:new Map(),valid:false,last:0,u:0,seq:0,wallHist:new Map(),wallSnapshots:[]});return books.get(s)}
function applyBook(d,type){const s=d.s;if(!coins.has(s))return;const b=ensureBook(s);type=type||d.type;if(type==='snapshot'){b.bids.clear();b.asks.clear();for(const [p,q] of d.b||[])b.bids.set(num(p),num(q));for(const [p,q] of d.a||[])b.asks.set(num(p),num(q));b.valid=true}else if(type==='delta'&&b.valid){for(const [p,q] of d.b||[]){const qty=num(q),price=num(p);qty?b.bids.set(price,qty):b.bids.delete(price)}for(const [p,q] of d.a||[]){const qty=num(q),price=num(p);qty?b.asks.set(price,qty):b.asks.delete(price)}}b.last=now();b.u=num(d.u);b.seq=num(d.seq);recordWallSnapshot(s)}
function recordWallSnapshot(s){const b=books.get(s);if(!b?.valid)return;const t=now(),c=coins.get(s),price=c?.price;if(!price)return;const capture=(map,side)=>{const arr=[];for(const [p,q] of map){const dist=Math.abs(p-price)/price;if(dist<=CFG.MAX_WALL_DIST){const usd=p*q;if(usd>0)arr.push({p,q,usd,side})}}arr.sort((a,b)=>b.usd-a.usd);return arr.slice(0,12)};b.wallSnapshots.push({ts:t,price,bids:capture(b.bids,'LONG'),asks:capture(b.asks,'SHORT')});while(b.wallSnapshots.length&&b.wallSnapshots[0].ts<t-CFG.ICEBERG_WINDOW)b.wallSnapshots.shift()}
function addTrade(d){const s=d.s;if(!coins.has(s))return;let a=trades.get(s);if(!a)trades.set(s,a=[]);const p=num(d.p),q=num(d.v),side=d.S==='Buy'?'BUY':'SELL';a.push({ts:num(d.T)||now(),p,q,side,usd:p*q});clean(a,Math.max(CFG.PRICE_HISTORY,300000));const c=coins.get(s);if(c)c.price=p}
const wsDiag={expected:0,opened:0,subscribed:0,subErrors:0,snapshots:0,deltas:0,trades:0,messages:0,parseErrors:0,errors:0,reconnects:0,lastError:'',lastSubError:'',lastClose:'',lastMessageAt:0,lastSnapshotAt:0,sockets:new Map()};
let wsGeneration=0;
function wsMeta(id,chunk){return{id,chunk,ws:null,opened:false,subscribed:false,messages:0,snapshots:0,deltas:0,trades:0,errors:0,lastMessageAt:0,lastCloseCode:'',lastCloseReason:'',retryTimer:null}}
function subscribe(ws,symbols,id){const args=[];for(const s of symbols)args.push('orderbook.'+CFG.DEPTH+'.'+s,'publicTrade.'+s);try{ws.send(JSON.stringify({op:'subscribe',req_id:'sub_'+id+'_'+Date.now(),args}))}catch(e){wsDiag.errors++;wsDiag.lastError='SUB send #'+id+': '+(e.message||String(e))}}
function closeSockets(){wsGeneration++;clearTimeout(reconnectTimer);reconnectTimer=null;for(const meta of wsDiag.sockets.values()){if(meta.retryTimer)clearTimeout(meta.retryTimer);try{meta.ws?.close()}catch{}}wsDiag.sockets.clear();wsList=[]}
function scheduleSocketReconnect(id,chunk,generation){const meta=wsDiag.sockets.get(id);if(!running||generation!==wsGeneration||!meta||meta.retryTimer)return;meta.retryTimer=setTimeout(()=>{meta.retryTimer=null;if(running&&generation===wsGeneration)createSocket(id,chunk,generation,true)},2000)}
function createSocket(id,chunk,generation,isReconnect=false){if(!running||generation!==wsGeneration)return;const old=wsDiag.sockets.get(id);if(old?.retryTimer)clearTimeout(old.retryTimer);const meta=wsMeta(id,chunk);wsDiag.sockets.set(id,meta);const w=new WebSocket(WS_URL);meta.ws=w;wsList[id]=w;if(isReconnect)wsDiag.reconnects++;w.onopen=()=>{if(generation!==wsGeneration){try{w.close()}catch{};return}meta.opened=true;wsDiag.opened=[...wsDiag.sockets.values()].filter(x=>x.opened&&x.ws?.readyState===1).length;subscribe(w,chunk,id);setStatus('WebSocket: '+wsDiag.opened+'/'+wsDiag.expected+' | ждём snapshot…')};w.onmessage=e=>{if(generation!==wsGeneration)return;wsDiag.messages++;wsDiag.lastMessageAt=now();meta.messages++;meta.lastMessageAt=now();let m;try{m=JSON.parse(e.data)}catch(err){wsDiag.parseErrors++;wsDiag.lastError='JSON #'+id+': '+(err.message||String(err));return}if(m.op==='subscribe'){if(m.success===true){if(!meta.subscribed){meta.subscribed=true;wsDiag.subscribed++}}else{wsDiag.subErrors++;const msg=m.ret_msg||m.retMsg||m.retCode||'неизвестная ошибка подписки';wsDiag.lastSubError='#'+id+' '+String(msg)+(m.failTopics?' | '+JSON.stringify(m.failTopics):'')}return}if(m.op==='pong'||m.ret_msg==='pong')return;if(typeof m.topic!=='string')return;if(m.topic.startsWith('orderbook.'+CFG.DEPTH+'.')){if(m.type==='snapshot'){wsDiag.snapshots++;meta.snapshots++;wsDiag.lastSnapshotAt=now()}else if(m.type==='delta'){wsDiag.deltas++;meta.deltas++}if(m.data)applyBook(m.data,m.type)}else if(m.topic.startsWith('publicTrade.')){const arr=m.data||[];wsDiag.trades+=arr.length;meta.trades+=arr.length;for(const t of arr)addTrade(t)}};w.onerror=()=>{wsDiag.errors++;meta.errors++;wsDiag.lastError='#'+id+' WebSocket error';try{w.close()}catch{}};w.onclose=e=>{meta.opened=false;meta.lastCloseCode=e.code;meta.lastCloseReason=e.reason||'';wsDiag.lastClose='#'+id+' code='+e.code+(e.reason?' reason='+e.reason:'');wsDiag.opened=[...wsDiag.sockets.values()].filter(x=>x.opened&&x.ws?.readyState===1).length;if(running&&generation===wsGeneration)scheduleSocketReconnect(id,chunk,generation)}}
function connect(){closeSockets();const generation=wsGeneration,arr=[...coins.keys()],need=Math.min(CFG.WS_MAX,Math.ceil(arr.length/CFG.WS_SYMBOLS_PER_CONN));wsDiag.expected=need;wsDiag.opened=0;wsDiag.subscribed=0;for(let i=0;i<need;i++){const chunk=arr.slice(i*CFG.WS_SYMBOLS_PER_CONN,(i+1)*CFG.WS_SYMBOLS_PER_CONN);wsDiag.sockets.set(i,wsMeta(i,chunk));createSocket(i,chunk,generation,false)}clearInterval(pingTimer);pingTimer=setInterval(()=>{for(const meta of wsDiag.sockets.values()){const w=meta.ws;if(w?.readyState===1){try{w.send(JSON.stringify({op:'ping'}))}catch{}}}},20000)}
function localLiquidity(book,price){const vals=[];for(const [p,q] of book.bids)if(Math.abs(p-price)/price<.003)vals.push(p*q);for(const [p,q] of book.asks)if(Math.abs(p-price)/price<.003)vals.push(p*q);return median(vals)}
function adaptiveWallMin(s,liq){const turn=coins.get(s)?.turn||0,rank=coins.get(s)?.rank||999;let mult=rank<=50?2.0:rank<=100?1.8:rank<=150?1.6:1.45;return Math.max(1200,liq*mult,(turn/86400)*8)}
function bestWall(s,zone,side,price){const b=books.get(s);if(!b?.valid||now()-b.last>CFG.BOOK_STALE)return null;const map=side==='LONG'?b.bids:b.asks,candidates=[];for(const [p,q] of map){if(Math.abs(p-zone.p)/zone.p>CFG.MAX_WALL_DIST)continue;if(side==='LONG'&&p>price*1.001)continue;if(side==='SHORT'&&p<price*.999)continue;const usd=p*q;if(usd>0)candidates.push({p,q,usd})}if(!candidates.length)return null;candidates.sort((a,b)=>b.usd-a.usd);const liq=localLiquidity(b,price),min=adaptiveWallMin(s,liq),w=candidates[0];if(w.usd<min)return null;const t=now();for(const [k,v] of b.wallHist.entries())if(t-v.last>180000)b.wallHist.delete(k);const step=Math.max(price*.0005,1e-8),priceBin=(Math.round(w.p/step)*step).toFixed(8),key=side+'@'+priceBin;let h=b.wallHist.get(key);if(!h)h={first:t,last:t,max:0,initial:w.usd,minSeen:w.usd,updates:0,side};h.last=t;h.max=Math.max(h.max,w.usd);h.minSeen=Math.min(h.minSeen,w.usd);h.updates++;b.wallHist.set(key,h);const retained=h.initial?Math.min(1,h.minSeen/h.initial):1;return{...w,age:t-h.first,liq,min,ratio:liq?w.usd/liq:0,retained,max:h.max,updates:h.updates,key}}
function flowStats(s,price,window){const a=trades.get(s)||[],t=now()-window;let buy=0,sell=0,near=0;for(const x of a){if(x.ts<t)continue;const nearPrice=Math.abs(x.p-price)/price<.002;if(nearPrice){near++;if(x.side==='BUY')buy+=x.usd;else sell+=x.usd}}return{buy,sell,delta:buy-sell,total:buy+sell,near}}
function reaction(s,side){const a=trades.get(s)||[];if(a.length<2)return{score:0,move:0};const t=now()-CFG.REACTION_WINDOW,arr=a.filter(x=>x.ts>=t);if(arr.length<3)return{score:0,move:0};const first=arr[0].p,last=arr.at(-1).p,move=(last-first)/first,dir=side==='LONG'?move:-move,score=clamp(dir/.0015*35,0,35);return{score,move}}
function oneMinuteCandle(s){const a=trades.get(s)||[],c=coins.get(s);if(!a.length||!c)return null;const start=Math.floor(now()/60000)*60000-60000,end=start+60000,arr=a.filter(x=>x.ts>=start&&x.ts<end);if(!arr.length)return null;const o=arr[0].p,h=Math.max(...arr.map(x=>x.p)),l=Math.min(...arr.map(x=>x.p)),cl=arr.at(-1).p,v=arr.reduce((z,x)=>z+x.usd,0);return{ts:start,o,h,l,c:cl,v,closed:true}}
function recentMinuteVolumes(s,count=21){const a=trades.get(s)||[],out=[],cur=Math.floor(now()/60000)*60000;for(let k=1;k<=count;k++){const st=cur-k*60000,en=st+60000,arr=a.filter(x=>x.ts>=st&&x.ts<en);out.push(arr.reduce((z,x)=>z+x.usd,0))}return out}
function volumeSpike(s){const v=recentMinuteVolumes(s,CFG.VOL_LOOKBACK+1);const current=v.shift()||0,base=median(v.filter(x=>x>0));const ratio=base?current/base:0;let score=0;if(ratio>=5)score=18;else if(ratio>=3)score=10;else if(ratio>=2)score=5;return{ratio,current,base,score}}
function detectSweep(s,zone,side,atr1){const a=trades.get(s)||[],t=now()-CFG.SWEEP_LOOKBACK,arr=a.filter(x=>x.ts>=t);if(arr.length<5)return{score:0,hit:false,reclaimed:false,level:null};const level=zone.p,tol=Math.max(atr1*.20,level*.00035);let swept=false,reclaimed=false,extreme=null,reclaimTs=0;for(const x of arr){if(side==='LONG'&&x.p<level-tol){swept=true;extreme=extreme===null?x.p:Math.min(extreme,x.p)}if(side==='SHORT'&&x.p>level+tol){swept=true;extreme=extreme===null?x.p:Math.max(extreme,x.p)}if(swept&&((side==='LONG'&&x.p>=level)||(side==='SHORT'&&x.p<=level))){reclaimed=true;reclaimTs=x.ts}}return{score:swept&&reclaimed?15:0,hit:swept,reclaimed,reclaimTs,level,extreme}}
function detectRetest(s,zone,side,atr1){const a=trades.get(s)||[],t=now()-CFG.RETEST_WINDOW,arr=a.filter(x=>x.ts>=t);if(arr.length<6)return{firstTouch:false,bounce:false,retest:false,score:0,touchTs:0,retestTs:0};const tol=Math.max(atr1*CFG.RETEST_TOL_ATR,zone.p*.0003);let touch=false,bounce=false,retest=false,touchTs=0,bounceTs=0,retestTs=0,bounceExtreme=null;for(const x of arr){const near=Math.abs(x.p-zone.p)<=tol;if(!touch&&near){touch=true;touchTs=x.ts;continue}if(touch&&!bounce){const move=side==='LONG'?x.p-zone.p:zone.p-x.p;if(move>=atr1*CFG.BOUNCE_MIN_ATR){bounce=true;bounceTs=x.ts;bounceExtreme=x.p}continue}if(bounce&&x.ts>bounceTs){const near2=Math.abs(x.p-zone.p)<=tol;if(near2){retest=true;retestTs=x.ts;break}if(side==='LONG'&&x.p<zone.p-atr1*.18)break;if(side==='SHORT'&&x.p>zone.p+atr1*.18)break}}return{firstTouch:touch,bounce,retest,score:retest?20:bounce?8:touch?3:0,touchTs,bounceTs,retestTs,bounceExtreme}}
function icebergDetector(s,wall){const b=books.get(s);if(!b?.wallSnapshots?.length||!wall)return{score:0,volume:0,reloads:0};const t=now()-CFG.ICEBERG_WINDOW,snaps=b.wallSnapshots.filter(x=>x.ts>=t),side=wall.side==='LONG'?'bids':'asks';let volume=0,reloads=0,prev=0,stable=0;for(const snap of snaps){const arr=snap[side]||[],near=arr.find(x=>Math.abs(x.p-wall.p)/wall.p<.0007);if(near){if(prev>0&&near.usd<prev*.65)stable++;if(prev>0&&near.usd>Math.min(prev,wall.usd)*.9)reloads++;volume+=near.usd;prev=near.usd}}const hit=reloads>=CFG.ICEBERG_MIN_RELOADS&&volume>=CFG.ICEBERG_MIN_VOLUME&&stable>=1;return{score:hit?25:Math.min(12,reloads*5),volume,reloads,hit}}
function stackedLiquidity(s,zone,side,price){const b=books.get(s);if(!b?.valid)return{score:0,count:0,volume:0};const map=side==='LONG'?b.bids:b.asks,levels=[];for(const [p,q] of map){const dist=Math.abs(p-zone.p)/zone.p;if(dist<=CFG.STACK_MAX_DIST&&((side==='LONG'&&p<=price*1.001)||(side==='SHORT'&&p>=price*.999))){const usd=p*q;if(usd>=CFG.STACK_MIN_USD)levels.push({p,usd})}}levels.sort((a,b)=>a.p-b.p);let best=0,total=0;if(levels.length>=CFG.STACK_LEVELS){for(let i=0;i<=levels.length-CFG.STACK_LEVELS;i++){const g=levels.slice(i,i+CFG.STACK_LEVELS),span=Math.abs(g.at(-1).p-g[0].p)/zone.p;if(span<=CFG.STACK_MAX_DIST)best=Math.max(best,g.length);if(best===g.length)total=Math.max(total,g.reduce((z,x)=>z+x.usd,0))}}return{score:best>=3?Math.min(20,10+(best-3)*5):0,count:best,volume:total}}
function marketRegime(s){const m=metrics.get(s)||{},a=m.atr1||0,c=coins.get(s);if(!c||!a)return{type:'UNKNOWN',stopMult:1,adx:0,slope:0};const a15=m.atr15||a,ratio=a15? a/a15:1;let type=ratio>2?'VOLATILE':'RANGE';return{type,stopMult:type==='VOLATILE'?1.25:1,adx:0,slope:0}}
function newsLock(){const t=now();for(const e of NEWS_EVENTS){if(Math.abs(t-e.ts)<=NEWS_LOCK_MIN*60000)return e}return null}
function stateFor(s){if(!states.has(s))states.set(s,{stage:'WAIT_WALL',side:null,zone:null,wall:null,candidate:false,confidence:0,updated:0,priority:'low',lastEval:0,firstTouch:0,bounce:0,retest:0,features:null});return states.get(s)}
function priorityScore(s){const st=stateFor(s),b=books.get(s),c=coins.get(s);if(!c||!b?.valid)return 0;let p=0;if(now()-b.last<1500)p+=20;if(st.wall)p+=35;if(st.candidate)p+=40;const zs=zones.get(s)||[],price=c.price;if(zs.some(z=>Math.abs(price-z.p)/price<CFG.MAX_WALL_DIST))p+=25;const m=metrics.get(s);if(m?.htfAt&&now()-m.htfAt<CFG.TOP_REFRESH)p+=5;return p}
function rebuildPriority(){priority.high.clear();priority.mid.clear();priority.low.clear();for(const s of coins.keys()){const p=priorityScore(s);if(p>=55)priority.high.add(s);else if(p>=25)priority.mid.add(s);else priority.low.add(s)}}
function nextQueue(){const h=[...priority.high],m=[...priority.mid],l=[...priority.low];return[...h,...m,...l]}
function evaluate(s){const st=stateFor(s),c=coins.get(s),zs=zones.get(s)||[],b=books.get(s);st.candidate=false;st.wall=null;st.confidence=0;if(!c||!b?.valid||now()-b.last>CFG.BOOK_STALE){st.stage='WAIT_WALL';return}const locked=newsLock();if(locked){st.stage='NEWS_LOCK';st.features={news:locked.name};return}const price=c.price;let best=null;for(const z of zs){const dist=Math.abs(price-z.p)/price;if(dist>CFG.MAX_WALL_DIST)continue;const has4H=z.tfs.has('4H'),has1H=z.tfs.has('1H'),has15M=z.tfs.has('15M');if(mode==='entry'&&(!has4H||!has1H||!has15M))continue;if(mode==='watch'&&z.tfs.size<2)continue;const atr1=metrics.get(s)?.atr1||price*.002;for(const side of ['LONG','SHORT']){const directional=side==='LONG'?z.long>=z.short*1.5:z.short>=z.long*1.5;if(!directional)continue;const wall=bestWall(s,z,side,price);if(!wall)continue;if(wall.age<CFG.WALL_MIN_AGE){st.stage='WAIT_WALL';continue}if(wall.retained<CFG.WALL_RETENTION){st.stage='WAIT_WALL';continue}if(wall.ratio<CFG.WALL_RATIO){st.stage='WAIT_WALL';continue}st.wall=wall;st.zone=z;const f=flowStats(s,price,Number($('flowWindow').value)),opp=side==='LONG'?f.sell:f.buy,flowRatio=wall.usd?opp/wall.usd:0;if(flowRatio<CFG.ABSORB_RATIO){st.stage='WALL_CONFIRMED';continue}const sweep=detectSweep(s,z,side,atr1);const ret=detectRetest(s,z,side,atr1);const react=reaction(s,side);const spike=volumeSpike(s);const ice=icebergDetector(s,wall);const stack=stackedLiquidity(s,z,side,price);if(st.stage==='WAIT_WALL')st.stage='WALL_CONFIRMED';if(ret.firstTouch&&!ret.bounce)st.stage='FIRST_TOUCH';else if(ret.bounce&&!ret.retest)st.stage='BOUNCE';else if(ret.retest)st.stage='RETEST';const candle=oneMinuteCandle(s);const closeOK=!CFG.ONE_MIN_CONFIRM||!!candle;const stopBase=side==='LONG'?z.lo-atr1*.12:z.hi+atr1*.12;const regime=marketRegime(s);const stop=side==='LONG'?stopBase-(regime.stopMult-1)*atr1*.15:stopBase+(regime.stopMult-1)*atr1*.15,risk=Math.abs(price-stop);const target=side==='LONG'?price+Math.max(risk*2.2,atr1*.8):price-Math.max(risk*2.2,atr1*.8),rr=Math.abs(target-price)/Math.max(risk,1e-12);if(rr<CFG.MIN_RR)continue;if(side==='LONG'&&price<z.lo)continue;if(side==='SHORT'&&price>z.hi)continue;const maxChase=atr1*.55;if(side==='LONG'&&price>z.hi+maxChase)continue;if(side==='SHORT'&&price<z.lo-maxChase)continue;
const htf=Math.min(20,Math.round(z.score*.22));const wallPts=wall.age>=30000?5:4;const sweepPts=sweep.score;const flowPts=clamp(Math.round((flowRatio-CFG.ABSORB_RATIO)/.75*15),0,15);const reactPts=clamp(Math.round(react.score/35*10),0,10);const volPts=spike.score;const icePts=ice.score;let conf=htf+icePts+sweepPts+flowPts+reactPts+volPts+wallPts;if(stack.score)conf=Math.min(100,conf+stack.score);conf=Math.min(100,conf);const minConfidence=Number($('quality').value)||84;const ready=ret.retest&&sweep.reclaimed&&closeOK&&conf>=minConfidence;if(ready){st.stage='ENTRY_READY';st.candidate=true;st.updated=now();const x={side,zone:z,wall,flow:f,opp,react,price,entry:price,stop,target,rr,flowRatio,abs:flowRatio*100,confidence:conf,ice,sweep,ret,spike,stack,regime,candle,htf};if(!best||x.confidence>best.confidence)best=x}else if(ret.retest)st.stage='RETEST';if(ret.retest)st.retest=ret.retestTs;if(ret.bounce)st.bounce=ret.bounceTs;if(ret.firstTouch)st.firstTouch=ret.touchTs}}
if(!best){if(st.stage==='ENTRY_READY')st.stage='RETEST';return}st.side=best.side;st.zone=best.zone;st.wall=best.wall;st.confidence=best.confidence;st.candidate=true;st.priority='high';createSignal(s,best)}
function createSignal(s,x){const old=signals.get(s);if(old&&old.expires>now())return;if(old&&now()-old.ts<CFG.COOLDOWN)return;signals.set(s,{symbol:s,side:x.side,price:x.price,entry:x.entry,stop:x.stop,target:x.target,rr:x.rr,ts:now(),expires:now()+CFG.ENTRY_TTL,zone:x.zone,flow:x.flow,abs:x.abs,react:x.react,confidence:x.confidence,ice:x.ice,sweep:x.sweep,ret:x.ret,spike:x.spike,stack:x.stack,regime:x.regime})}
function scanPriority(){if(!running)return;rebuildPriority();const q=nextQueue(),t=now();let budget=0;for(const s of q){const st=stateFor(s),age=t-st.lastEval,interval=priority.high.has(s)?CFG.ANALYSIS_BASE:priority.mid.has(s)?700:CFG.ANALYSIS_MAX;if(age>=interval){evaluate(s);st.lastEval=t;budget++;if(budget>=45)break}}}
function stages(x){const flowOpp=x.side==='LONG'?x.flow?.sell||0:x.flow?.buy||0;return '<div class="stages"><span class="stage ok">4H ✓</span><span class="stage '+(x.zone?.tfs?.has('1H')?'ok':'warn')+'">1H '+(x.zone?.tfs?.has('1H')?'✓':'наблюдение')+'</span><span class="stage '+(x.zone?.tfs?.has('15M')?'ok':'warn')+'">15M '+(x.zone?.tfs?.has('15M')?'✓':'уточнение')+'</span><span class="stage ok">Wall 15s ✓</span><span class="stage '+(x.ret?.retest?'ok':'warn')+'">Retest '+(x.ret?.retest?'✓':'—')+'</span><span class="stage '+(x.sweep?.reclaimed?'ok':'warn')+'">Sweep '+(x.sweep?.reclaimed?'✓':'—')+'</span><span class="stage '+(x.ice?.hit?'ok':'warn')+'">Iceberg '+(x.ice?.hit?'✓':'—')+'</span><span class="stage '+((x.spike?.ratio||0)>=2?'ok':'warn')+'">RVOL '+(x.spike?.ratio||0).toFixed(1)+'x</span><span class="stage '+(flowOpp>0?'ok':'warn')+'">Поток '+fmt(flowOpp)+'</span><span class="stage '+((x.abs||0)>=10?'ok':'warn')+'">Абсорбция '+((x.abs||0).toFixed(0))+'%</span><span class="stage '+((x.stack?.count||0)>=3?'ok':'warn')+'">Stack '+((x.stack?.count||0)>=3?'✓':'—')+'</span></div>'}
function fmtPrice(v){if(!Number.isFinite(v))return '-';if(v>=100)return v.toFixed(2);if(v>=1)return v.toFixed(4);if(v>=.01)return v.toFixed(6);return v.toFixed(8)}
function cardSignal(x){const cls=x.side==='LONG'?'long':'short';return '<div class="card '+cls+'"><div class="head"><div><span class="sym">'+x.symbol+'</span> <span class="side '+cls+'">'+x.side+'</span></div><span class="badge">Confidence: '+x.confidence+'/100</span></div><div class="grid"><div class="kv"><small>ВХОД</small><b>'+fmtPrice(x.entry)+'</b></div><div class="kv"><small>СТОП</small><b>'+fmtPrice(x.stop)+'</b></div><div class="kv"><small>ТЕЙК</small><b>'+fmtPrice(x.target)+'</b></div><div class="kv"><small>RR</small><b>'+x.rr.toFixed(1)+'</b></div></div>'+stages(x)+'<div class="foot">Regime: '+(x.regime?.type||'—')+' | Iceberg: '+(x.ice?.hit?'✓':'—')+' | Sweep: '+(x.sweep?.reclaimed?'✓':'—')+' | Retest: '+(x.ret?.retest?'✓':'—')+' | Stack: '+(x.stack?.count||0)+' уровней</div></div>'}
function render(){const list=[...signals.values()].filter(x=>x.expires>now()).sort((a,b)=>b.ts-a.ts);$('cards').innerHTML=list.length?list.slice(0,CFG.MAX_CARDS).map(cardSignal).join(''):'<div class="empty">Нет ENTRY_READY. Система ждёт подтверждённый ретест.</div>';renderStats();renderDiag()}
function renderDiag(){let stale=0,valid=0;for(const b of books.values()){if(b.valid)valid++;if(b.valid&&now()-b.last>CFG.BOOK_STALE)stale++}const errors=[...metrics.values()].filter(x=>x.error).length,hi=priority.high.size,mi=priority.mid.size,lo=priority.low.size,open=[...wsDiag.sockets.values()].filter(x=>x.ws?.readyState===1).length,age=wsDiag.lastMessageAt?Math.max(0,(now()-wsDiag.lastMessageAt)/1000):null,lock=newsLock(),lines=[];for(const m of wsDiag.sockets.values())lines.push('#'+(m.id+1)+' '+(m.ws?.readyState===1?'OPEN':'CLOSED')+' | SUB '+(m.subscribed?'OK':'…')+' | SNAP '+m.snapshots+' | Δ '+m.deltas+' | TR '+m.trades);$('diag').textContent='Режим: '+(mode==='watch'?'НАБЛЮДЕНИЕ':'ВХОД')+'\nМонет: '+coins.size+' | Стаканов: '+valid+' | Устарели: '+stale+' | REST errors: '+errors+'\nОчередь: HIGH '+hi+' | MID '+mi+' | LOW '+lo+'\nWS OPEN: '+open+'/'+wsDiag.expected+' | SUB OK: '+wsDiag.subscribed+' | SUB ERR: '+wsDiag.subErrors+'\nSNAPSHOT: '+wsDiag.snapshots+' | DELTA: '+wsDiag.deltas+' | TRADES: '+wsDiag.trades+' | MSG: '+wsDiag.messages+'\nWS ERR: '+wsDiag.errors+' | JSON ERR: '+wsDiag.parseErrors+' | RECONNECT: '+wsDiag.reconnects+(age===null?'':' | last data '+age.toFixed(1)+'s ago')+'\nState Machine: WAIT_WALL → WALL_CONFIRMED → FIRST_TOUCH → BOUNCE → RETEST → ENTRY_READY\nWall: 15s | retention ≥60% | Retest + Sweep + closed 1M required\nConfidence: HTF20 + Iceberg25 + Sweep15 + Flow15 + Reaction10 + RVOL10 + Wall5 + Stack bonus\nNews Lock: '+(lock?lock.name:'OFF / no configured events')+'\n'+(wsDiag.lastSubError?'Last SUB error: '+wsDiag.lastSubError+'\n':'')+(wsDiag.lastError?'Last WS error: '+wsDiag.lastError+'\n':'')+(wsDiag.lastClose?'Last close: '+wsDiag.lastClose+'\n':'')+'TOP refresh: 15 мин | REST retry/429: включён\n--- СОКЕТЫ ---\n'+lines.join('\n')}
async function refreshTop(){if(!running)return;try{const ch=await loadCoins();const changed=ch.added.length||ch.removed.length;if(changed){for(const s of ch.removed){books.delete(s);trades.delete(s);zones.delete(s);states.delete(s);signals.delete(s)}connect();await loadAllHTF()}$('diag').textContent='TOP обновлён: '+new Date().toLocaleTimeString('ru-RU')+'\nTOP-200 | новых: '+ch.added.length+' | удалено: '+ch.removed.length;setStatus('TOP-200 обновлён | WebSocket и HTF синхронизированы')}catch(e){setStatus('Ошибка обновления TOP: '+e.message,false)}}
function startLoops(){clearInterval(scanTimer);clearInterval(renderTimer);clearInterval(topRefreshTimer);scanTimer=setInterval(scanPriority,150);renderTimer=setInterval(render,900);topRefreshTimer=setInterval(refreshTop,CFG.TOP_REFRESH)}
async function start(){if(running)return;running=true;$('startBtn').classList.add('on');setStatus('Загрузка TOP-200 и HTF-зон…');try{await loadCoins();await loadAllHTF();connect();startLoops();rebuildPriority();setStatus('V4.1 запущен: State Machine + Retest + Sweep + Iceberg + RVOL');render()}catch(e){running=false;setStatus('Ошибка запуска: '+e.message,false);$('diag').textContent=e.stack||e.message}}
function stop(){running=false;clearInterval(scanTimer);clearInterval(renderTimer);clearInterval(topRefreshTimer);clearInterval(pingTimer);clearTimeout(reconnectTimer);closeSockets();setStatus('Остановлен',false);render()}
function clearCards(){signals.clear();for(const st of states.values()){st.candidate=false;st.stage='WAIT_WALL'}$('cards').innerHTML='<div class="empty">Карточки очищены</div>';renderStats()}
$('startBtn').onclick=start;$('stopBtn').onclick=stop;$('clearBtn').onclick=clearCards;$('watchBtn').onclick=()=>{mode='watch';$('watchBtn').classList.add('active');$('entryBtn').classList.remove('active');render()};$('entryBtn').onclick=()=>{mode='entry';$('entryBtn').classList.add('active');$('watchBtn').classList.remove('active');render()};window.addEventListener('beforeunload',stop);renderStats();
</script>
