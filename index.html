<script>
"use strict";

/*
===========================================================
BYBIT INSTITUTIONAL ORDERFLOW PRO
PART 1 / 8

Архитектура:

REST
  ↓
Instruments + Tickers
  ↓
TOP-100 universe
  ↓
WebSocket
  ├── orderbook.50
  └── publicTrade
  ↓
Book engine
  ↓
Wall engine
  ↓
Trade-flow engine
  ↓
Setup engine
  ↓
Confirmation
  ↓
LONG / SHORT signal

ВАЖНО:
Не использовать одну крупную заявку как самостоятельный сигнал.
===========================================================
*/


/* ========================================================
   ОСНОВНАЯ КОНФИГУРАЦИЯ
======================================================== */

const CONFIG = {

  /* Bybit */
  CATEGORY: "linear",

  REST:
    "https://api.bybit.com",

  WS:
    "wss://stream.bybit.com/v5/public/linear",


  /* Universe */
  TOP: 100,

  /* Orderbook */
  DEPTH: 50,

  BOOK_STALE: 5000,

  /* Trades */
  TRADE_STALE: 5000,

  TRADE_WINDOW: 20000,

  FAST_WINDOW: 5000,

  BASELINE_WINDOW: 120000,


  /* Buffers */
  MAX_TRADES: 1200,

  MAX_BOOK_LEVELS: 70,


  /* Wall detection */

  WALL_MIN_AGE: 3500,

  WALL_TTL: 30000,

  WALL_MIN_SAMPLES: 3,

  WALL_RATIO: 3,

  WALL_MAX_DIST: 0.008,

  WALL_MIN_DIST: 0.0004,


  /*
  Расстояние, при котором цена считается
  приблизившейся к стене.
  */

  TEST_DIST: 0.0018,

  /*
  Максимальное расстояние для оценки реакции.
  */

  REACTION_DIST: 0.0025,


  /* Flow */

  MIN_FLOW: 20000,

  MIN_FAST_FLOW: 5000,

  MIN_ATTACK: 8000,


  /* Confirmation */

  MIN_ABSORB: 40,

  MIN_REACTION: 35,

  MIN_QUALITY: 64,

  MIN_MARGIN: 8,


  /*
  Защита от повторных и противоположных
  сигналов.
  */

  COOLDOWN: 90000,

  RETEST_TIMEOUT: 90000,

  SIGNAL_TTL: 900000,


  /* Engine */

  SCAN_MS: 350,

  MANAGER_MS: 300,

  UI_MS: 800,


  /*
  Подписки разбиваются на небольшие группы.
  Это важно для Safari/iPhone.
  */

  WS_GROUP: 10,

  WS_GROUP_DELAY: 120,


  /* WebSocket */

  PING_MS: 20000,

  SOCKET_STALE: 15000,

  RECONNECT_BASE: 1000,

  RECONNECT_MAX: 15000,


  /* Higher timeframe */

  HTF_MS: 900000,


  /* Paper engine */

  PAPER_NOTIONAL: 1000,

  FEE: 0.00055,

  SLIPPAGE_BPS: 2,

  MAX_HOLD: 1200000,

  MAX_JOURNAL: 1000,


  /* Debug */

  DEBUG: false
};


/* ========================================================
   ГЛОБАЛЬНОЕ СОСТОЯНИЕ
======================================================== */

/*
Информация по контрактам.
*/
const instruments = new Map();


/*
Ticker / market data.
*/
const market = new Map();


/*
Orderbook:

{
  bids,
  asks,
  updateId,
  seq,
  checksum,
  lastRx,
  lastExchange,
  synced,
  valid,
  latency,
  spread,
  mid
}
*/
const books = new Map();


/*
Trades:

{
  items: [],
  lastRx,
  lastExchange
}
*/
const trades = new Map();


/*
История стен.
*/
const walls = new Map();


/*
Состояние setup.

IDLE
WATCH
CONFIRM
SIGNAL
COOLDOWN
*/
const setups = new Map();


/*
HTF context.
*/
const htf = new Map();


/*
Paper positions.
*/
const paper = new Map();


/*
Cooldowns.
*/
const cooldowns = new Map();


/*
Журнал событий.
*/
const journal = [];


/* ========================================================
   WEBSOCKET STATE
======================================================== */

let sockets = [];

let running = false;

let mode = "BALANCED";

let scanCursor = 0;

let scanTimer = 0;

let managerTimer = 0;

let uiTimer = 0;

let universeTimer = 0;

let htfTimer = 0;

let reconnectTimer = 0;

let pingTimer = 0;

let watchdogTimer = 0;

let lastEngine = 0;

let lastRender = 0;

let lastUniverse = 0;

let lastHTF = 0;

let startedAt = 0;

let globalErrors = 0;


/*
Количество активных WS subscriptions.
*/
let subscribedSymbols = new Set();


/*
Последняя ошибка engine.
*/
let lastError = "";


/*
Последнее изменение universe.
*/
let universeVersion = 0;


/* ========================================================
   DOM
======================================================== */

const $ = id => document.getElementById(id);

const statusEl = $("status");

const dotEl = $("dot");


/* ========================================================
   БАЗОВЫЕ УТИЛИТЫ
======================================================== */

const now = () => Date.now();


const num = (x, d = 0) => {

  const n = Number(x);

  return Number.isFinite(n) ? n : d;

};


const clamp = (x, a, b) => {

  return Math.max(a, Math.min(b, x));

};


const sleep = ms => {

  return new Promise(resolve => setTimeout(resolve, ms));

};


const fmtUsd = x => {

  x = num(x);

  const ax = Math.abs(x);

  if(ax >= 1000000){
    return `$${(x / 1000000).toFixed(2)}M`;
  }

  if(ax >= 1000){
    return `$${(x / 1000).toFixed(1)}K`;
  }

  return `$${x.toFixed(0)}`;

};


const fmtPrice = (symbol, value) => {

  const tick = num(
    instruments.get(symbol)?.tickSize,
    0.000001
  );

  let decimals = 6;

  if(tick >= 1){
    decimals = 0;
  }else if(tick >= 0.1){
    decimals = 1;
  }else if(tick >= 0.01){
    decimals = 2;
  }else if(tick >= 0.001){
    decimals = 3;
  }

  return num(value).toFixed(decimals);

};


const pct = (a, b) => {

  b = num(b);

  return b ? ((num(a) - b) / b) * 100 : 0;

};


const dist = (a, b) => {

  b = num(b);

  return b ? Math.abs(num(a) - b) / b : 1;

};


/* ========================================================
   STATUS
======================================================== */

function setStatus(text, on = running){

  statusEl.textContent = text;

  dotEl.style.background =
    on ? "#35c978" : "#777";

}


/* ========================================================
   DATA OBJECT FACTORIES
======================================================== */

function ensureBook(symbol){

  if(!books.has(symbol)){

    books.set(symbol, {

      bids: new Map(),

      asks: new Map(),

      updateId: 0,

      seq: 0,

      checksum: 0,

      lastRx: 0,

      lastExchange: 0,

      synced: false,

      valid: false,

      latency: 0,

      spread: 0,

      mid: 0

    });

  }

  return books.get(symbol);

}


function ensureTrades(symbol){

  if(!trades.has(symbol)){

    trades.set(symbol, {

      items: [],

      lastRx: 0,

      lastExchange: 0

    });

  }

  return trades.get(symbol);

}


function ensureWalls(symbol){

  if(!walls.has(symbol)){
    walls.set(symbol, new Map());
  }

  return walls.get(symbol);

}


function ensureSetup(symbol){

  if(!setups.has(symbol)){

    setups.set(symbol, {

      state: "IDLE",

      direction: null,

      wall: null,

      created: 0,

      updated: 0,

      signal: null,

      quality: 0,

      expires: 0,

      retest: false,

      reason: "",

      lastPrice: 0,

      lastWallPrice: 0,

      confirmation: 0,

      invalidReason: ""

    });

  }

  return setups.get(symbol);

}


function ensureHTF(symbol){

  if(!htf.has(symbol)){

    htf.set(symbol, {

      samples: [],

      trend: "NEUTRAL",

      score: 0,

      lastUpdate: 0

    });

  }

  return htf.get(symbol);

}


function ensurePaper(symbol){

  if(!paper.has(symbol)){

    paper.set(symbol, {

      side: null,

      entry: 0,

      qty: 0,

      opened: 0,

      wallPrice: 0,

      reason: "",

      peak: 0,

      trough: 0,

      pnl: 0,

      fees: 0,

      closed: 0

    });

  }

  return paper.get(symbol);

}


/* ========================================================
   MARKET HELPERS
======================================================== */

function currentPrice(symbol){

  const ticker =
    num(market.get(symbol)?.lastPrice);

  if(ticker > 0){
    return ticker;
  }

  return num(
    books.get(symbol)?.mid
  );

}


function universe(){

  return [...market.values()]

    .filter(x =>
      x.trading &&
      /USDT$/.test(x.symbol)
    )

    .sort(
      (a, b) =>
        num(b.turnover) -
        num(a.turnover)
    )

    .slice(0, CONFIG.TOP);

}


function freshBook(symbol){

  const b = books.get(symbol);

  return !!b &&
         b.synced &&
         b.valid &&
         now() - b.lastRx <= CONFIG.BOOK_STALE;

}


function freshTrades(symbol){

  const t = trades.get(symbol);

  return !!t &&
         t.items.length > 0 &&
         now() - t.lastRx <= CONFIG.TRADE_STALE;

}


/* ========================================================
   RESET SYMBOL
======================================================== */

function resetSymbol(symbol){

  books.delete(symbol);

  trades.delete(symbol);

  walls.delete(symbol);

  setups.delete(symbol);

  htf.delete(symbol);

  paper.delete(symbol);

  cooldowns.delete(symbol);

}


/* ========================================================
   JOURNAL
======================================================== */

function logEvent(type, symbol, data = {}){

  journal.push({

    ts: now(),

    type,

    symbol,

    ...data

  });

  if(journal.length > CONFIG.MAX_JOURNAL){

    journal.splice(
      0,
      journal.length - CONFIG.MAX_JOURNAL
    );

  }

}


/* ========================================================
   ERROR HANDLER
======================================================== */

function engineError(error){

  globalErrors++;

  lastError =
    error?.message ||
    String(error);

  if(CONFIG.DEBUG){

    console.error(
      "[ENGINE]",
      error
    );

  }

}


/* ========================================================
   STARTUP PLACEHOLDER
======================================================== */

/*
Фактический START будет подключён
в последующих частях после создания
REST + WebSocket engine.
*/
/* ========================================================
   REST ENGINE
======================================================== */

async function rest(path, params = {}){

  const url = new URL(CONFIG.REST + path);

  for(const [key, value] of Object.entries(params)){

    if(value === undefined || value === null){
      continue;
    }

    url.searchParams.set(
      key,
      String(value)
    );

  }

  const controller = new AbortController();

  const timeout = setTimeout(
    () => controller.abort(),
    8000
  );

  try{

    const started = now();

    const response = await fetch(
      url.toString(),
      {
        method:"GET",
        cache:"no-store",
        signal:controller.signal,
        headers:{
          "Accept":"application/json"
        }
      }
    );

    if(!response.ok){

      throw new Error(
        `REST HTTP ${response.status}`
      );

    }

    const json = await response.json();

    if(
      !json ||
      num(json.retCode) !== 0
    ){

      throw new Error(
        json?.retMsg ||
        `Bybit retCode ${json?.retCode}`
      );

    }

    return {
      result: json.result || {},
      latency: now() - started
    };

  }catch(error){

    engineError(error);

    throw error;

  }finally{

    clearTimeout(timeout);

  }

}


/* ========================================================
   INSTRUMENTS
======================================================== */

async function loadInstruments(){

  let cursor = "";

  let pages = 0;

  let loaded = 0;

  do{

    const params = {

      category: CONFIG.CATEGORY,

      limit: 1000

    };

    if(cursor){
      params.cursor = cursor;
    }

    const response =
      await rest(
        "/v5/market/instruments-info",
        params
      );

    const list =
      response.result?.list || [];

    for(const item of list){

      if(
        item.contractType !==
        "LinearPerpetual"
      ){
        continue;
      }

      if(
        item.quoteCoin !== "USDT"
      ){
        continue;
      }

      const symbol =
        String(item.symbol || "");

      if(!symbol){
        continue;
      }

      const priceFilter =
        item.priceFilter || {};

      const lotFilter =
        item.lotSizeFilter || {};

      const tickSize =
        num(
          priceFilter.tickSize,
          0.000001
        );

      const minQty =
        num(
          lotFilter.minOrderQty,
          0
        );

      const qtyStep =
        num(
          lotFilter.qtyStep,
          minQty
        );

      const minNotional =
        num(
          lotFilter.minNotionalValue,
          0
        );

      let maxLeverage = 1;

      /*
       Некоторые версии ответа Bybit могут
       содержать leverageFilter, а некоторые
       дополнительные поля могут отсутствовать.
       Поэтому отсутствие поля не считается
       ошибкой.
      */

      if(item.leverageFilter){

        maxLeverage =
          num(
            item.leverageFilter.maxLeverage,
            1
          );

      }

      instruments.set(
        symbol,
        {

          symbol,

          trading:
            item.status === "Trading",

          tickSize,

          minQty,

          qtyStep,

          minNotional,

          maxLeverage,

          baseCoin:
            item.baseCoin || "",

          quoteCoin:
            item.quoteCoin || "USDT",

          contractType:
            item.contractType || "",

          updated: now()

        }
      );

      loaded++;

    }

    cursor =
      response.result?.nextPageCursor ||
      "";

    pages++;

    /*
     Защита от потенциального бесконечного
     цикла при некорректном cursor.
    */

    if(pages >= 20){
      break;
    }

  }while(cursor);

  logEvent(
    "INSTRUMENTS_LOADED",
    "",
    {
      loaded,
      total: instruments.size
    }
  );

  return instruments.size;

}


/* ========================================================
   TICKERS
======================================================== */

async function loadTickers(){

  const response =
    await rest(
      "/v5/market/tickers",
      {
        category: CONFIG.CATEGORY
      }
    );

  const list =
    response.result?.list || [];

  let updated = 0;

  for(const item of list){

    const symbol =
      String(item.symbol || "");

    const instrument =
      instruments.get(symbol);

    if(!instrument){
      continue;
    }

    const previous =
      market.get(symbol) || {};

    const turnover =
      num(item.turnover24h);

    const volume =
      num(item.volume24h);

    const lastPrice =
      num(item.lastPrice);

    const markPrice =
      num(item.markPrice);

    const indexPrice =
      num(item.indexPrice);

    const priceChange =
      num(item.price24hPcnt);

    const funding =
      num(item.fundingRate);

    const openInterest =
      num(item.openInterest);

    const openInterestValue =
      num(item.openInterestValue);

    market.set(
      symbol,
      {

        ...previous,

        symbol,

        lastPrice,

        markPrice,

        indexPrice,

        turnover,

        volume,

        change24:
          priceChange * 100,

        funding,

        oi:
          openInterest,

        oiValue:
          openInterestValue,

        trading:
          instrument.trading,

        rx:
          now()

      }
    );

    updated++;

  }

  universeVersion++;

  lastUniverse = now();

  logEvent(
    "TICKERS_UPDATED",
    "",
    {
      updated,
      marketSize: market.size,
      universeVersion
    }
  );

  return updated;

}


/* ========================================================
   MARKET INITIALIZATION
======================================================== */

async function initializeMarket(){

  /*
   Сначала инструменты.
  */

  await loadInstruments();

  /*
   Затем тикеры.
  */

  await loadTickers();

  /*
   Проверяем, что получили достаточное
   количество инструментов.
  */

  if(instruments.size === 0){

    throw new Error(
      "Bybit instruments пуст"
    );

  }

  if(market.size === 0){

    throw new Error(
      "Bybit tickers пуст"
    );

  }

  const u =
    universe();

  if(u.length === 0){

    throw new Error(
      "TOP universe пуст"
    );

  }

  logEvent(
    "MARKET_READY",
    "",
    {
      instruments:
        instruments.size,

      market:
        market.size,

      universe:
        u.length
    }
  );

  return u;

}


/* ========================================================
   UNIVERSE INFORMATION
======================================================== */

function getUniverseSymbols(){

  return universe()
    .map(x => x.symbol);

}


function getUniverseRank(symbol){

  const list =
    universe();

  const index =
    list.findIndex(
      x => x.symbol === symbol
    );

  return index >= 0
    ? index + 1
    : 999;

}


/* ========================================================
   ADAPTIVE LIQUIDITY
======================================================== */

/*
  Важный принцип:

  Мы НЕ говорим:

      "для каждой монеты стена должна быть $250k"

  Вместо этого используем несколько факторов:

  1. 24h turnover
  2. локальная ликвидность orderbook
  3. ранг монеты
  4. тип монеты

  Реальный локальный расчёт будет работать
  после появления orderbook.

  Поэтому здесь только базовая часть.
*/


function turnoverTier(turnover){

  turnover =
    num(turnover);

  if(turnover >= 2_000_000_000){
    return {
      name:"ULTRA",
      baseWall:150000,
      flow:45000
    };
  }

  if(turnover >= 1_000_000_000){
    return {
      name:"MAJOR",
      baseWall:110000,
      flow:33000
    };
  }

  if(turnover >= 500_000_000){
    return {
      name:"HIGH",
      baseWall:80000,
      flow:24000
    };
  }

  if(turnover >= 200_000_000){
    return {
      name:"MEDIUM_HIGH",
      baseWall:55000,
      flow:17000
    };
  }

  if(turnover >= 100_000_000){
    return {
      name:"MEDIUM",
      baseWall:35000,
      flow:11000
    };
  }

  if(turnover >= 30_000_000){
    return {
      name:"ALT",
      baseWall:22000,
      flow:7000
    };
  }

  return {
    name:"LOWER_ALT",
    baseWall:12000,
    flow:4000
  };

}


/* ========================================================
   BASE WALL THRESHOLD
======================================================== */

function baseWallThreshold(symbol){

  const m =
    market.get(symbol);

  if(!m){
    return 10000;
  }

  const tier =
    turnoverTier(
      m.turnover
    );

  /*
   Небольшой дополнительный коэффициент
   для ранга.

   Чем ниже ликвидность,
   тем меньше абсолютный порог.
  */

  const rank =
    getUniverseRank(symbol);

  let rankFactor = 1;

  if(rank <= 10){
    rankFactor = 1.30;
  }else if(rank <= 20){
    rankFactor = 1.15;
  }else if(rank <= 50){
    rankFactor = 1.00;
  }else{
    rankFactor = 0.82;
  }

  return Math.max(
    10000,
    tier.baseWall * rankFactor
  );

}


/* ========================================================
   BASE FLOW THRESHOLD
======================================================== */

function baseFlowThreshold(symbol){

  const m =
    market.get(symbol);

  if(!m){
    return CONFIG.MIN_FLOW;
  }

  const tier =
    turnoverTier(
      m.turnover
    );

  const rank =
    getUniverseRank(symbol);

  let factor = 1;

  if(rank <= 10){
    factor = 1.20;
  }else if(rank <= 20){
    factor = 1.05;
  }else if(rank <= 50){
    factor = 0.90;
  }else{
    factor = 0.75;
  }

  return Math.max(
    3000,
    tier.flow * factor
  );

}


/* ========================================================
   MARKET SNAPSHOT
======================================================== */

function marketSnapshot(symbol){

  const m =
    market.get(symbol);

  if(!m){
    return null;
  }

  const instrument =
    instruments.get(symbol);

  return {

    symbol,

    price:
      num(m.lastPrice),

    mark:
      num(m.markPrice),

    index:
      num(m.indexPrice),

    turnover:
      num(m.turnover),

    volume:
      num(m.volume),

    change24:
      num(m.change24),

    funding:
      num(m.funding),

    oi:
      num(m.oi),

    oiValue:
      num(m.oiValue),

    rank:
      getUniverseRank(symbol),

    baseWall:
      baseWallThreshold(symbol),

    baseFlow:
      baseFlowThreshold(symbol),

    tickSize:
      num(
        instrument?.tickSize,
        0.000001
      )

  };

}


/* ========================================================
   VALID UNIVERSE CHECK
======================================================== */

function validUniverse(){

  const list =
    universe();

  return list.filter(
    item => {

      const symbol =
        item.symbol;

      const instrument =
        instruments.get(symbol);

      return !!instrument &&
             instrument.trading &&
             num(item.lastPrice) > 0 &&
             num(item.turnover) > 0;

    }
  );

}


/* ========================================================
   UNIVERSE DIAGNOSTICS
======================================================== */

function universeDiagnostics(){

  const list =
    validUniverse();

  const ranks = {

    top10:0,

    top20:0,

    top50:0,

    top100:0

  };

  for(let i=0;i<list.length;i++){

    const rank = i + 1;

    if(rank <= 10){
      ranks.top10++;
    }

    if(rank <= 20){
      ranks.top20++;
    }

    if(rank <= 50){
      ranks.top50++;
    }

    if(rank <= 100){
      ranks.top100++;
    }

  }

  return {

    total:
      list.length,

    ...ranks

  };

}


/* ========================================================
   PERIODIC MARKET REFRESH
======================================================== */

async function refreshUniverse(){

  if(!running){
    return;
  }

  try{

    await loadTickers();

    const list =
      validUniverse();

    if(!list.length){

    /*

     будет сравнивать этот список

    */

      "UNIVERSE_REFRESH",

  /* ========================================================
   WEBSOCKET ENGINE
======================================================== */

/*
  Каждый сокет отвечает только за свою группу символов.

  На один символ подписываем:

    orderbook.50.SYMBOL
    publicTrade.SYMBOL

  При рассинхронизации orderbook:
    1. книга помечается invalid;
    2. локальные bids/asks очищаются;
    3. ждём новый snapshot;
    4. только после snapshot снова разрешаем анализ.
*/


function wsTopicBook(symbol){

  return `orderbook.${CONFIG.DEPTH}.${symbol}`;

}


function wsTopicTrade(symbol){

  return `publicTrade.${symbol}`;

}


/* ========================================================
   BOOK UTILITIES
======================================================== */

function clearBook(symbol){

  const b =
    ensureBook(symbol);

  b.bids.clear();
  b.asks.clear();

  b.updateId = 0;
  b.seq = 0;
  b.checksum = 0;

  b.synced = false;
  b.valid = false;

  b.spread = 0;
  b.mid = 0;

}


function setBookLevel(map, price, qty){

  const p = num(price);
  const q = num(qty);

  if(
    !Number.isFinite(p) ||
    p <= 0
  ){
    return;
  }

  if(
    !Number.isFinite(q) ||
    q <= 0
  ){

    map.delete(p);

    return;

  }

  map.set(p, q);

}


/* ========================================================
   BOOK NORMALIZATION
======================================================== */

function trimBookMap(map, maxLevels = CONFIG.MAX_BOOK_LEVELS){

  if(map.size <= maxLevels){
    return;
  }

  const entries =
    [...map.entries()];

  /*
    Для bids оставляем самые дорогие уровни,
    для asks это отдельно делается ниже.
  */

  entries.sort(
    (a,b) => b[0] - a[0]
  );

  while(
    entries.length > maxLevels
  ){

    const item =
      entries.pop();

    map.delete(item[0]);

  }

}


/* ========================================================
   BEST BID / ASK
======================================================== */

function bestBid(symbol){

  const b =
    books.get(symbol);

  if(
    !b ||
    !b.bids.size
  ){
    return 0;
  }

  let best = 0;

  for(const price of b.bids.keys()){

    if(price > best){
      best = price;
    }

  }

  return best;

}


function bestAsk(symbol){

  const b =
    books.get(symbol);

  if(
    !b ||
    !b.asks.size
  ){
    return 0;
  }

  let best = Infinity;

  for(const price of b.asks.keys()){

    if(price < best){
      best = price;
    }

  }

  return Number.isFinite(best)
    ? best
    : 0;

}


/* ========================================================
   BOOK METRICS
======================================================== */

function updateBookMetrics(symbol){

  const b =
    ensureBook(symbol);

  const bid =
    bestBid(symbol);

  const ask =
    bestAsk(symbol);

  if(
    bid <= 0 ||
    ask <= 0 ||
    ask < bid
  ){

    b.spread = 0;
    b.mid = 0;

    return;

  }

  b.spread =
    ((ask - bid) / bid) * 100;

  b.mid =
    (bid + ask) / 2;

}


/* ========================================================
   SNAPSHOT
======================================================== */

function applyBookSnapshot(symbol, data){

  if(
    !Array.isArray(data?.b) ||
    !Array.isArray(data?.a)
  ){
    return false;
  }

  const b =
    ensureBook(symbol);

  b.bids.clear();
  b.asks.clear();

  for(const level of data.b){

    if(
      !Array.isArray(level) ||
      level.length < 2
    ){
      continue;
    }

    setBookLevel(
      b.bids,
      level[0],
      level[1]
    );

  }

  for(const level of data.a){

    if(
      !Array.isArray(level) ||
      level.length < 2
    ){
      continue;
    }

    setBookLevel(
      b.asks,
      level[0],
      level[1]
    );

  }

  trimBookMap(b.bids);
  trimBookMap(b.asks);

  b.updateId =
    num(data.u);

  b.seq =
    num(data.seq);

  b.checksum =
    num(data.checksum);

  b.lastExchange =
    num(data.ts);

  b.lastRx =
    now();

  b.latency =
    data.ts
      ? Math.max(
          0,
          now() - num(data.ts)
        )
      : 0;

  updateBookMetrics(symbol);

  const bid =
    bestBid(symbol);

  const ask =
    bestAsk(symbol);

  b.synced =
    bid > 0 &&
    ask > 0 &&
    ask >= bid;

  b.valid =
    b.synced &&
    b.bids.size > 0 &&
    b.asks.size > 0;

  return b.valid;

}


/* ========================================================
   DELTA
======================================================== */

function applyBookDelta(symbol, data){

  const b =
    ensureBook(symbol);

  /*
    Нельзя применять delta к книге,
    которая ещё не получила snapshot.
  */

  if(!b.synced){

    return false;

  }

  /*
    Проверка sequence.

    Bybit v5 может передавать u/seq.
    Если sequence явно нарушен,
    безопаснее полностью пересобрать книгу.
  */

  const incomingSeq =
    num(data.seq);

  if(
    incomingSeq &&
    b.seq &&
    incomingSeq < b.seq
  ){

    clearBook(symbol);

    return false;

  }

  if(
    Array.isArray(data.b)
  ){

    for(const level of data.b){

      if(
        !Array.isArray(level) ||
        level.length < 2
      ){
        continue;
      }

      setBookLevel(
        b.bids,
        level[0],
        level[1]
      );

    }

  }

  if(
    Array.isArray(data.a)
  ){

    for(const level of data.a){

      if(
        !Array.isArray(level) ||
        level.length < 2
      ){
        continue;
      }

      setBookLevel(
        b.asks,
        level[0],
        level[1]
      );

    }

  }

  trimBookMap(b.bids);
  trimBookMap(b.asks);

  if(num(data.u)){
    b.updateId =
      num(data.u);
  }

  if(incomingSeq){
    b.seq =
      incomingSeq;
  }

  if(num(data.ts)){
    b.lastExchange =
      num(data.ts);
  }

  b.lastRx =
    now();

  b.latency =
    data.ts
      ? Math.max(
          0,
          now() - num(data.ts)
        )
      : 0;

  updateBookMetrics(symbol);

  const bid =
    bestBid(symbol);

  const ask =
    bestAsk(symbol);

  b.valid =
    b.synced &&
    bid > 0 &&
    ask > 0 &&
    ask >= bid;

  return b.valid;

}


/* ========================================================
   TRADE PARSER
======================================================== */

function parsePublicTrade(symbol, item){

  if(!Array.isArray(item)){
    return;
  }

  /*
    Bybit publicTrade:

    {
      T: timestamp,
      s: symbol,
      S: Buy/Sell,
      v: quantity,
      p: price,
      L: tick direction,
      i: trade id,
      BT: block trade
    }
  */

  const price =
    num(item.p);

  const qty =
    num(item.v);

  const side =
    item.S;

  const exchangeTs =
    num(item.T);

  if(
    price <= 0 ||
    qty <= 0
  ){
    return;
  }

  addTrade(
    symbol,
    price,
    qty,
    side,
    now(),
    exchangeTs
  );

}


/* ========================================================
   TRADE BUFFER
======================================================== */

function addTrade(
  symbol,
  price,
  qty,
  side,
  receivedTs,
  exchangeTs = 0
){

  const t =
    ensureTrades(symbol);

  const p =
    num(price);

  const q =
    num(qty);

  if(
    p <= 0 ||
    q <= 0
  ){
    return;
  }

  const value =
    p * q;

  if(
    !Number.isFinite(value) ||
    value <= 0
  ){
    return;
  }

  let direction =
    "UNKNOWN";

  if(
    side === "Buy" ||
    side === "BUY"
  ){
    direction = "BUY";
  }

  if(
    side === "Sell" ||
    side === "SELL"
  ){
    direction = "SELL";
  }

  t.items.push({

    ts:
      num(receivedTs, now()),

    exchangeTs:
      num(exchangeTs, 0),

    price:p,

    qty:q,

    value,

    side:direction

  });

  t.lastRx =
    now();

  if(exchangeTs){

    t.lastExchange =
      exchangeTs;

  }

  /*
    Не позволяем буферу
    бесконечно расти.
  */

  cleanTrades(symbol);

}


/* ========================================================
   TRADE CLEANUP
======================================================== */

function cleanTrades(symbol){

  const t =
    trades.get(symbol);

  if(!t){
    return;
  }

  const cutoff =
    now() -
    Math.max(
      CONFIG.TRADE_WINDOW,
      CONFIG.BASELINE_WINDOW
    );

  /*
    Сначала удаляем старые записи.
  */

  while(
    t.items.length &&
    t.items[0].ts < cutoff
  ){

    t.items.shift();

  }

  /*
    Второй уровень защиты.
  */

  if(
    t.items.length >
    CONFIG.MAX_TRADES
  ){

    t.items =
      t.items.slice(
        -CONFIG.MAX_TRADES
      );

  }

}


/* ========================================================
   SOCKET GROUPS
======================================================== */

function makeGroups(symbols, size){

  const groups = [];

  for(
    let i = 0;
    i < symbols.length;
    i += size
  ){

    groups.push(
      symbols.slice(
        i,
        i + size
      )
    );

  }

  return groups;

}


/* ========================================================
   SOCKET SUBSCRIBE MESSAGE
======================================================== */

function subscriptionArgs(symbols){

  const args = [];

  for(const symbol of symbols){

    args.push(
      wsTopicBook(symbol)
    );

    args.push(
      wsTopicTrade(symbol)
    );

  }

  return args;

}


/* ========================================================
   SOCKET CREATION
======================================================== */

function createSocket(group, index){

  return new Promise(resolve => {

    const ws =
      new WebSocket(CONFIG.WS);

    const socketState = {

      ws,

      index,

      group,

      connected:false,

      subscribed:false,

      lastMessage:now(),

      lastPing:0,

      closed:false,

      reconnecting:false

    };

    sockets.push(socketState);

    ws.onopen = () => {

      socketState.connected =
        true;

      socketState.lastMessage =
        now();

      const args =
        subscriptionArgs(group);

      try{

        ws.send(
          JSON.stringify({

            op:"subscribe",

            args

          })
        );

        socketState.subscribed =
          true;

        for(const symbol of group){

          subscribedSymbols.add(
            symbol
          );

        }

        resolve(true);

      }catch(error){

        engineError(error);

        resolve(false);

      }

    };


    ws.onmessage = event => {

      socketState.lastMessage =
        now();

      handleSocketMessage(
        socketState,
        event.data
      );

    };


    ws.onerror = error => {

      socketState.connected =
        false;

      globalErrors++;

      if(CONFIG.DEBUG){

        console.warn(
          "WebSocket error",
          index,
          error
        );

      }

    };


    ws.onclose = () => {

      socketState.connected =
        false;

      socketState.subscribed =
        false;

      /*
        Удаляем подписки этой группы.
      */

      for(const symbol of group){

        subscribedSymbols.delete(
          symbol
        );

      }

      if(
        running &&
        !socketState.reconnecting
      ){

        socketState.reconnecting =
          true;

        scheduleSocketReconnect(
          socketState
        );

      }

    };

  });

}


/* ========================================================
   SOCKET RECONNECT
======================================================== */

function scheduleSocketReconnect(state){

  const delay =
    Math.min(
      CONFIG.RECONNECT_MAX,
      CONFIG.RECONNECT_BASE *
      Math.max(
        1,
        Math.pow(
          2,
          Math.min(
            4,
            globalErrors % 5
          )
        )
      )
    );

  setTimeout(
    async () => {

      if(!running){
        return;
      }

      try{

        /*
          Старый socket больше не используем.
        */

        try{
          state.ws.close();
        }catch(_){}

        const position =
          sockets.indexOf(state);

        const fresh =
          new WebSocket(CONFIG.WS);

        const replacement = {

          ws:fresh,

          index:state.index,

          group:state.group,

          connected:false,

          subscribed:false,

          lastMessage:now(),

          lastPing:0,

          closed:false,

          reconnecting:false

        };

        if(position >= 0){

          sockets[position] =
            replacement;

        }else{

          sockets.push(
            replacement
          );

        }

        fresh.onopen = () => {

          replacement.connected =
            true;

          replacement.lastMessage =
            now();

          try{

            fresh.send(
              JSON.stringify({

                op:"subscribe",

                args:
                  subscriptionArgs(
                    replacement.group
                  )

              })
            );

            replacement.subscribed =
              true;

            for(
              const symbol of
              replacement.group
            ){

              /*
                После reconnect orderbook
                будет ожидать новый snapshot.
              */

              clearBook(symbol);

              subscribedSymbols.add(
                symbol
              );

            }

          }catch(error){

            engineError(error);

          }

        };

        fresh.onmessage = event => {

          replacement.lastMessage =
            now();

          handleSocketMessage(
            replacement,
            event.data
          );

        };

        fresh.onerror = () => {

          replacement.connected =
            false;

        };

        fresh.onclose = () => {

          replacement.connected =
            false;

          replacement.subscribed =
            false;

          for(
            const symbol of
            replacement.group
          ){

            subscribedSymbols.delete(
              symbol
            );

          }

          if(
            running &&
            !replacement.reconnecting
          ){

            replacement.reconnecting =
              true;

            scheduleSocketReconnect(
              replacement
            );

          }

        };

      }catch(error){

        engineError(error);

      }

    },
    delay
  );

}


/* ========================================================
   SOCKET MESSAGE HANDLER
======================================================== */

function handleSocketMessage(
  socketState,
  raw
){

  let message;

  try{

    message =
      typeof raw === "string"
        ? JSON.parse(raw)
        : raw;

  }catch(error){

    engineError(error);

    return;

  }

  if(!message){
    return;
  }

  /*
    Pong.
  */

  if(
    message.op === "pong"
  ){

    socketState.lastMessage =
      now();

    return;

  }

  /*
    Subscription confirmation.
  */

  if(
    message.op === "subscribe"
  ){

    return;

  }

  /*
    Errors from Bybit.
  */

  if(
    message.success === false
  ){

    globalErrors++;

    if(CONFIG.DEBUG){

      console.warn(
        "Bybit WS error",
        message
      );

    }

    return;

  }

  const topic =
    String(message.topic || "");

  const data =
    message.data;

  if(!topic || !data){
    return;
  }


  /* ------------------------------------------------------
     ORDERBOOK
  ------------------------------------------------------ */

  if(
    topic.startsWith("orderbook.")
  ){

    const symbol =
      String(
        data.s ||
        topic.split(".").pop() ||
        ""
      );

    if(!symbol){
      return;
    }

    const type =
      message.type ||
      "";

    let ok = false;

    if(type === "snapshot"){

      ok =
        applyBookSnapshot(
          symbol,
          data
        );

    }else if(type === "delta"){

      ok =
        applyBookDelta(
          symbol,
          data
        );

    }else{

      /*
        Если type отсутствует,
        безопасно определяем наличие
        полноценного snapshot.

        Приоритет snapshot.
      */

      if(
        Array.isArray(data.b) &&
        Array.isArray(data.a) &&
        !ensureBook(symbol).synced
      ){

        ok =
          applyBookSnapshot(
            symbol,
            data
          );

      }else{

        ok =
          applyBookDelta(
            symbol,
            data
          );

      }

    }

    if(!ok){

      /*
        Рассинхронизация не должна
        генерировать торговый сигнал.
      */

      const b =
        ensureBook(symbol);

      b.valid =
        false;

    }

    return;

  }


  /* ------------------------------------------------------
     PUBLIC TRADE
  ------------------------------------------------------ */

  if(
    topic.startsWith("publicTrade.")
  ){

    const list =
      Array.isArray(data)
        ? data
        : [];

    for(const item of list){

      const symbol =
        String(
          item?.s ||
          topic.split(".").pop() ||
          ""
        );

      if(!symbol){
        continue;
      }

      parsePublicTrade(
        symbol,
        item
      );

    }

  }

}


/* ========================================================
   START ALL SOCKETS
======================================================== */

async function startSockets(){

  const symbols =
    getUniverseSymbols();

  if(!symbols.length){

    throw new Error(
      "Невозможно открыть WebSocket: TOP universe пуст"
    );

  }

  /*
    На всякий случай очищаем
    старые подписки.
  */

  subscribedSymbols.clear();

  const groups =
    makeGroups(
      symbols,
      CONFIG.WS_GROUP
    );

  /*
    Создаём соединения последовательно,
    а не одновременно.

    Для iPhone это заметно безопаснее.
  */

  for(
    let i = 0;
    i < groups.length;
    i++
  ){

    if(!running){
      break;
    }

    await createSocket(
      groups[i],
      i
    );

    if(
      CONFIG.WS_GROUP_DELAY > 0
    ){

      await sleep(
        CONFIG.WS_GROUP_DELAY
      );

    }

  }

  logEvent(
    "WS_STARTED",
    "",
    {
      symbols:symbols.length,
      groups:groups.length
    }
  );

}


/* ========================================================
   STOP ALL SOCKETS
======================================================== */

function stopSockets(){

  for(const state of sockets){

    state.reconnecting =
      true;

    state.closed =
      true;

    try{

      state.ws.close();

    }catch(_){}

  }

  sockets = [];

  subscribedSymbols.clear();

}


/* ========================================================
   PING
======================================================== */

function pingSockets(){

  if(!running){
    return;
  }

  const timestamp =
    String(now());

  for(const state of sockets){

    if(
      !state.ws ||
      state.ws.readyState !== WebSocket.OPEN
    ){
      continue;
    }

    try{

      state.ws.send(
        JSON.stringify({
          op:"ping",
          req_id:`ping_${timestamp}`
        })
      );

      state.lastPing =
        now();

    }catch(error){

      engineError(error);

    }

  }

}


/* ========================================================
   WEBSOCKET WATCHDOG
======================================================== */

function socketWatchdog(){

  if(!running){
    return;
  }

  const current =
    now();

  for(const state of sockets){

    if(
      !state.ws ||
      state.closed
    ){
      continue;
    }

    const age =
      current -
      num(
        state.lastMessage,
        current
      );

    if(
      state.connected &&
      age >
      CONFIG.SOCKET_STALE
    ){

      try{

        state.ws.close();

      }catch(_){}

    }

  }

}


/* ========================================================
   SOCKET HEALTH
======================================================== */

function socketHealth(){

  let connected = 0;

  let subscribed = 0;

  let stale = 0;

  for(const state of sockets){

    if(state.connected){
      connected++;
    }

    if(state.subscribed){
      subscribed++;
    }

    if(
      now() -
      num(state.lastMessage,0)
      >
      CONFIG.SOCKET_STALE
    ){

      stale++;

    }

  }

  return {

    total:sockets.length,

    connected,

    subscribed,

    stale,

    symbols:
      subscribedSymbols.size

  };

}
  /* =========================================================
   PART 4/8
   MARKET ANALYSIS ENGINE
   LOCAL LIQUIDITY + WALLS + AGGRESSIVE FLOW
========================================================= */

/* ---------------------------------------------------------
   LOCAL ORDERBOOK STATISTICS
--------------------------------------------------------- */

function localBookStats(symbol){
    const b = books.get(symbol);
    const m = market.get(symbol);

    if(!b || !m || !b.valid || !b.synced){
        return null;
    }

    const price = currentPrice(symbol);

    if(!price || price <= 0){
        return null;
    }

    const bidLevels = [];
    const askLevels = [];

    for(const [p,q] of b.bids.entries()){
        const priceLevel = Number(p);
        const qty = Number(q);

        if(
            Number.isFinite(priceLevel) &&
            Number.isFinite(qty) &&
            priceLevel > 0 &&
            qty > 0
        ){
            bidLevels.push({
                price:priceLevel,
                qty,
                usd:priceLevel * qty,
                distance:Math.abs(priceLevel - price) / price
            });
        }
    }

    for(const [p,q] of b.asks.entries()){
        const priceLevel = Number(p);
        const qty = Number(q);

        if(
            Number.isFinite(priceLevel) &&
            Number.isFinite(qty) &&
            priceLevel > 0 &&
            qty > 0
        ){
            askLevels.push({
                price:priceLevel,
                qty,
                usd:priceLevel * qty,
                distance:Math.abs(priceLevel - price) / price
            });
        }
    }

    if(!bidLevels.length || !askLevels.length){
        return null;
    }

    bidLevels.sort((a,c)=>c.price-a.price);
    askLevels.sort((a,c)=>a.price-c.price);

    const nearLimit = 0.003;

    const nearBids = bidLevels.filter(x=>x.distance <= nearLimit);
    const nearAsks = askLevels.filter(x=>x.distance <= nearLimit);

    const bidUsd = nearBids.reduce((sum,x)=>sum+x.usd,0);
    const askUsd = nearAsks.reduce((sum,x)=>sum+x.usd,0);

    const bestBid = bidLevels[0].price;
    const bestAsk = askLevels[0].price;

    const spread = bestAsk > bestBid
        ? (bestAsk - bestBid) / price
        : 0;

    const bidMedian = median(
        nearBids.map(x=>x.usd)
    );

    const askMedian = median(
        nearAsks.map(x=>x.usd)
    );

    return {
        price,

        bestBid,
        bestAsk,
        spread,

        bidUsd,
        askUsd,

        bidCount:nearBids.length,
        askCount:nearAsks.length,

        bidMedian,
        askMedian,

        bidLevels,
        askLevels,

        timestamp:now()
    };
}


/* ---------------------------------------------------------
   MEDIAN
--------------------------------------------------------- */

function median(values){

    if(!Array.isArray(values) || !values.length){
        return 0;
    }

    const arr = values
        .filter(Number.isFinite)
        .slice()
        .sort((a,b)=>a-b);

    if(!arr.length){
        return 0;
    }

    const middle = Math.floor(arr.length / 2);

    if(arr.length % 2){
        return arr[middle];
    }

    return (arr[middle-1] + arr[middle]) / 2;
}


/* ---------------------------------------------------------
   LOCAL LIQUIDITY BASELINE
--------------------------------------------------------- */

function localLiquidity(symbol){

    const stats = localBookStats(symbol);

    if(!stats){
        return null;
    }

    const bidValues = stats.bidLevels
        .filter(x=>x.distance <= 0.003)
        .map(x=>x.usd);

    const askValues = stats.askLevels
        .filter(x=>x.distance <= 0.003)
        .map(x=>x.usd);

    const all = bidValues.concat(askValues);

    if(!all.length){
        return null;
    }

    const med = median(all);

    const avg = all.reduce(
        (sum,x)=>sum+x,
        0
    ) / all.length;

    const p75 = percentile(all,0.75);

    const p90 = percentile(all,0.90);

    return {
        median:med,
        average:avg,
        p75,
        p90,

        bidMedian:median(bidValues),
        askMedian:median(askValues),

        samples:all.length,

        timestamp:now()
    };
}


/* ---------------------------------------------------------
   PERCENTILE
--------------------------------------------------------- */

function percentile(values,p){

    if(!Array.isArray(values) || !values.length){
        return 0;
    }

    const arr = values
        .filter(Number.isFinite)
        .slice()
        .sort((a,b)=>a-b);

    if(!arr.length){
        return 0;
    }

    const index = (arr.length - 1) * p;
    const lower = Math.floor(index);
    const upper = Math.ceil(index);

    if(lower === upper){
        return arr[lower];
    }

    const weight = index - lower;

    return arr[lower] * (1-weight)
         + arr[upper] * weight;
}


/* ---------------------------------------------------------
   WALL THRESHOLD
--------------------------------------------------------- */

function dynamicWallThreshold(symbol){

    const m = market.get(symbol);
    const liquidity = localLiquidity(symbol);

    const base = baseWallThreshold(symbol);

    if(!liquidity){
        return base;
    }

    /*
       Wall must be large relative to BOTH:
       1. market turnover tier
       2. local orderbook liquidity
    */

    const localReference = Math.max(
        liquidity.p75,
        liquidity.median * CONFIG.WALL_RATIO,
        1
    );

    const adaptive = localReference;

    return Math.max(
        base,
        adaptive
    );
}


/* ---------------------------------------------------------
   WALL CANDIDATES
--------------------------------------------------------- */

function detectWallCandidates(symbol){

    const stats = localBookStats(symbol);
    const liquidity = localLiquidity(symbol);

    if(!stats || !liquidity){
        return [];
    }

    const price = stats.price;

    const threshold = dynamicWallThreshold(symbol);

    const candidates = [];

    function inspect(levels,side){

        for(const level of levels){

            if(level.distance < CONFIG.WALL_MIN_DIST){
                continue;
            }

            if(level.distance > CONFIG.WALL_MAX_DIST){
                continue;
            }

            if(level.usd < threshold){
                continue;
            }

            const localBase =
                side === "BID"
                    ? Math.max(liquidity.bidMedian,1)
                    : Math.max(liquidity.askMedian,1);

            const ratio = level.usd / localBase;

            if(ratio < CONFIG.WALL_RATIO){
                continue;
            }

            candidates.push({
                symbol,
                side,
                price:level.price,
                qty:level.qty,
                usd:level.usd,
                distance:level.distance,
                ratio,
                detected:now(),
                lastSeen:now(),
                samples:1,
                age:0,
                strength:0
            });
        }
    }

    inspect(stats.bidLevels,"BID");
    inspect(stats.askLevels,"ASK");

    return candidates;
}


/* ---------------------------------------------------------
   WALL HISTORY / STABILITY
--------------------------------------------------------- */

function updateWalls(symbol){

    const detected = detectWallCandidates(symbol);
    const map = ensureWalls(symbol);

    const timestamp = now();

    const nextKeys = new Set();

    for(const item of detected){

        const key =
            item.side +
            ":" +
            Math.round(
                item.price / Math.max(
                    Number(instruments.get(symbol)?.tickSize) || 0.00000001,
                    0.00000001
                )
            );

        nextKeys.add(key);

        const previous = map.get(key);

        if(previous){

            const priceDrift =
                Math.abs(
                    previous.price - item.price
                ) / Math.max(item.price,1);

            /*
               If the wall moved too far,
               treat it as a new wall.
            */

            if(priceDrift > 0.0005){

                map.set(key,item);

                continue;
            }

            previous.price = item.price;
            previous.qty = item.qty;
            previous.usd = item.usd;
            previous.distance = item.distance;
            previous.ratio = item.ratio;
            previous.lastSeen = timestamp;
            previous.samples =
                Number(previous.samples || 0) + 1;

            previous.age =
                timestamp - previous.detected;

            previous.strength =
                calculateWallStrength(
                    previous,
                    timestamp
                );

        }else{

            item.strength =
                calculateWallStrength(
                    item,
                    timestamp
                );

            map.set(key,item);
        }
    }

    /*
       Do not instantly delete missing walls.
       This prevents signals from flashing
       for one websocket update and disappearing.
    */

    for(const [key,wall] of map.entries()){

        if(
            !nextKeys.has(key) &&
            timestamp - wall.lastSeen > CONFIG.WALL_TTL
        ){
            map.delete(key);
        }
    }

    return Array.from(map.values());
}


/* ---------------------------------------------------------
   WALL STRENGTH
--------------------------------------------------------- */

function calculateWallStrength(wall,timestamp){

    const age =
        timestamp - Number(wall.detected || timestamp);

    const samples =
        Number(wall.samples || 1);

    const ageScore = clamp(
        age / 15000,
        0,
        1
    );

    const sampleScore = clamp(
        samples / 12,
        0,
        1
    );

    const ratioScore = clamp(
        (Number(wall.ratio || 0) - CONFIG.WALL_RATIO)
        / 8,
        0,
        1
    );

    const distanceScore = clamp(
        1 - (
            Number(wall.distance || 0)
            / CONFIG.WALL_MAX_DIST
        ),
        0,
        1
    );

    return (
        ageScore * 25 +
        sampleScore * 30 +
        ratioScore * 30 +
        distanceScore * 15
    );
}


/* ---------------------------------------------------------
   VALID WALLS
--------------------------------------------------------- */

function validWalls(symbol){

    const map = ensureWalls(symbol);

    const timestamp = now();

    return Array.from(map.values())
        .filter(wall=>{

            const age =
                timestamp -
                Number(wall.detected || timestamp);

            if(age < CONFIG.WALL_MIN_AGE){
                return false;
            }

            if(
                timestamp -
                Number(wall.lastSeen || 0)
                > CONFIG.WALL_TTL
            ){
                return false;
            }

            if(
                Number(wall.samples || 0)
                < CONFIG.WALL_MIN_SAMPLES
            ){
                return false;
            }

            if(
                Number(wall.strength || 0)
                < 25
            ){
                return false;
            }

            return true;
        })
        .sort((a,b)=>b.strength-a.strength);
}


/* ---------------------------------------------------------
   NEAREST WALL
--------------------------------------------------------- */

function nearestWall(symbol,direction){

    const price = currentPrice(symbol);

    if(!price){
        return null;
    }

    const candidates = validWalls(symbol);

    let filtered = candidates;

    if(direction === "LONG"){
        filtered = candidates.filter(
            x=>x.side === "BID"
        );
    }

    if(direction === "SHORT"){
        filtered = candidates.filter(
            x=>x.side === "ASK"
        );
    }

    if(!filtered.length){
        return null;
    }

    filtered.sort(
        (a,b)=>
            Math.abs(a.price-price) -
            Math.abs(b.price-price)
    );

    return filtered[0] || null;
}


/* ---------------------------------------------------------
   TRADE FLOW
--------------------------------------------------------- */

function tradeFlow(symbol){

    const list = trades.get(symbol);

    if(!list || !list.length){
        return null;
    }

    const timestamp = now();

    const windowStart =
        timestamp - CONFIG.TRADE_WINDOW;

    const fastStart =
        timestamp - CONFIG.FAST_WINDOW;

    let buy = 0;
    let sell = 0;

    let fastBuy = 0;
    let fastSell = 0;

    let count = 0;

    for(let i=list.length-1;i>=0;i--){

        const t = list[i];

        if(t.ts < windowStart){
            break;
        }

        const usd =
            Number(t.usd || 0);

        if(!Number.isFinite(usd) || usd <= 0){
            continue;
        }

        count++;

        if(t.side === "Buy"){
            buy += usd;

            if(t.ts >= fastStart){
                fastBuy += usd;
            }

        }else if(t.side === "Sell"){

            sell += usd;

            if(t.ts >= fastStart){
                fastSell += usd;
            }
        }
    }

    const total = buy + sell;

    if(total <= 0){
        return null;
    }

    const delta = buy - sell;

    const fastDelta =
        fastBuy - fastSell;

    const imbalance =
        delta / total;

    const fastTotal =
        fastBuy + fastSell;

    const fastImbalance =
        fastTotal > 0
            ? fastDelta / fastTotal
            : 0;

    return {
        buy,
        sell,
        total,

        fastBuy,
        fastSell,
        fastTotal,

        delta,
        fastDelta,

        imbalance,
        fastImbalance,

        count,

        timestamp
    };
}


/* ---------------------------------------------------------
   FLOW DIRECTION
--------------------------------------------------------- */

function flowDirection(flow){

    if(!flow){
        return null;
    }

    const base =
        Math.max(
            Math.abs(flow.delta),
            Math.abs(flow.fastDelta)
        );

    if(base <= 0){
        return null;
    }

    if(
        flow.delta > 0 &&
        flow.fastDelta > 0
    ){
        return "BUY";
    }

    if(
        flow.delta < 0 &&
        flow.fastDelta < 0
    ){
        return "SELL";
    }

    return null;
}


/* ---------------------------------------------------------
   FLOW STRENGTH
--------------------------------------------------------- */

function flowStrength(symbol,flow){

    if(!flow){
        return 0;
    }

    const threshold =
        baseFlowThreshold(symbol);

    const absDelta =
        Math.abs(flow.delta);

    const absFast =
        Math.abs(flow.fastDelta);

    const magnitudeScore =
        clamp(
            absDelta /
            Math.max(threshold * 2,1),
            0,
            1
        );

    const fastScore =
        clamp(
            absFast /
            Math.max(CONFIG.MIN_FAST_FLOW * 4,1),
            0,
            1
        );

    const imbalanceScore =
        clamp(
            Math.abs(flow.imbalance),
            0,
            1
        );

    return (
        magnitudeScore * 45 +
        fastScore * 30 +
        imbalanceScore * 25
    );
}


/* ---------------------------------------------------------
   FLOW QUALIFICATION
--------------------------------------------------------- */

function qualifyFlow(symbol,flow){

    if(!flow){
        return {
            valid:false,
            direction:null,
            strength:0,
            reason:"NO_FLOW"
        };
    }

    const threshold =
        baseFlowThreshold(symbol);

    const direction =
        flowDirection(flow);

    if(!direction){

        return {
            valid:false,
            direction:null,
            strength:0,
            reason:"MIXED_FLOW"
        };
    }

    const absDelta =
        Math.abs(flow.delta);

    const absFast =
        Math.abs(flow.fastDelta);

    if(absDelta < threshold){

        return {
            valid:false,
            direction,
            strength:flowStrength(symbol,flow),
            reason:"FLOW_BELOW_THRESHOLD"
        };
    }

    if(absFast < CONFIG.MIN_FAST_FLOW){

        return {
            valid:false,
            direction,
            strength:flowStrength(symbol,flow),
            reason:"FAST_FLOW_WEAK"
        };
    }

    return {
        valid:true,
        direction,
        strength:flowStrength(symbol,flow),
        reason:"FLOW_CONFIRMED"
    };
}


/* ---------------------------------------------------------
   WALL / FLOW COMPATIBILITY
--------------------------------------------------------- */

function wallSupportsDirection(wall,direction,price){

    if(!wall || !direction || !price){
        return false;
    }

    if(direction === "LONG"){

        if(wall.side !== "BID"){
            return false;
        }

        /*
           Bid wall should be below current price.
        */

        return wall.price <= price;

    }

    if(direction === "SHORT"){

        if(wall.side !== "ASK"){
            return false;
        }

        /*
           Ask wall should be above current price.
        */

        return wall.price >= price;
    }

    return false;
}


/* ---------------------------------------------------------
   PRICE / WALL GEOMETRY
--------------------------------------------------------- */

function wallDistance(symbol,wall){

    const price = currentPrice(symbol);

    if(!price || !wall){
        return Infinity;
    }

    return Math.abs(
        wall.price-price
    ) / price;
}


/* ---------------------------------------------------------
   REACTION ZONE
--------------------------------------------------------- */

function reactionZone(symbol,wall){

    const price = currentPrice(symbol);

    if(!price || !wall){
        return null;
    }

    const distance =
        Math.abs(price-wall.price) / price;

    if(distance > CONFIG.REACTION_DIST){
        return null;
    }

    return {
        active:true,
        symbol,
        side:wall.side,
        wallPrice:wall.price,
        currentPrice:price,
        distance,
        near:true,
        timestamp:now()
    };
}


/* ---------------------------------------------------------
   BASIC MARKET QUALITY
--------------------------------------------------------- */

function marketQuality(symbol){

    const b = books.get(symbol);
    const t = trades.get(symbol);

    if(!b || !t){
        return 0;
    }

    const bookAge =
        now() - Number(b.lastRx || 0);

    const tradeList =
        t.length
            ? t
            : [];

    const lastTrade =
        tradeList.length
            ? tradeList[tradeList.length-1]
            : null;

    const tradeAge =
        lastTrade
            ? now() - Number(lastTrade.ts || 0)
            : Infinity;

    let score = 100;

    if(bookAge > 1000){
        score -= 15;
    }

    if(bookAge > CONFIG.BOOK_STALE){
        score -= 40;
    }

    if(tradeAge > 1500){
        score -= 15;
    }

    if(tradeAge > CONFIG.TRADE_STALE){
        score -= 30;
    }

    if(b.spread > 0.001){
        score -= 15;
    }

    if(!b.valid || !b.synced){
        score -= 50;
    }

    return clamp(score,0,100);
}


/* ---------------------------------------------------------
   WALL SCORE
--------------------------------------------------------- */

function wallScore(wall){

    if(!wall){
        return 0;
    }

    const strength =
        Number(wall.strength || 0);

    const ratio =
        Number(wall.ratio || 0);

    const distance =
        Number(wall.distance || 0);

    const ratioScore =
        clamp(
            (ratio - CONFIG.WALL_RATIO) / 10,
            0,
            1
        ) * 45;

    const strengthScore =
        clamp(
            strength / 100,
            0,
            1
        ) * 35;

    const proximityScore =
        clamp(
            1 -
            distance / CONFIG.WALL_MAX_DIST,
            0,
            1
        ) * 20;

    return (
        ratioScore +
        strengthScore +
        proximityScore
    );
}


/* ---------------------------------------------------------
   FLOW + WALL INITIAL SETUP
--------------------------------------------------------- */

function evaluateSetupCandidate(symbol){

    const setup =
        ensureSetup(symbol);

    const price =
        currentPrice(symbol);

    if(!price){
        return null;
    }

    const quality =
        marketQuality(symbol);

    if(quality < CONFIG.MIN_QUALITY){
        return null;
    }

    const flow =
        tradeFlow(symbol);

    const qualified =
        qualifyFlow(symbol,flow);

    if(!qualified.valid){
        return null;
    }

    const direction =
        qualified.direction === "BUY"
            ? "LONG"
            : "SHORT";

    const wall =
        nearestWall(symbol,direction);

    if(!wall){
        return null;
    }

    if(!wallSupportsDirection(
        wall,
        direction,
        price
    )){
        return null;
    }

    const distance =
        wallDistance(symbol,wall);

    if(
        !Number.isFinite(distance) ||
        distance > CONFIG.WALL_MAX_DIST
    ){
        return null;
    }

    const reaction =
        reactionZone(symbol,wall);

    const wScore =
        wallScore(wall);

    const fScore =
        qualified.strength;

    const qScore =
        quality;

    const proximity =
        clamp(
            1 -
            distance / CONFIG.WALL_MAX_DIST,
            0,
            1
        ) * 20;

    const total =
        qScore * 0.25 +
        fScore * 0.35 +
        wScore * 0.25 +
        proximity;

    return {
        symbol,
        direction,
        price,
        wall,
        flow,
        qualified,
        quality,
        wallScore:wScore,
        flowScore:fScore,
        proximity,
        reaction,
        score:clamp(total,0,100),
        timestamp:now()
    };
}


/* ---------------------------------------------------------
   WATCH STATE
--------------------------------------------------------- */

function updateWatchState(symbol,candidate){

    const setup =
        ensureSetup(symbol);

    if(!candidate){

        if(
            setup.state === "WATCH" &&
            now() - setup.updated > CONFIG.RETEST_TIMEOUT
        ){
            setup.state = "IDLE";
            setup.direction = null;
            setup.wall = null;
            setup.reason = "WATCH_TIMEOUT";
            setup.updated = now();
        }

        return setup;
    }

    const timestamp = now();

    /*
       Prevent instant LONG -> SHORT flipping.
    */

    if(
        setup.direction &&
        setup.direction !== candidate.direction &&
        setup.state !== "IDLE"
    ){

        setup.invalidReason =
            "OPPOSITE_DIRECTION_BLOCKED";

        setup.updated = timestamp;

        return setup;
    }

    setup.state = "WATCH";
    setup.direction = candidate.direction;
    setup.wall = candidate.wall;
    setup.quality = candidate.quality;
    setup.updated = timestamp;
    setup.reason =
        candidate.reaction
            ? "WALL_REACTION_ZONE"
            : "WALL_FLOW_ALIGNMENT";

    setup.lastPrice =
        candidate.price;

    setup.lastWallPrice =
        candidate.wall.price;

    setup.confirmation =
        candidate.score;

    return setup;
}


/* ---------------------------------------------------------
   SCANNER CANDIDATE
--------------------------------------------------------- */

function analyzeSymbol(symbol){

    try{

        const candidate =
            evaluateSetupCandidate(symbol);

        updateWatchState(
            symbol,
            candidate
        );

        return candidate;

    }catch(error){

        engineError(
            "analyzeSymbol:" + symbol,
            error
        );

        return null;
    }
}


/* ---------------------------------------------------------
   WALL COUNT
--------------------------------------------------------- */

function countValidWalls(){

    let count = 0;

    for(const symbol of universe()){

        count +=
            validWalls(symbol).length;
    }

    return count;
}


/* ---------------------------------------------------------
   CANDIDATE COUNT
--------------------------------------------------------- */

function countCandidates(){

    let count = 0;

    for(const setup of setups.values()){

        if(
            setup.state === "WATCH" ||
            setup.state === "CONFIRM"
        ){
            count++;
        }
    }

    return count;
}


/* ---------------------------------------------------------
   ENGINE SCAN
--------------------------------------------------------- */

function scanOneSymbol(){

    const symbols =
        universe();

    if(!symbols.length){
        return null;
    }

    if(
        scanCursor >= symbols.length
    ){
        scanCursor = 0;
    }

    const symbol =
        symbols[scanCursor];

    scanCursor++;

    /*
       Update wall state first.
    */

    updateWalls(symbol);

    /*
       Then analyze flow + wall relation.
    */

    return analyzeSymbol(symbol);
}


/* ---------------------------------------------------------
   SCAN LOOP
--------------------------------------------------------- */

function startAnalysisLoop(){

    if(scanTimer){
        clearInterval(scanTimer);
    }

    scanTimer =
        setInterval(
            ()=>{
                if(!running){
                    return;
                }

                const started =
                    performance.now();

                scanOneSymbol();

                lastEngine =
                    now();

                const elapsed =
                    performance.now() -
                    started;

                if(
                    elapsed >
                    CONFIG.SCAN_MS * 0.9
                ){
                    /*
                       Heavy cycle warning is intentionally
                       kept internal; UI diagnostics will
                       report aggregate health later.
                    */
                }

            },
            CONFIG.SCAN_MS
        );
}


/* ---------------------------------------------------------
   ANALYSIS HEALTH
--------------------------------------------------------- */

function analysisHealth(){

    const symbols =
        universe();

    let freshBooks = 0;
    let freshTrades = 0;
    let qualitySum = 0;
    let qualityCount = 0;

    for(const symbol of symbols){

        if(freshBook(symbol)){
            freshBooks++;
        }

        if(freshTrades(symbol)){
            freshTrades++;
        }

        const q =
            marketQuality(symbol);

        if(q > 0){
            qualitySum += q;
            qualityCount++;
        }
    }

    return {
        symbols:symbols.length,
        freshBooks,
        freshTrades,
        bookCoverage:
            symbols.length
                ? freshBooks / symbols.length
                : 0,
        tradeCoverage:
            symbols.length
                ? freshTrades / symbols.length
                : 0,
        quality:
            qualityCount
                ? qualitySum / qualityCount
                : 0,
        walls:countValidWalls(),
        candidates:countCandidates()
    };
}
