
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bybit Smart Fade Scanner PRO v9</title>
<style>
:root{--bg:#0b0e11;--card:#161b22;--txt:#eaecef;--mut:#9ca3af;--g:#00C076;--r:#F6465D;--y:#F0B90B}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px -apple-system,BlinkMacSystemFont,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.card{background:var(--card);border-radius:16px;padding:12px}
.big{font-size:22px;font-weight:700}.row{display:flex;gap:8px;align-items:center}.btn{flex:1;padding:12px;border:0;border-radius:12px;font-weight:700;color:#fff}
.g{background:var(--g)}.r{background:var(--r)}.y{background:var(--y);color:#111}
.signal{background:#14181f;border-left:5px solid var(--r);border-radius:14px;padding:12px;margin:10px 0}
.badge{padding:4px 8px;border-radius:999px;background:#222}.mut{color:var(--mut);font-size:12px}
.bar{height:8px;background:#222;border-radius:999px;overflow:hidden}.fill{height:100%;background:var(--g);width:0}
canvas{width:100%;height:140px;background:#0f1419;border-radius:10px}
select{width:100%;padding:10px;border-radius:10px;background:#0f1419;color:#fff;border:1px solid #2b3139}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h2>Smart Fade Scanner PRO v9</h2><div id="status" class="badge">OFFLINE</div></div>

<div class="grid">
<div class="card"><div id="coins" class="big">0</div><div class="mut">Coins</div></div>
<div class="card"><div id="ws" class="big">0</div><div class="mut">WS</div></div>
<div class="card"><div id="watch" class="big">0</div><div class="mut">Watching</div></div>
<div class="card"><div id="sig" class="big">0</div><div class="mut">Signals</div></div>
</div>

<div class="row">
<button id="start" class="btn g">START</button>
<button id="stop" class="btn r">STOP</button>
<button id="clear" class="btn y">CLEAR</button>
</div>

<div class="card" style="margin-top:12px">
<h3>Режим</h3>
<div class="row">
<select id="mode"><option value="70">Aggressive</option><option value="78" selected>Balanced</option><option value="88">Strict</option></select>
<select id="watchSec"><option>60</option><option selected>120</option><option>180</option></select>
</div>
</div>

<div class="card"><h3>CVD (реальное время)</h3><canvas id="cvd" width="900" height="140"></canvas></div>
<div class="card"><h3>Whale Trap</h3><div class="bar"><div id="trap" class="fill"></div></div></div>

<h3>Активные сигналы</h3>
<div id="signals"></div>

<script>
const CFG={REST:"https://api.bybit.com/v5/market/tickers?category=linear",WS:"wss://stream.bybit.com/v5/public/linear",MAX:100,BATCH:10,REPEAT:900000};
const $=id=>document.getElementById(id);

class Scanner{
 constructor(){this.ws=null;this.symbols=[];this.market={};this.cvd=[];this.loop=null;}
 async start(){
   if(this.ws)return;
   await this.load();
   this.connect();
   this.loop=setInterval(()=>this.drawCVD(),500);
 }
 stop(){clearInterval(this.loop);if(this.ws){this.ws.close();this.ws=null;$("status").textContent="STOPPED";}}
 async load(){
   const j=await(await fetch(CFG.REST)).json();
   this.symbols=j.result.list.filter(x=>x.symbol.endsWith("USDT"))
      .sort((a,b)=>+b.turnover24h-+a.turnover24h)
      .slice(0,CFG.MAX).map(x=>x.symbol);
   this.symbols.forEach(s=>this.market[s]={price:0,trades:[],candles:[],book:null,state:"IDLE",pumpHigh:0,pumpLow:0,pumpStart:0,lastSignal:0,retests:0});
   $("coins").textContent=this.symbols.length;
 }
 connect(){
   this.ws=new WebSocket(CFG.WS);
   this.ws.onopen=()=>{$("status").textContent="ONLINE";this.subscribe()};
   this.ws.onclose=()=>{$("status").textContent="RECONNECT";setTimeout(()=>this.connect(),3000)};
   this.ws.onmessage=e=>this.onMsg(JSON.parse(e.data));
 }
 subscribe(){
   let i=0;
   const timer=setInterval(()=>{
     if(i>=this.symbols.length)return clearInterval(timer);
     const args=[];
     this.symbols.slice(i,i+CFG.BATCH).forEach(s=>args.push("publicTrade."+s,"kline.1."+s,"orderbook.50."+s));
     this.ws.send(JSON.stringify({op:"subscribe",args}));
     $("ws").textContent=Math.min(CFG.MAX,i+CFG.BATCH);
     i+=CFG.BATCH;
   },250);
 }
 onMsg(m){
   if(!m.topic)return;
   const p=m.topic.split("."),type=p[0],sym=p[p.length-1],mk=this.market[sym];
   if(!mk)return;

   if(type==="publicTrade"){
      m.data.forEach(t=>{
        mk.price=+t.p;
        mk.trades.push({p:+t.p,v:+t.v,s:t.S,t:+t.T});
        if(mk.trades.length>450)mk.trades.shift();
        const last=this.cvd.length?this.cvd[this.cvd.length-1]:0;
        this.cvd.push(last+(t.S==="Buy"?1:-1)*t.v);
        if(this.cvd.length>300)this.cvd.shift();
      });
      this.onTradeEvent(sym);
   }

   if(type==="kline"){
      const k=m.data[0];
      mk.candles.push({h:+k.high,l:+k.low,c:+k.close,v:+k.volume});
      if(mk.candles.length>120)mk.candles.shift();
   }

   if(type==="orderbook")mk.book=m.data;
 }
 flow(m){
   let buy=0,sell=0,n=Date.now();
   m.trades.forEach(t=>{
      if(n-t.t<10000){
         const usd=t.p*t.v;
         if(t.s==="Buy")buy+=usd; else sell+=usd;
      }
   });
   return {buy,sell,ratio:sell/(buy||1)};
 }
 structure(c){
   if(c.length<8)return false;
   const a=c.at(-4),b=c.at(-2);
   return b.h<a.h&&b.l<a.l;
 }
 dynamicWall(m){
   if(!m.book||!m.book.a||!m.book.b)return 0;
   const asks=m.book.a.slice(0,8).reduce((s,x)=>s+Number(x[1]),0);
   const bids=m.book.b.slice(0,8).reduce((s,x)=>s+Number(x[1]),0);
   return asks>bids*1.7?10:0;
 }
 score(m){
   if(m.candles.length<20)return 0;
   const last=m.candles.at(-1);
   const avg=m.candles.slice(-20).reduce((s,x)=>s+x.v,0)/20||1;
   const pump=(m.pumpHigh-m.pumpLow)/(m.pumpLow||1)*100;
   const f=this.flow(m);
   let s=0;
   if(pump>8)s+=25;else if(pump>5)s+=18;
   if(last.v>avg*3)s+=20;else if(last.v>avg*2)s+=12;
   if(this.structure(m.candles))s+=25;
   if(f.ratio>2)s+=20;else if(f.ratio>1.5)s+=10;
   s+=this.dynamicWall(m);
   return Math.min(100,s);
 }
 render(sym,m,score,retest=false){
   const e=m.price,sl=m.pumpHigh*1.002,R=sl-e,tp1=e-R,tp2=e-R*2;
   const div=document.createElement("div");
   div.className="signal";
   div.innerHTML=`<div class="row" style="justify-content:space-between"><b>${retest?"🔁 RETEST":"🔴 SHORT"} ${sym}</b><span>${score}/100</span></div>
   <div class="mut">Entry ${e.toFixed(5)} • SL ${sl.toFixed(5)}</div>
   <div class="mut">TP1 ${tp1.toFixed(5)} • TP2 ${tp2.toFixed(5)}</div>
   <div class="mut">Whale Trap • Dynamic Wall • CVD</div>`;
   $("signals").prepend(div);
   $("sig").textContent=+$("sig").textContent+1;
   try{
      if(window.AudioContext||window.webkitAudioContext){
        const ctx=new(window.AudioContext||window.webkitAudioContext)();
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.frequency.value=retest?660:880;
        o.connect(g);g.connect(ctx.destination);g.gain.value=.03;
        o.start();o.stop(ctx.currentTime+.12);
      }
   }catch(e){}
 }
 onTradeEvent(sym){
   const m=this.market[sym];
   if(m.candles.length<20)return;
   const last=m.candles.at(-1),c5=m.candles.at(-6);
   const pump=(last.c-c5.c)/c5.c*100;

   if(pump>5&&m.state==="IDLE"){
      m.state="WATCH";
      m.pumpHigh=last.h;
      m.pumpLow=c5.l;
      m.pumpStart=Date.now();
   }

   if(m.state!=="WATCH")return;

   if(Date.now()-m.pumpStart>+$("watchSec").value*1000){
      m.state="IDLE";
      return;
   }

   const score=this.score(m);
   $("watch").textContent=Object.values(this.market).filter(x=>x.state==="WATCH").length;
   $("trap").style.width=Math.min(100,this.flow(m).ratio*25)+"%";

   if(score<+$("mode").value)return;
   if(!this.structure(m.candles))return;

   if(Date.now()-m.lastSignal>CFG.REPEAT){
      m.lastSignal=Date.now();
      m.retests=0;
      this.render(sym,m,score,false);
      return;
   }

   const nearTop=(m.pumpHigh-m.price)/m.pumpHigh<0.01;
   if(nearTop&&m.retests===0&&Date.now()-m.lastSignal<30000){
      m.retests++;
      this.render(sym,m,score,true);
   }
 }
 drawCVD(){
   const c=$("cvd"),ctx=c.getContext("2d");
   ctx.clearRect(0,0,c.width,c.height);
   if(this.cvd.length<2)return;
   const mn=Math.min(...this.cvd),mx=Math.max(...this.cvd),r=mx-mn||1;
   ctx.beginPath();ctx.strokeStyle="#00C076";ctx.lineWidth=2;
   this.cvd.forEach((v,i)=>{const x=i/(this.cvd.length-1)*c.width,y=c.height-(v-mn)/r*c.height;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
   ctx.stroke();
 }
}
const scanner=new Scanner();
$("start").onclick=()=>scanner.start();
$("stop").onclick=()=>scanner.stop();
$("clear").onclick=()=>{$("signals").innerHTML="";$("sig").textContent=0;}
</script>
</body>
</html>
